[
  "Cover slide. Day 4 continues from blockchain basics: we know how Bitcoin works — now, how do you securely hold it? Today's central question: what happens when a single secret isn't enough to protect serious value?",
  "Today has four parts. First we examine why a single private key is a liability. Then we define multi-signature wallets. Third, we trace a real transaction step by step. Finally, we evaluate what multi-sig actually protects against — and what it doesn't.",
  "Part 1 transition. We've been assuming Bitcoin security is simple — just don't lose your key. That assumption hides a serious problem. Let's look at what the problem actually is.",
  "Bitcoin is a very valuable currency worth protecting. But there's a huge security flaw: it's only protected by 12 words that must be stored securely. If anyone has access to these 12 words, you risk losing everything — instantly and irreversibly.",
  "Using your private key in third-party services makes it open to attacks from hackers. You're trusting companies like Coinbase to store these keys and maintain enough security to prevent your funds from being stolen.",
  "Part 2 transition. The custodial model just relocates the trust problem — you haven't solved it, you've delegated it. What if instead of making the key harder to steal, we required multiple keys to authorize any transaction at all?",
  "Each signer generates their own seed phrase independently — Alice, Bob, and Carol each have 12 words that no one else sees. That seed deterministically produces their private key, which is then used to derive their public key via elliptic curve multiplication. The wallet's spending script is assembled from the three public keys. No co-signer ever shares a seed or private key; only public keys are combined.",
  "Interactive: ask students to try each combination. Use the threshold selector to change between 1-of-3, 2-of-3, and 3-of-3 and observe how the required count changes. Key idea — the wallet script names specific public keys. Eve's signature fails not because it is weak, but because her public key is not registered in the spending script.",
  "To store these keys, it makes sense to put them in different locations. The first key in a phone or hardware wallet for daily use. The second in an offline safe as a cold backup. The third on a multi-sig provider server as a remote co-signer.",
  "Part 3 transition. We understand the structure — now let's trace what actually happens when you spend bitcoin from a multi-sig wallet, step by step.",
  "When you buy a cup of coffee, you initiate the transaction and sign it with the key on your phone. But one signature isn't enough — the transaction is only partially signed at this point and cannot broadcast to the network.",
  "Once the transaction passes all checks, the provider signs on their own behalf. This satisfies the two-key rule. Two signatures, threshold met — the transaction is broadcast to the Bitcoin network.",
  "Part 4 transition. We've seen how multi-sig works mechanically. Now let's stress-test it: what threats does it actually defend against?",
  "If you lose your phone, someone could have access to one private key. In a standard single-key Bitcoin wallet, that would be catastrophic. In a multi-sig wallet — would that be enough?",
  "No. You can still access your own money with your other two keys. The attacker holds one signature — the threshold requires two. Your offline safe and provider server hold the others, unreachable by the thief.",
  "Multi-sig allows you to recreate credit card fraud protection for crypto wallets. Every transaction requires a co-signature from a party that can independently verify and flag suspicious activity.",
  "A person with a single key won't be enough to confirm and sign any transactions without another key. No single key has full authority over the wallet — that's the fundamental security guarantee.",
  "The core insight: multi-sig distributes trust the same way a bank vault requires two officers to open. Bitcoin enforces this natively, in the protocol, without any middleman.",
  "Next class preview. Ask students: Bitcoin scripts verify signatures — what if the script could verify anything a programming language can express? That's the leap Ethereum made."
]

        class DeckStage extends HTMLElement {
          static get observedAttributes() { return ['width', 'height', 'noscale']; }

          constructor() {
            super();
            this._root = this.attachShadow({ mode: 'open' });
            this._index = 0;
            this._slides = [];
            this._notes = [];
            this._hideTimer = null;
            this._mouseIdleTimer = null;
            this._storageKey = STORAGE_PREFIX + (location.pathname || '/');

            this._onKey = this._onKey.bind(this);
            this._onResize = this._onResize.bind(this);
            this._onSlotChange = this._onSlotChange.bind(this);
            this._onMouseMove = this._onMouseMove.bind(this);
            this._onTapBack = this._onTapBack.bind(this);
            this._onTapForward = this._onTapForward.bind(this);
          }

          get designWidth() {
            return parseInt(this.getAttribute('width'), 10) || DESIGN_W_DEFAULT;
          }
          get designHeight() {
            return parseInt(this.getAttribute('height'), 10) || DESIGN_H_DEFAULT;
          }

          connectedCallback() {
            this._render();
            this._loadNotes();
            this._syncPrintPageRule();
            window.addEventListener('keydown', this._onKey);
            window.addEventListener('resize', this._onResize);
            window.addEventListener('mousemove', this._onMouseMove, { passive: true });
          }

          disconnectedCallback() {
            window.removeEventListener('keydown', this._onKey);
            window.removeEventListener('resize', this._onResize);
            window.removeEventListener('mousemove', this._onMouseMove);
            if (this._hideTimer) clearTimeout(this._hideTimer);
            if (this._mouseIdleTimer) clearTimeout(this._mouseIdleTimer);
          }

          attributeChangedCallback() {
            if (this._canvas) {
              this._canvas.style.width = this.designWidth + 'px';
              this._canvas.style.height = this.designHeight + 'px';
              this._canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
              this._canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');
              this._fit();
              this._syncPrintPageRule();
            }
          }

          _render() {
            const style = document.createElement('style');
            style.textContent = stylesheet;

            const stage = document.createElement('div');
            stage.className = 'stage';

            const canvas = document.createElement('div');
            canvas.className = 'canvas';
            canvas.style.width = this.designWidth + 'px';
            canvas.style.height = this.designHeight + 'px';
            canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
            canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');

            const slot = document.createElement('slot');
            slot.addEventListener('slotchange', this._onSlotChange);
            canvas.appendChild(slot);
            stage.appendChild(canvas);

            const tapzones = document.createElement('div');
            tapzones.className = 'tapzones export-hidden';
            tapzones.setAttribute('aria-hidden', 'true');
            const tzBack = document.createElement('div');
            tzBack.className = 'tapzone tapzone--back';
            const tzMid = document.createElement('div');
            tzMid.className = 'tapzone tapzone--mid';
            tzMid.style.pointerEvents = 'none';
            const tzFwd = document.createElement('div');
            tzFwd.className = 'tapzone tapzone--fwd';
            tzBack.addEventListener('click', this._onTapBack);
            tzFwd.addEventListener('click', this._onTapForward);
            tapzones.append(tzBack, tzMid, tzFwd);

            const overlay = document.createElement('div');
            overlay.className = 'overlay export-hidden';
            overlay.setAttribute('role', 'toolbar');
            overlay.setAttribute('aria-label', 'Deck controls');
            overlay.innerHTML = `
        <button class="btn prev" type="button" aria-label="Previous slide" title="Previous (←)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
        </button>
        <span class="count" aria-live="polite"><span class="current">1</span><span class="sep">/</span><span class="total">1</span></span>
        <button class="btn next" type="button" aria-label="Next slide" title="Next (→)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        </button>
        <span class="divider"></span>
        <button class="btn reset" type="button" aria-label="Reset to first slide" title="Reset (R)">Reset<span class="kbd">R</span></button>
        <button class="btn presenter" type="button" aria-label="Open presenter view" title="Presenter view (P)">Presenter<span class="kbd">P</span></button>
      `;

            overlay.querySelector('.prev').addEventListener('click', () => this._go(this._index - 1, 'click'));
            overlay.querySelector('.next').addEventListener('click', () => this._go(this._index + 1, 'click'));
            overlay.querySelector('.reset').addEventListener('click', () => this._go(0, 'click'));
            overlay.querySelector('.presenter').addEventListener('click', () => {
              window.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true }));
            });

            this._root.append(style, stage, tapzones, overlay);
            this._canvas = canvas;
            this._slot = slot;
            this._overlay = overlay;
            this._countEl = overlay.querySelector('.current');
            this._totalEl = overlay.querySelector('.total');
          }

          _syncPrintPageRule() {
            const id = 'deck-stage-print-page';
            let tag = document.getElementById(id);
            if (!tag) {
              tag = document.createElement('style');
              tag.id = id;
              document.head.appendChild(tag);
            }
            tag.textContent =
              '@page { size: ' + this.designWidth + 'px ' + this.designHeight + 'px; margin: 0; } ' +
              '@media print { html, body { margin: 0 !important; padding: 0 !important; background: none !important; overflow: visible !important; height: auto !important; } ' +
              '* { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }';
          }

          _onSlotChange() {
            this._collectSlides();
            this._restoreIndex();
            this._applyIndex({ showOverlay: false, broadcast: true, reason: 'init' });
            this._fit();
          }

          _collectSlides() {
            const assigned = this._slot.assignedElements({ flatten: true });
            this._slides = assigned.filter((el) => {
              const tag = el.tagName;
              return tag !== 'TEMPLATE' && tag !== 'SCRIPT' && tag !== 'STYLE';
            });

            this._slides.forEach((slide, i) => {
              const n = i + 1;
              let label = slide.getAttribute('data-label');
              if (!label) {
                const existing = slide.getAttribute('data-screen-label');
                if (existing) {
                  label = existing.replace(/^\s*\d+\s*/, '').trim() || existing;
                }
              }
              if (!label) {
                const h = slide.querySelector('h1, h2, h3, [data-title]');
                if (h) label = (h.textContent || '').trim().slice(0, 40);
              }
              if (!label) label = 'Slide';
              slide.setAttribute('data-screen-label', `${pad2(n)} ${label}`);

              if (!slide.hasAttribute('data-om-validate')) {
                slide.setAttribute('data-om-validate', VALIDATE_ATTR);
              }

              slide.setAttribute('data-deck-slide', String(i));
            });

            if (this._totalEl) this._totalEl.textContent = String(this._slides.length || 1);
            if (this._index >= this._slides.length) this._index = Math.max(0, this._slides.length - 1);
          }

          _loadNotes() {
            const tag = document.getElementById('speaker-notes');
            if (!tag) { this._notes = []; return; }
            try {
              const parsed = JSON.parse(tag.textContent || '[]');
              if (Array.isArray(parsed)) this._notes = parsed;
            } catch (e) {
              console.warn('[deck-stage] Failed to parse #speaker-notes JSON:', e);
              this._notes = [];
            }
          }

          _restoreIndex() {
            try {
              const raw = localStorage.getItem(this._storageKey);
              if (raw != null) {
                const n = parseInt(raw, 10);
                if (Number.isFinite(n) && n >= 0 && n < this._slides.length) {
                  this._index = n;
                }
              }
            } catch (e) { /* ignore */ }
          }

          _persistIndex() {
            try { localStorage.setItem(this._storageKey, String(this._index)); }
            catch (e) { /* ignore */ }
          }

          _applyIndex({ showOverlay = true, broadcast = true, reason = 'init' } = {}) {
            if (!this._slides.length) return;
            const prev = this._prevIndex == null ? -1 : this._prevIndex;
            const curr = this._index;
            this._slides.forEach((s, i) => {
              if (i === curr) s.setAttribute('data-deck-active', '');
              else s.removeAttribute('data-deck-active');
            });
            if (this._countEl) this._countEl.textContent = String(curr + 1);
            this._persistIndex();

            if (broadcast) {
              try { window.postMessage({ slideIndexChanged: curr }, '*'); } catch (e) { }

              const detail = {
                index: curr,
                previousIndex: prev,
                total: this._slides.length,
                slide: this._slides[curr] || null,
                previousSlide: prev >= 0 ? (this._slides[prev] || null) : null,
                reason: reason,
              };
              this.dispatchEvent(new CustomEvent('slidechange', {
                detail,
                bubbles: true,
                composed: true,
              }));
            }

            this._prevIndex = curr;
            if (showOverlay) this._flashOverlay();
          }

          _flashOverlay() {
            if (!this._overlay) return;
            this._overlay.setAttribute('data-visible', '');
            if (this._hideTimer) clearTimeout(this._hideTimer);
            this._hideTimer = setTimeout(() => {
              this._overlay.removeAttribute('data-visible');
            }, OVERLAY_HIDE_MS);
          }

          _fit() {
            if (!this._canvas) return;
            if (this.hasAttribute('noscale')) {
              this._canvas.style.transform = 'none';
              return;
            }
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const s = Math.min(vw / this.designWidth, vh / this.designHeight);
            this._canvas.style.transform = `scale(${s})`;
          }

          _onResize() { this._fit(); }
          _onMouseMove() { this._flashOverlay(); }

          _onTapBack(e) {
            e.preventDefault();
            this._go(this._index - 1, 'tap');
          }

          _onTapForward(e) {
            e.preventDefault();
            this._go(this._index + 1, 'tap');
          }

          _onKey(e) {
            const t = e.target;
            if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
            if (e.metaKey || e.ctrlKey || e.altKey) return;

            const key = e.key;
            let handled = true;

            if (key === 'ArrowRight' || key === 'PageDown' || key === ' ' || key === 'Spacebar') {
              this._go(this._index + 1, 'keyboard');
            } else if (key === 'ArrowLeft' || key === 'PageUp') {
              this._go(this._index - 1, 'keyboard');
            } else if (key === 'Home') {
              this._go(0, 'keyboard');
            } else if (key === 'End') {
              this._go(this._slides.length - 1, 'keyboard');
            } else if (key === 'r' || key === 'R') {
              this._go(0, 'keyboard');
            } else if (/^[0-9]$/.test(key)) {
              const n = key === '0' ? 9 : parseInt(key, 10) - 1;
              if (n < this._slides.length) this._go(n, 'keyboard');
            } else {
              handled = false;
            }

            if (handled) {
              e.preventDefault();
              this._flashOverlay();
            }
          }

          _go(i, reason = 'api') {
            if (!this._slides.length) return;
            const clamped = Math.max(0, Math.min(this._slides.length - 1, i));
            if (clamped === this._index) {
              this._flashOverlay();
              return;
            }
            this._index = clamped;
            this._applyIndex({ showOverlay: true, broadcast: true, reason });
          }

          get index() { return this._index; }
          get length() { return this._slides.length; }
          goTo(i) { this._go(i, 'api'); }
          next() { this._go(this._index + 1, 'api'); }
          prev() { this._go(this._index - 1, 'api'); }
          reset() { this._go(0, 'api'); }
        }

        if (!customElements.get('deck-stage')) {
          customElements.define('deck-stage', DeckStage);
        }
      })();

    </script>

          const [threshold, setThreshold] = React.useState(2);
          const [selected, setSelected] = React.useState(new Set());

          const toggle = (id) => setSelected(prev => {
            const next = new Set(prev);
            next.has(id) ? next.delete(id) : next.add(id);
            return next;
          });

          const validCount = [...selected].filter(id => MULTISIG_SIGNERS.find(s => s.id === id)?.auth).length;

          const approved = validCount >= threshold;
          const anySelected = selected.size > 0;

          let resultTitle = 'Select signers to begin';

          if (anySelected) {

              if (validCount === 0 && hasEve) {

                resultSub   = "The network only checks against the public keys registered at wallet creation.";

              } else {
                resultTitle = `Rejected — need ${threshold} signature${threshold !== 1 ? 's' : ''}, have ${validCount}`;
                resultSub   = `${threshold - validCount} more valid signature${threshold - validCount !== 1 ? 's' : ''} required.`;
              }
            }
          }

          return (

                    <button key={m} onClick={() => setThreshold(m)} style={{
                      fontFamily: FONTS.mono, fontSize: 24, fontWeight: 600,
                      padding: '10px 28px', borderRadius: 8, letterSpacing: '0.04em',
                      border: `2.5px solid ${threshold === m ? GOLD : 'rgba(255,255,255,0.28)'}`,

                      color: threshold === m ? COLORS.ink : 'rgba(245,239,227,0.6)',

            const s = stage();
            if (!s) return { index: 0, total: 1 };
            const slides = s.querySelectorAll(':scope > [data-deck-slide]');
            let idx = 0;
            slides.forEach((el, i) => { if (el.hasAttribute('data-deck-active')) idx = i; });
            return { index: idx, total: slides.length || 1 };
          };
          const pushSlide = (target) => {
            const win = target || presenterWin;
            if (!win) return;
            try { const cur = currentIndex(); win.postMessage({ type: 'slide', index: cur.index, total: cur.total }, '*'); } catch (_) {}
          };
          const openPresenter = () => {
            if (presenterWin && !presenterWin.closed) { try { presenterWin.focus(); } catch (_) {} return; }
            const url = location.pathname + '?' + PARAM + '=1' + location.hash;
            const w = window.open(url, 'htcs-presenter', 'popup=yes,width=1100,height=820,menubar=no,toolbar=no,location=no,status=no');
            if (!w) { flashHint('Allow popups to use presenter mode (P)'); return; }
            presenterWin = w;
          };
          const wireStage = () => {
            const s = stage();
            if (!s) { setTimeout(wireStage, 100); return; }
            s.addEventListener('slidechange', (e) => {
              if (!presenterWin || presenterWin.closed) return;
              try { presenterWin.postMessage({ type: 'slide', index: e.detail.index, total: e.detail.total }, '*'); } catch (_) {}
            });
          };
          wireStage();
          window.addEventListener('message', (e) => {
            const m = e && e.data;
            if (!m || typeof m !== 'object') return;
            if (m.type === 'ready' || m.type === 'nav') { if (e.source && (!presenterWin || presenterWin.closed)) presenterWin = e.source; }
            if (m.type === 'ready') { pushSlide(e.source || presenterWin); return; }
            if (m.type === 'nav') {
              const map = { prev: 'ArrowLeft', next: 'ArrowRight', first: 'Home', last: 'End' };
              const key = map[m.dir];
              if (!key) return;
              window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
            }
          });
          window.addEventListener('keydown', (ev) => {
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const t = ev.target;
            if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
            if (ev.key === 'p' || ev.key === 'P') { ev.preventDefault(); openPresenter(); }
          });
          function flashHint(text) {
            let el = document.getElementById('presenter-hint');
            if (!el) {
              el = document.createElement('div');
              el.id = 'presenter-hint';
              Object.assign(el.style, { position: 'fixed', top: '16px', left: '50%', transform: 'translateX(-50%)', background: 'rgba(0,0,0,0.85)', color: '#fff', padding: '10px 16px', borderRadius: '999px', fontFamily: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif', fontSize: '13px', zIndex: 2147483647, opacity: '0', transition: 'opacity 200ms ease', pointerEvents: 'none' });
              document.body.appendChild(el);
            }
            el.textContent = text;
            requestAnimationFrame(() => { el.style.opacity = '1'; });
            clearTimeout(flashHint._t);
            flashHint._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
          }
        }

        function mountPresenter() {
          const stage = document.querySelector('deck-stage');
          if (stage) stage.remove();
          const root = document.getElementById('deck-root');
          if (root) root.remove();

          const notes = readNotes();
          const title = (document.title || 'Deck').replace(/\s+/g, ' ').trim();
          document.title = title + ' — Presenter';

          const style = document.createElement('style');
          style.textContent = `
            html, body { background: #0c0c0e !important; color: #f5f3ee !important; overflow: auto !important; height: auto !important; min-height: 100%; margin: 0; padding: 0; }
            .pv-app { box-sizing: border-box; display: grid; grid-template-rows: auto 1fr auto auto auto; gap: 16px; min-height: 100vh; padding: 24px clamp(20px, 4vw, 56px) 28px; font-family: "Source Serif 4", Georgia, serif; }
            .pv-head { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; font-family: "Inter Tight", -apple-system, sans-serif; }
            .pv-title { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; }
            .pv-meta { display: flex; align-items: center; gap: 14px; font-feature-settings: "tnum" 1; }
            .pv-counter { font-size: 15px; opacity: 0.85; }
            .pv-counter b { font-weight: 600; }
            .pv-timer { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 22px; background: #1a1a1f; padding: 6px 12px; border-radius: 8px; min-width: 92px; text-align: center; }
            .pv-tbtn { font: inherit; font-family: "Inter Tight", -apple-system, sans-serif; font-size: 12px; letter-spacing: 0.04em; background: #1a1a1f; color: #f5f3ee; border: 1px solid #2a2a31; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
            .pv-tbtn:hover { background: #25252c; }
            .pv-now { background: #14141a; border-radius: 14px; padding: clamp(20px, 3vw, 36px); display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
            .pv-now-label, .pv-next-label { font-family: "Inter Tight", -apple-system, sans-serif; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
            .pv-now-text { font-size: clamp(22px, 2.4vw, 34px); line-height: 1.45; overflow-y: auto; padding-right: 8px; }
            .pv-next { background: #101015; border-radius: 12px; padding: 18px clamp(18px, 3vw, 30px); opacity: 0.62; max-height: 22vh; overflow: hidden; }
            .pv-next-text { font-size: clamp(14px, 1.2vw, 18px); line-height: 1.45; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
            .pv-empty { opacity: 0.45; font-style: italic; }
            .pv-nav { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-family: "Inter Tight", -apple-system, sans-serif; }
            .pv-nav button { font: inherit; font-size: 14px; background: #1a1a1f; color: #f5f3ee; border: 1px solid #2a2a31; padding: 10px 22px; border-radius: 10px; cursor: pointer; min-width: 130px; }
            .pv-nav button:hover { background: #25252c; }
            .pv-status { text-align: center; font-family: "Inter Tight", -apple-system, sans-serif; font-size: 12px; opacity: 0.5; margin-top: -6px; min-height: 1em; }
          `;
          document.head.appendChild(style);

          const app = document.createElement('div');
          app.className = 'pv-app';
          app.innerHTML = `
            <header class="pv-head">
              <div class="pv-title"></div>
              <div class="pv-meta">
                <div class="pv-counter">Slide <b class="pv-cur">–</b> / <span class="pv-total">–</span></div>
                <div class="pv-timer" data-timer>00:00</div>
                <button class="pv-tbtn" data-timer-toggle>Start</button>
                <button class="pv-tbtn" data-timer-reset>Reset</button>
              </div>
            </header>
            <section class="pv-now">
              <div class="pv-now-label">Now speaking</div>
              <div class="pv-now-text"></div>
            </section>
            <section class="pv-next">
              <div class="pv-next-label">Up next</div>
              <div class="pv-next-text"></div>
            </section>
            <nav class="pv-nav">
              <button data-nav="first">First</button>
              <button data-nav="prev">Prev</button>
              <button data-nav="next">Next</button>
              <button data-nav="last">Last</button>
            </nav>
            <div class="pv-status"></div>
          `;
          document.body.appendChild(app);

          const $ = (sel) => app.querySelector(sel);
          $('.pv-title').textContent = title;
          const statusEl = $('.pv-status');
          const setStatus = (msg) => { statusEl.textContent = msg || ''; };

          let curIdx = 0;
          let total = Math.max(notes.length || 1, 1);

          const render = (idx) => {
            curIdx = Math.max(0, Math.min(total - 1, idx | 0));
            $('.pv-cur').textContent = String(curIdx + 1);
            $('.pv-total').textContent = String(total);
            const cur = notes[curIdx];
            const next = notes[curIdx + 1];
            const nowEl = $('.pv-now-text');
            const nextEl = $('.pv-next-text');
            if (cur && String(cur).trim()) { nowEl.classList.remove('pv-empty'); nowEl.textContent = cur; }
            else { nowEl.classList.add('pv-empty'); nowEl.textContent = '(no notes for this slide)'; }
            if (next && String(next).trim()) { nextEl.classList.remove('pv-empty'); nextEl.textContent = next; }
            else if (curIdx + 1 >= total) { nextEl.classList.add('pv-empty'); nextEl.textContent = '(end of deck)'; }
            else { nextEl.classList.add('pv-empty'); nextEl.textContent = '(no notes for next slide)'; }
          };

          try { const raw = localStorage.getItem(STORAGE_KEY); const n = raw == null ? 0 : parseInt(raw, 10); render(Number.isFinite(n) ? n : 0); }
          catch (_) { render(0); }

          const tEl = $('[data-timer]');
          const tToggle = $('[data-timer-toggle]');
          const tReset = $('[data-timer-reset]');
          let tStart = 0, tAccum = 0, tRunning = false, tTick = null;
          const fmt = (ms) => { const s = Math.floor(ms / 1000); const mm = Math.floor(s / 60), ss = s % 60; if (mm >= 60) { const hh = Math.floor(mm / 60), m2 = mm % 60; return hh + ':' + String(m2).padStart(2, '0') + ':' + String(ss).padStart(2, '0'); } return String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'); };
          const paint = () => { const elapsed = tAccum + (tRunning ? (Date.now() - tStart) : 0); tEl.textContent = fmt(elapsed); };
          const startStop = () => { if (tRunning) { tAccum += Date.now() - tStart; tRunning = false; tToggle.textContent = 'Resume'; clearInterval(tTick); tTick = null; } else { tStart = Date.now(); tRunning = true; tToggle.textContent = 'Pause'; tTick = setInterval(paint, 250); } paint(); };
          const resetTimer = () => { tAccum = 0; tStart = Date.now(); if (!tRunning) tToggle.textContent = 'Start'; paint(); };
          tToggle.addEventListener('click', startStop);
          tReset.addEventListener('click', resetTimer);
          paint();

          const sendNav = (dir) => {
            if (window.opener && !window.opener.closed) { try { window.opener.postMessage({ type: 'nav', dir }, '*'); return; } catch (_) {} }
            setStatus('Deck window not reachable — open the deck in another window and press P to link them.');
          };
          app.querySelectorAll('[data-nav]').forEach((btn) => { btn.addEventListener('click', () => sendNav(btn.getAttribute('data-nav'))); });

          window.addEventListener('keydown', (ev) => {
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const k = ev.key;
            if (k === 'ArrowRight' || k === 'PageDown') { ev.preventDefault(); sendNav('next'); }
            else if (k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); sendNav('prev'); }
            else if (k === 'Home') { ev.preventDefault(); sendNav('first'); }
            else if (k === 'End') { ev.preventDefault(); sendNav('last'); }
            else if (k === ' ' || k === 'Spacebar') { ev.preventDefault(); startStop(); }
            else if (k === 'r' || k === 'R') { ev.preventDefault(); resetTimer(); }
          });

          window.addEventListener('message', (e) => {
            const m = e && e.data;
            if (!m || typeof m !== 'object') return;
            if (m.type === 'slide') { if (typeof m.total === 'number' && m.total > 0) total = m.total; render(m.index | 0); setStatus(''); }
          });

          window.addEventListener('storage', (e) => {
            if (e.key !== STORAGE_KEY || e.newValue == null) return;
            const n = parseInt(e.newValue, 10);
            if (Number.isFinite(n)) render(n);
            sayReady();
          });

          const sayReady = () => { if (window.opener && !window.opener.closed) { try { window.opener.postMessage({ type: 'ready' }, '*'); } catch (_) {} } };
          if (!window.opener || window.opener.closed) { setStatus('Standalone mode — open the deck in another window and press P to link them.'); }
          sayReady();
          setTimeout(sayReady, 250);
        }
      })();
    </script>
  </body>

</html>
