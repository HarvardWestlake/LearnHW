<!--
  HTCS shared deck template and style guide.

  Use this file as a live catalog of the shared authoring system.
  When you start a new deck, duplicate it, trim the reference slides you do
  not need, then replace the guide copy with lesson-specific content.

  Title alignment rule:
  Shared `Title` is left-aligned by default. If a slide needs a centered title,
  opt into it explicitly on that slide with `style={{ textAlign: 'center' }}`.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTCS · Shared Template · Style Guide</title>

  <body>
    <deck-stage width="1920" height="1080"></deck-stage>
    <div id="deck-root"></div>

    <script>
      (() => {
        const DESIGN_W_DEFAULT = 1920;
        const DESIGN_H_DEFAULT = 1080;
        const STORAGE_PREFIX = 'deck-stage:slide:';
        const OVERLAY_HIDE_MS = 1800;
        const VALIDATE_ATTR = 'no_overflowing_text,no_overlapping_text,slide_sized_text';

        const pad2 = (n) => String(n).padStart(2, '0');

        const stylesheet = `
          :host { position: fixed; inset: 0; display: block; background: #000; color: #fff; overflow: hidden; }
          .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
          .canvas { position: relative; transform-origin: center center; flex-shrink: 0; background: #fff; will-change: transform; }
          ::slotted(*) { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; box-sizing: border-box !important; overflow: hidden; opacity: 0; pointer-events: none; visibility: hidden; }
          ::slotted([data-deck-active]) { opacity: 1; pointer-events: auto; visibility: visible; }
          .overlay { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 6px) scale(0.92); filter: blur(6px); display: flex; align-items: center; gap: 4px; padding: 4px; background: #000; color: #fff; border-radius: 999px; font-size: 12px; font-feature-settings: "tnum" 1; letter-spacing: 0.01em; opacity: 0; pointer-events: none; transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.8,.2,1), filter 260ms ease; transform-origin: center bottom; z-index: 2147483000; user-select: none; }
          .overlay[data-visible] { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); filter: blur(0); }
        `;

        class DeckStage extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: 'open' });
            this._slides = [];
            this._index = 0;
            this._showOverlayTimer = 0;
            this._onSlotChange = this._onSlotChange.bind(this);
          }

          connectedCallback() {
            const width = Number(this.getAttribute('width') || DESIGN_W_DEFAULT);
            const height = Number(this.getAttribute('height') || DESIGN_H_DEFAULT);
            this.shadowRoot.innerHTML = `
              <style>${stylesheet}</style>
              <div class="stage">
                <div class="canvas" part="canvas" style="width:${width}px;height:${height}px">
                  <slot></slot>
                </div>
              </div>
              <div class="overlay" data-overlay>
                <span data-count>01 / 01</span>
              </div>
            `;
            this._canvas = this.shadowRoot.querySelector('.canvas');
            this._overlay = this.shadowRoot.querySelector('[data-overlay]');
            this._count = this.shadowRoot.querySelector('[data-count]');
            this._slot = this.shadowRoot.querySelector('slot');
            this._slot.addEventListener('slotchange', this._onSlotChange);
            this._collectSlides();
            this._restoreIndex();
            this._applyIndex('init');
            this._resize();
            window.addEventListener('resize', () => this._resize());
            document.addEventListener('keydown', (event) => this._onKeydown(event));
          }

          disconnectedCallback() {
            if (this._slot) this._slot.removeEventListener('slotchange', this._onSlotChange);
          }

          _onSlotChange() {
            const hadSlides = this._slides.length > 0;
            const previousIndex = this._index;
            this._collectSlides();
            if (!hadSlides) this._restoreIndex();
            else if (this._slides.length) this._index = Math.min(previousIndex, this._slides.length - 1);
            this._applyIndex('slotchange');
          }

          _collectSlides() {
            this._slides = Array.from(this.children).filter((node) => node.nodeType === Node.ELEMENT_NODE);
            this._slides.forEach((slide, index) => {
              slide.dataset.deckSlide = String(index);
              slide.setAttribute('data-screen-label', `${pad2(index + 1)} ${slide.getAttribute('data-label') || ''}`.trim());
              slide.setAttribute('data-om-validate', VALIDATE_ATTR);
            });
          }

          _restoreIndex() {
            try {
              const saved = Number(localStorage.getItem(STORAGE_PREFIX + (location.pathname || '/')));
              if (!Number.isNaN(saved)) this._index = Math.max(0, Math.min(saved, this._slides.length - 1));
            } catch (_) {}
          }

          _saveIndex() {
            try { localStorage.setItem(STORAGE_PREFIX + (location.pathname || '/'), String(this._index)); } catch (_) {}
          }

          _applyIndex(reason) {
            this._slides.forEach((slide, index) => {
              if (index === this._index) slide.setAttribute('data-deck-active', '');
              else slide.removeAttribute('data-deck-active');
            });
            this._count.textContent = `${pad2(this._index + 1)} / ${pad2(this._slides.length || 1)}`;
            this._overlay.setAttribute('data-visible', '');
            clearTimeout(this._showOverlayTimer);
            this._showOverlayTimer = setTimeout(() => this._overlay.removeAttribute('data-visible'), OVERLAY_HIDE_MS);
            this._saveIndex();
            this.dispatchEvent(new CustomEvent('slidechange', {
              bubbles: true,
              composed: true,
              detail: { index: this._index, total: this._slides.length, reason },
            }));
          }

          _resize() {
            const viewportW = window.innerWidth;
            const viewportH = window.innerHeight;
            const width = Number(this.getAttribute('width') || DESIGN_W_DEFAULT);
            const height = Number(this.getAttribute('height') || DESIGN_H_DEFAULT);
            const scale = Math.min(viewportW / width, viewportH / height);
            this._canvas.style.transform = `scale(${scale})`;
          }

          _onKeydown(event) {
            if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
              this.next();
              event.preventDefault();
            } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
              this.prev();
              event.preventDefault();
            } else if (event.key === 'Home') {
              this.goTo(0);
              event.preventDefault();
            } else if (event.key === 'End') {
              this.goTo(this._slides.length - 1);
              event.preventDefault();
            } else if (event.key.toLowerCase() === 'r') {
              this.goTo(0);
              event.preventDefault();
            }
          }

          goTo(index) {
            this._index = Math.max(0, Math.min(index, this._slides.length - 1));
            this._applyIndex('api');
          }

          next() { this.goTo(this._index + 1); }
          prev() { this.goTo(this._index - 1); }
        }

        if (!customElements.get('deck-stage')) customElements.define('deck-stage', DeckStage);
      })();
    </script>

    <script>

    <script type="text/babel" data-presets="react">
      {

          Title,
          Subtitle,

          BulletList,

          StatCard,
          QuoteBlock,

          TimelineStep,
          RecapBlock,
          DiagramFrame,
          DiagramLabel,
          Legend,
          Badge,

        const {

          FileIconSvg,
          DocCard,
          HashBox,
          HashPipeline,
          FriendBust,
          PeerSvg,
          ServerRackSvg,
          NetworkPersonSvg,
          NetworkLinkLine,
          PacketOnEdge,
          KeyIcon,
          Padlock,
          Envelope,
          StageArrow,
          PaymentArrow,
          BitGrid,
          CellGridSvg,
          BlockCard,
          BlockSvg,
          MinerSvg,
        } = window.HTCS_ASSETS;

        const sampleHashA = '6b86b273ff34fce19d6b804eff5a3f57';
        const sampleHashB = '6b86b273ff34fce19d6b804eff5a3f5a';
        const activeCells = [[0, 0], [0, 1], [1, 1], [2, 3], [2, 4], [3, 4], [4, 6]];

        const noteStyle = {
          fontFamily: FONTS.sans,
          fontSize: 14,
          letterSpacing: '0.08em',
          lineHeight: 1.5,
          color: COLORS.muted,
        };

        const captionStyle = {
          fontFamily: FONTS.sans,
          fontSize: 14,
          letterSpacing: '0.16em',
          textTransform: 'uppercase',
          color: COLORS.muted,
        };

        function CatalogTile({ label, note, children, style = {}, tone = 'paper', minHeight = 0 }) {
          const background = tone === 'ink' ? COLORS.ink : COLORS.paper;
          const border = tone === 'ink' ? 'rgba(245,239,227,0.18)' : COLORS.rule;
          const copyColor = tone === 'ink' ? 'rgba(245,239,227,0.58)' : COLORS.muted;
          return (
            <div
              style={{
                border: `1px solid ${border}`,
                background,
                padding: 22,
                minHeight,
                display: 'flex',
                flexDirection: 'column',
                gap: 16,
                ...style,
              }}
            >
              {label && <DiagramLabel tone="accent">{label}</DiagramLabel>}
              <div style={{ flex: 1 }}>{children}</div>
              {note && <div style={{ ...noteStyle, color: copyColor }}>{note}</div>}
            </div>
          );
        }

        function Swatch({ name, value }) {
          return (
            <div style={{ display: 'grid', gridTemplateColumns: '92px 1fr', gap: 12, alignItems: 'center' }}>
              <div style={{ height: 44, background: value, border: `1px solid ${COLORS.rule}` }} />
              <div>
                <div style={{ ...captionStyle, color: COLORS.ink }}>{name}</div>
                <div style={{ fontFamily: FONTS.mono, fontSize: 15, color: COLORS.muted, marginTop: 4 }}>{value}</div>
              </div>
            </div>
          );
        }

        function MiniSurface({ label, background, color, border }) {
          return (
            <div
              style={{
                height: 132,
                background,
                color,
                border: `1px solid ${border}`,
                padding: 16,
                display: 'flex',
                flexDirection: 'column',
                justifyContent: 'space-between',
              }}
            >
              <div style={{ ...captionStyle, color }}>{label}</div>
              <div style={{ fontFamily: FONTS.serif, fontSize: 26, lineHeight: 1.15 }}>
                SlideFrame variant
              </div>
            </div>
          );
        }

        function AssetCaption({ children, style = {} }) {

        }

              </Body>
              <ActionRow style={{ marginTop: 34 }}>
                <Badge filled>Primitives</Badge>
                <Badge tone="gold" filled>Patterns</Badge>
                <Badge tone="ok" filled>Assets</Badge>
                <Badge tone="danger">Reusable by default</Badge>

                <ContentBand gap={24} align="stretch">

                    <div style={{ display: 'flex', justifyContent: 'center' }}>
                      <PeerSvg name="Alice" size={140} />

        function SlideFoundations() {

                        <MiniSurface label="bleed" background={COLORS.creamDark} color={COLORS.ink} border={COLORS.rule} />

                      <BulletList

                        ]}

                    </CatalogTile>
                  </SectionStack>
                )}
              />
            </SlideFrame>
          );
        }

        function SlidePrimitives() {
          return (
            <SlideFrame>
              <Eyebrow>Primitives</Eyebrow>
              <Title>Primitives define the authoring grammar.</Title>
              <TwoCol
                left={(
                  <SectionStack>
                    <CatalogTile label="Text primitives">
                      <Eyebrow style={{ marginBottom: 8 }}>Scene setting</Eyebrow>
                      <Title size="titleSm" style={{ fontSize: 46 }}>Start with hierarchy.</Title>
                      <Subtitle style={{ fontSize: 28, marginTop: 10 }}>

                        <div>

                          </Body>
                          <Rule style={{ margin: '10px 0 16px' }} />
                          <BulletList

                            items={[
                              'Use BulletList for actual lists, not paragraphs.',

                              'Keep list wording parallel.',

                        </div>

                            <div style={{ border: `1px solid ${COLORS.ruleFaint}`, padding: 12, minHeight: 92 }} />
                            <div style={{ border: `1px solid ${COLORS.ruleFaint}`, padding: 12, minHeight: 92 }} />
                          </div>

                          <div style={{ border: `1px solid ${COLORS.ruleFaint}`, minHeight: 70 }} />

        function SlideDiagramHelpers() {
          return (
            <SlideFrame>
              <Eyebrow>Diagram Helpers</Eyebrow>
              <Title>Labels, legends, badges, and arrows standardize diagram language.</Title>
              <ContentBand gap={28} style={{ marginTop: 34, alignItems: 'stretch' }}>
                <DiagramFrame

        function mountTemplateDeck() {
          const stage = document.querySelector('deck-stage');
          if (!stage) return;
          while (stage.firstChild) stage.removeChild(stage.firstChild);
          const slides = [
            ['Cover', SlideCover],
            ['Foundations', SlideFoundations],
            ['Primitives', SlidePrimitives],
            ['Cards And Callouts', SlideCardsCallouts],
            ['Quotes And Flow', SlideQuotesAndFlow],
            ['Diagram Helpers', SlideDiagramHelpers],
            ['People And Networks', SlidePeopleAndNetworks],
            ['Documents And Crypto', SlideDocumentAndCryptoAssets],
            ['Hashes And Grids', SlideHashAndGridAssets],
            ['Ledger And Blockchain', SlideLedgerAndBlockchain],
            ['Checklist', SlideChecklist],
          ];

          slides.forEach(([label, Component], index) => {
            const section = document.createElement('section');
            section.setAttribute('data-label', `${String(index + 1).padStart(2, '0')} ${label}`);
            stage.appendChild(section);
            ReactDOM.createRoot(section).render(<Component />);
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', mountTemplateDeck, { once: true });
        } else {
          mountTemplateDeck();
        }
      }
