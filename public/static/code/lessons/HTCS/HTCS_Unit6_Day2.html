        function ResilienceDemo() {
          const TOTAL_PIECES = 12;
          const ALL_PIECES = Array.from({ length: TOTAL_PIECES }, (_, i) => i + 1);
          const PEERS = [
            { name: 'S', leecherPieces: ALL_PIECES,    startsSeeder: true  },
            { name: 'A', leecherPieces: [1, 2, 3, 4]                       },
            { name: 'B', leecherPieces: [4, 5, 6, 7]                       },
            { name: 'C', leecherPieces: [7, 8, 9]                          },
            { name: 'D', leecherPieces: [9, 10, 11]                        },
            { name: 'E', leecherPieces: [1, 11, 12]                        },
          ];
          const PEER_COLORS = [COLORS.gold, COLORS.accent, COLORS.ok, COLORS.inkSoft, COLORS.accentSoft, COLORS.muted];
          const initialSeeders = () => new Set(PEERS.map((p, i) => p.startsSeeder ? i : -1).filter((x) => x >= 0));

          const [offline, setOffline] = useState(() => new Set());
          const [seeders, setSeeders] = useState(initialSeeders);

          const togglePeer = (i) => setOffline((prev) => {
            const next = new Set(prev);
            if (next.has(i)) next.delete(i); else next.add(i);
            return next;
          });
          const promote = (i) => setSeeders((prev) => {
            const next = new Set(prev);
            next.add(i);
            return next;
          });
          const resetAll = () => { setOffline(new Set()); setSeeders(initialSeeders()); };

          const effectivePieces = (i) => seeders.has(i) ? ALL_PIECES : PEERS[i].leecherPieces;

          // piece -> [peerIndex, ...] across ALL peers (uses current effective holdings)
          const allHolders = {};
          for (let p = 1; p <= TOTAL_PIECES; p++) allHolders[p] = [];
          PEERS.forEach((_, idx) => effectivePieces(idx).forEach((n) => allHolders[n].push(idx)));
          // online holders only — drives reachable / missing
          const onlineHolders = {};
          for (let p = 1; p <= TOTAL_PIECES; p++) {
            onlineHolders[p] = allHolders[p].filter((idx) => !offline.has(idx));
          }
          const missing = [];
          for (let p = 1; p <= TOTAL_PIECES; p++) if (onlineHolders[p].length === 0) missing.push(p);
          const reachableCount = TOTAL_PIECES - missing.length;
          const intact = missing.length === 0;
          const dirty = offline.size > 0 || !setsEqual(seeders, initialSeeders());

          // Geometry
          const w = 1200;
          const h = 510;
          const stripCellW = 64;
          const stripCellH = 76;
          const stripGap = 6;
          const stripW = TOTAL_PIECES * stripCellW + (TOTAL_PIECES - 1) * stripGap;
          const stripX = (w - stripW) / 2;
          const stripY = 30;

          const peerY = 230;
          const personScale = 0.55;
          const personW = 120 * personScale;  // 66
          const personH = 152 * personScale;  // ~84

          const slotW = w / PEERS.length;     // 200
          const peerCenters = PEERS.map((_, i) => slotW / 2 + i * slotW);

          // Per-peer y-anchors (relative to peerY for clarity)
          const roleBadgeY  = peerY + personH + 6;    // ~320
          const nameY       = peerY + personH + 56;   // ~370
          const statusChipY = peerY + personH + 70;   // ~384
          const promoteBtnY = peerY + personH + 110;  // ~424
          const peerStripY  = peerY + personH + 158;  // ~472

          return (
            <div style={{ border: `1px solid ${COLORS.rule}`, padding: 24, marginTop: 24 }}>
              <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={470} preserveAspectRatio="xMidYMid meet" style={{ display: 'block' }}>
                {/* Reassembled file strip */}
                <text x={w / 2} y={stripY - 8} textAnchor="middle" fontFamily={FONTS.sans} fontSize="18" letterSpacing="0.22em" fill={COLORS.ink}>REASSEMBLED FILE</text>
                {Array.from({ length: TOTAL_PIECES }, (_, i) => {
                  const num = i + 1;
                  const cx = stripX + i * (stripCellW + stripGap);
                  const cy = stripY;
                  const onHolders = onlineHolders[num];
                  const isMissing = onHolders.length === 0;
                  if (isMissing) {
                    return (
                      <g key={`fs-${num}`}>
                        <rect x={cx} y={cy} width={stripCellW} height={stripCellH} fill={COLORS.creamDark} stroke={COLORS.danger} strokeWidth="2" strokeDasharray="5 4" />
                        <line x1={cx + 8} y1={cy + 8} x2={cx + stripCellW - 8} y2={cy + stripCellH - 8} stroke={COLORS.danger} strokeWidth="2.5" />
                        <line x1={cx + stripCellW - 8} y1={cy + 8} x2={cx + 8} y2={cy + stripCellH - 8} stroke={COLORS.danger} strokeWidth="2.5" />
                        <text x={cx + stripCellW / 2} y={cy + stripCellH / 2 + 6} textAnchor="middle" fontFamily={FONTS.sans} fontSize="18" fontWeight="700" fill={COLORS.danger}>{num}</text>
                      </g>
                    );
                  }
                  // Online: stripe by online holders (1..n colors)
                  const bandW = stripCellW / onHolders.length;
                  return (
                    <g key={`fs-${num}`}>
                      {onHolders.map((hIdx, k) => (
                        <rect key={k} x={cx + k * bandW} y={cy} width={bandW} height={stripCellH} fill={PEER_COLORS[hIdx]} />
                      ))}
                      <rect x={cx} y={cy} width={stripCellW} height={stripCellH} fill="none" stroke={COLORS.ink} strokeWidth="1.5" />
                      <text x={cx + stripCellW / 2} y={cy + stripCellH / 2 + 7} textAnchor="middle" fontFamily={FONTS.sans} fontSize="20" fontWeight="700" fill={COLORS.paper}>{num}</text>
                    </g>
                  );
                })}

                {/* Divider rule */}
                <line x1={60} y1={170} x2={w - 60} y2={170} stroke={COLORS.ruleFaint} strokeWidth="1" />
                <text x={w / 2} y={195} textAnchor="middle" fontFamily={FONTS.serif} fontStyle="italic" fontSize="20" fill={COLORS.inkSoft}>click any peer to take them offline &middot; promote leechers to seeders</text>

                {/* Peers */}
                {PEERS.map((peer, i) => {
                  const cx = peerCenters[i];
                  const isOff = offline.has(i);
                  const isSeeder = seeders.has(i);
                  return (
                    <g key={peer.name}>
                      {/* Click target: avatar + name + status chip (NOT promote button or strip) */}
                      <g onClick={() => togglePeer(i)} style={{ cursor: 'pointer' }}>
                        <rect x={cx - 80} y={peerY - 8} width={160} height={(statusChipY + 30) - (peerY - 8)} fill="transparent" />

                        {/* Seeder halo behind avatar */}
                        {isSeeder && (
                          <circle cx={cx} cy={peerY + 38} r={46} fill="none" stroke={COLORS.gold} strokeWidth="2.5" opacity={isOff ? 0.32 : 0.85} />
                        )}

                        {/* Avatar */}
                        <g transform={`translate(${cx - personW / 2}, ${peerY}) scale(${personScale})`} opacity={isOff ? 0.32 : 1}>
                          <NetworkPersonSvg name={peer.name} />
                        </g>

                        {/* Role badge: SEEDER (filled gold) / LEECHER (outlined) */}
                        <g transform={`translate(${cx - 56}, ${roleBadgeY})`} opacity={isOff ? 0.4 : 1}>
                          <rect
                            width="112" height="26" rx="3"
                            fill={isSeeder ? COLORS.gold : 'transparent'}
                            stroke={isSeeder ? COLORS.gold : COLORS.muted}
                            strokeWidth="1.5"
                          />
                          <text x="56" y="18" textAnchor="middle"
                            fontFamily={FONTS.sans} fontSize="13" letterSpacing="0.18em" fontWeight="700"
                            fill={isSeeder ? COLORS.paper : COLORS.muted}>
                            {isSeeder ? 'SEEDER' : 'LEECHER'}
                          </text>
                        </g>

                        {/* Name */}
                        <text x={cx} y={nameY} textAnchor="middle" fontFamily={FONTS.serif} fontStyle="italic" fontSize="24" fill={isOff ? COLORS.muted : COLORS.ink}>Peer {peer.name}</text>

                        {/* Online/Offline status chip */}
                        <g transform={`translate(${cx - 56}, ${statusChipY})`}>
                          <rect width="112" height="30" rx="4" fill={isOff ? COLORS.danger : COLORS.ok} />
                          <text x="56" y="20" textAnchor="middle"
                            fontFamily={FONTS.sans} fontSize="14" letterSpacing="0.14em" fontWeight="600"
                            fill={COLORS.paper}>
                            {isOff ? 'OFFLINE' : 'ONLINE'}
                          </text>
                        </g>
                      </g>

                      {/* Promote button: leechers only */}
                      {!isSeeder && (
                        <g
                          transform={`translate(${cx - 80}, ${promoteBtnY})`}
                          onClick={(e) => { e.stopPropagation(); promote(i); }}
                          style={{ cursor: 'pointer' }}
                        >
                          <rect width="160" height="26" rx="3" fill="transparent" stroke={COLORS.ink} strokeWidth="1" strokeDasharray="3 3" />
                          <text x="80" y="18" textAnchor="middle"
                            fontFamily={FONTS.sans} fontSize="13" letterSpacing="0.10em" fontWeight="500"
                            fill={COLORS.ink}>
                            + promote to seeder
                          </text>
                        </g>
                      )}

                      {/* Mini piece strip — sized by role */}
                      {(() => {
                        const pieces = effectivePieces(i);
                        const cellW = isSeeder ? 14 : 30;
                        const cellH = isSeeder ? 22 : 30;
                        const gap   = isSeeder ? 2  : 4;
                        const fs    = isSeeder ? 11 : 14;
                        const stripWidth = pieces.length * cellW + (pieces.length - 1) * gap;
                        return pieces.map((piece, j) => {
                          const mx = cx - stripWidth / 2 + j * (cellW + gap);
                          const my = peerStripY;
                          return (
                            <g key={`mini-${peer.name}-${j}`} opacity={isOff ? 0.32 : 1}>
                              <rect x={mx} y={my} width={cellW} height={cellH} fill={PEER_COLORS[i]} stroke={COLORS.ink} strokeWidth="1.2" />
                              <text x={mx + cellW / 2} y={my + cellH / 2 + fs * 0.36} textAnchor="middle" fontFamily={FONTS.sans} fontSize={fs} fontWeight="600" fill={COLORS.paper}>{piece}</text>
                            </g>
                          );
                        });
                      })()}
                    </g>
                  );
                })}
              </svg>

              {/* Status bar */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 28, marginTop: 18, paddingTop: 18, borderTop: `1px solid ${COLORS.ruleFaint}`, flexWrap: 'wrap' }}>
                <div style={{ fontFamily: FONTS.serif, fontSize: 34 }}>
                  Pieces reachable: <span style={{ color: intact ? COLORS.ok : COLORS.danger, fontWeight: 700 }}>{reachableCount} / {TOTAL_PIECES}</span>
                </div>
                <div style={{ fontFamily: FONTS.serif, fontSize: 26, fontStyle: 'italic', color: intact ? COLORS.inkSoft : COLORS.danger, flex: '1 1 320px' }}>
                  {intact
                    ? 'Coverage intact. The file can still be reconstructed.'
                    : `Coverage broken. Piece${missing.length > 1 ? 's' : ''} ${missing.join(', ')} ${missing.length > 1 ? 'have' : 'has'} no online holder.`}
                </div>
                <button
                  type="button"
                  onClick={resetAll}
                  disabled={!dirty}
                  style={{
                    fontFamily: FONTS.sans,
                    fontSize: 18,
                    letterSpacing: '0.10em',
                    padding: '12px 22px',
                    border: `1px solid ${COLORS.ink}`,
                    background: dirty ? COLORS.ink : 'transparent',
                    color: dirty ? COLORS.paper : COLORS.ink,
                    cursor: dirty ? 'pointer' : 'not-allowed',
                    opacity: dirty ? 1 : 0.4,
                  }}
                >
                  Reset all peers
                </button>
              </div>

              {/* Legend */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 28, marginTop: 14, fontFamily: FONTS.sans, fontSize: 18, letterSpacing: '0.06em', color: COLORS.muted, flexWrap: 'wrap' }}>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 10 }}>
                  <span style={{ display: 'inline-block', width: 18, height: 18, background: COLORS.gold, border: `1px solid ${COLORS.gold}` }} />
                  <span><strong style={{ color: COLORS.ink, letterSpacing: '0.14em' }}>SEEDER</strong>, holds all {TOTAL_PIECES} pieces</span>
                </span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 10 }}>
                  <span style={{ display: 'inline-block', width: 18, height: 18, background: 'transparent', border: `1.5px solid ${COLORS.muted}` }} />
                  <span><strong style={{ color: COLORS.ink, letterSpacing: '0.14em' }}>LEECHER</strong>, holds a subset</span>
                </span>
              </div>
            </div>
          );
        }

        function setsEqual(a, b) {
          if (a.size !== b.size) return false;
          for (const x of a) if (!b.has(x)) return false;
          return true;
        }

        function DHTComparisonDiagram() {
          const peerScale = 0.55;
          const peerAnchor = { x: 60 * peerScale, y: 70 * peerScale };

          const trackerHub = { x: 208, y: 186 };
          const trackerPeers = [
            { x: 28, y: 154, name: 'Alice' },
            { x: 332, y: 154, name: 'Bob' },
            { x: 178, y: 274, name: 'Carol' },
          ];
          const trackerPeerAnchors = trackerPeers.map((peer) => ({
            ...peer,
            ax: peer.x + peerAnchor.x,
            ay: peer.y + peerAnchor.y,
          }));

          const dhtCenter = { x: 776, y: 220 };
          const dhtRadius = 92;
          const dhtPeers = PEER_NAMES.map((name, i) => {
            const ang = -Math.PI / 2 + (i / PEER_NAMES.length) * Math.PI * 2;
            const ax = dhtCenter.x + Math.cos(ang) * dhtRadius;
            const ay = dhtCenter.y + Math.sin(ang) * dhtRadius;
            return {
              x: ax - peerAnchor.x,
              y: ay - peerAnchor.y,
              ax,
              ay,
              name,
            };
          });
          const dhtEdges = dhtPeers.flatMap((peer, i) =>
            dhtPeers.slice(i + 1).map((other) => [peer, other])
          );

          const bubble = { x: 446, y: 108, w: 184, h: 52 };
          const bubbleCenter = { x: bubble.x + bubble.w / 2, y: bubble.y + bubble.h / 2 };
          const speakingPeer = dhtPeers.reduce((closest, peer) => {
            const dist = Math.hypot(peer.ax - bubbleCenter.x, peer.ay - bubbleCenter.y);
            if (!closest || dist < closest.dist) return { peer, dist };
            return closest;
          }, null).peer;
          const bubbleRadius = 16;
          const bubbleTailStart = bubble.x + bubble.w - 54;
          const bubbleTailNeck = bubble.x + bubble.w - 32;
          const bubbleTailTip = { x: speakingPeer.x - 22, y: speakingPeer.y + 34 };
          const bubblePath = [
            `M ${bubble.x + bubbleRadius} ${bubble.y}`,
            `H ${bubble.x + bubble.w - bubbleRadius}`,
            `Q ${bubble.x + bubble.w} ${bubble.y} ${bubble.x + bubble.w} ${bubble.y + bubbleRadius}`,
            `V ${bubble.y + bubble.h - bubbleRadius}`,
            `Q ${bubble.x + bubble.w} ${bubble.y + bubble.h} ${bubble.x + bubble.w - bubbleRadius} ${bubble.y + bubble.h}`,
            `H ${bubbleTailNeck}`,
            `Q ${bubbleTailNeck - 10} ${bubble.y + bubble.h + 22} ${bubbleTailTip.x} ${bubbleTailTip.y}`,
            `Q ${bubbleTailNeck - 24} ${bubble.y + bubble.h + 18} ${bubbleTailStart} ${bubble.y + bubble.h}`,
            `H ${bubble.x + bubbleRadius}`,
            `Q ${bubble.x} ${bubble.y + bubble.h} ${bubble.x} ${bubble.y + bubble.h - bubbleRadius}`,
            `V ${bubble.y + bubbleRadius}`,
            `Q ${bubble.x} ${bubble.y} ${bubble.x + bubbleRadius} ${bubble.y}`,
            'Z',
          ].join(' ');
          return (
            <svg viewBox="0 0 1040 370" preserveAspectRatio="xMidYMid meet" style={{ width: '100%', height: '100%', display: 'block' }}>
              <defs>
                <marker id="dhtArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
                  <path d="M0,0 L10,5 L0,10 z" fill={COLORS.ink} />
                </marker>
              </defs>

    <!-- Presenter view: press P to pop open this same file with ?presenter=1
         in a small window (your laptop screen) while the deck stays full-screen
         on the projector. The two windows stay in sync via postMessage. -->
    <script>
      (() => {
        const PARAM = 'presenter';
        const STORAGE_KEY = 'deck-stage:slide:' + (location.pathname || '/');
        const inPresenter = new URLSearchParams(location.search).has(PARAM);

        const readNotes = () => {
          const tag = document.getElementById('speaker-notes');
          if (!tag) return [];
          try {
            const parsed = JSON.parse(tag.textContent || '[]');
            return Array.isArray(parsed) ? parsed : [];
          } catch (_) { return []; }
        };

        if (inPresenter) mountPresenter();
        else mountAudience();

        // ───────── Audience side (the deck) ─────────
        function mountAudience() {
          let presenterWin = null;

          const stage = () => document.querySelector('deck-stage');

          const currentIndex = () => {
            const s = stage();
            if (!s) return { index: 0, total: 1 };
            const slides = s.querySelectorAll(':scope > [data-deck-slide]');
            let idx = 0;
            slides.forEach((el, i) => { if (el.hasAttribute('data-deck-active')) idx = i; });
            return { index: idx, total: slides.length || 1 };
          };

          const pushSlide = (target) => {
            const win = target || presenterWin;
            if (!win) return;
            try {
              const cur = currentIndex();
              win.postMessage({ type: 'slide', index: cur.index, total: cur.total }, '*');
            } catch (_) {}
          };

          const openPresenter = () => {
            if (presenterWin && !presenterWin.closed) {
              try { presenterWin.focus(); } catch (_) {}
              return;
            }
            const url = location.pathname + '?' + PARAM + '=1' + location.hash;
            const w = window.open(
              url,
              'htcs-presenter',
              'popup=yes,width=1100,height=820,menubar=no,toolbar=no,location=no,status=no'
            );
            if (!w) { flashHint('Allow popups to use presenter mode (P)'); return; }
            presenterWin = w;
          };

          const wireStage = () => {
            const s = stage();
            if (!s) { setTimeout(wireStage, 100); return; }
            s.addEventListener('slidechange', (e) => {
              if (!presenterWin || presenterWin.closed) return;
              try {
                presenterWin.postMessage({
                  type: 'slide',
                  index: e.detail.index,
                  total: e.detail.total,
                }, '*');
              } catch (_) {}
            });
          };
          wireStage();

          window.addEventListener('message', (e) => {
            const m = e && e.data;
            if (!m || typeof m !== 'object') return;
            // Recapture the presenter window — handles deck reload while presenter is open.
            if (m.type === 'ready' || m.type === 'nav') {
              if (e.source && (!presenterWin || presenterWin.closed)) {
                presenterWin = e.source;
              }
            }
            if (m.type === 'ready') { pushSlide(e.source || presenterWin); return; }
            if (m.type === 'nav') {
              const map = { prev: 'ArrowLeft', next: 'ArrowRight', first: 'Home', last: 'End' };
              const key = map[m.dir];
              if (!key) return;
              window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
            }
          });

          window.addEventListener('keydown', (ev) => {
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const t = ev.target;
            if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
            if (ev.key === 'p' || ev.key === 'P') {
              ev.preventDefault();
              openPresenter();
            }
          });

          function flashHint(text) {
            let el = document.getElementById('presenter-hint');
            if (!el) {
              el = document.createElement('div');
              el.id = 'presenter-hint';
              Object.assign(el.style, {
                position: 'fixed', top: '16px', left: '50%',
                transform: 'translateX(-50%)',
                background: 'rgba(0,0,0,0.85)', color: '#fff',
                padding: '10px 16px', borderRadius: '999px',
                fontFamily: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif',
                fontSize: '13px', zIndex: 2147483647,
                opacity: '0', transition: 'opacity 200ms ease',
                pointerEvents: 'none',
              });
              document.body.appendChild(el);
            }
            el.textContent = text;
            requestAnimationFrame(() => { el.style.opacity = '1'; });
            clearTimeout(flashHint._t);
            flashHint._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
          }
        }

            .pv-empty { opacity: 0.45; font-style: italic; }

            .pv-nav {
              display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
              font-family: "Inter Tight", -apple-system, sans-serif;
            }
            .pv-nav button {
              font: inherit; font-size: 14px;
              background: #1a1a1f; color: #f5f3ee;
              border: 1px solid #2a2a31;
              padding: 10px 22px; border-radius: 10px;
              cursor: pointer; min-width: 130px;
            }
            .pv-nav button:hover { background: #25252c; }
            .pv-nav button:active { background: #303038; }

            .pv-status {
              text-align: center;
              font-family: "Inter Tight", -apple-system, sans-serif;
              font-size: 12px; opacity: 0.5; margin-top: -6px; min-height: 1em;
            }
          `;
          document.head.appendChild(style);

          const app = document.createElement('div');
          app.className = 'pv-app';
          app.innerHTML = `
            <header class="pv-head">
              <div class="pv-title"></div>
              <div class="pv-meta">
                <div class="pv-counter">Slide <b class="pv-cur">–</b> / <span class="pv-total">–</span></div>
                <div class="pv-timer" data-timer>00:00</div>
                <button class="pv-tbtn" data-timer-toggle>Start</button>
                <button class="pv-tbtn" data-timer-reset>Reset</button>
              </div>
            </header>
            <section class="pv-now">
              <div class="pv-now-label">Now speaking</div>
              <div class="pv-now-text"></div>
            </section>
            <section class="pv-next">
              <div class="pv-next-label">Up next</div>
              <div class="pv-next-text"></div>
            </section>
            <nav class="pv-nav">
              <button data-nav="first">⏮ First</button>
              <button data-nav="prev">◀ Prev</button>
              <button data-nav="next">Next ▶</button>
              <button data-nav="last">Last ⏭</button>
            </nav>
            <div class="pv-status"></div>
          `;
          document.body.appendChild(app);

          const $ = (sel) => app.querySelector(sel);
          $('.pv-title').textContent = title;
          const statusEl = $('.pv-status');
          const setStatus = (msg) => { statusEl.textContent = msg || ''; };

          let curIdx = 0;
          let total = Math.max(notes.length || 1, 1);

          const render = (idx) => {
            curIdx = Math.max(0, Math.min(total - 1, idx | 0));
            $('.pv-cur').textContent = String(curIdx + 1);
            $('.pv-total').textContent = String(total);
            const cur = notes[curIdx];
            const next = notes[curIdx + 1];
            const nowEl = $('.pv-now-text');
            const nextEl = $('.pv-next-text');
            if (cur && String(cur).trim()) {
              nowEl.classList.remove('pv-empty');
              nowEl.textContent = cur;
            } else {
              nowEl.classList.add('pv-empty');
              nowEl.textContent = '(no notes for this slide)';
            }
            if (next && String(next).trim()) {
              nextEl.classList.remove('pv-empty');
              nextEl.textContent = next;
            } else if (curIdx + 1 >= total) {
              nextEl.classList.add('pv-empty');
              nextEl.textContent = '(end of deck)';
            } else {
              nextEl.classList.add('pv-empty');
              nextEl.textContent = '(no notes for next slide)';
            }
          };

          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const n = raw == null ? 0 : parseInt(raw, 10);
            render(Number.isFinite(n) ? n : 0);
          } catch (_) { render(0); }

          // Timer
          const tEl = $('[data-timer]');
          const tToggle = $('[data-timer-toggle]');
          const tReset = $('[data-timer-reset]');
          let tStart = 0, tAccum = 0, tRunning = false, tTick = null;

          const fmt = (ms) => {
            const s = Math.floor(ms / 1000);
            const mm = Math.floor(s / 60), ss = s % 60;
            if (mm >= 60) {
              const hh = Math.floor(mm / 60), m2 = mm % 60;
              return hh + ':' + String(m2).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
            }
            return String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
          };
          const paint = () => {
            const elapsed = tAccum + (tRunning ? (Date.now() - tStart) : 0);
            tEl.textContent = fmt(elapsed);
          };
          const startStop = () => {
            if (tRunning) {
              tAccum += Date.now() - tStart;
              tRunning = false;
              tToggle.textContent = 'Resume';
              clearInterval(tTick); tTick = null;
            } else {
              tStart = Date.now();
              tRunning = true;
              tToggle.textContent = 'Pause';
              tTick = setInterval(paint, 250);
            }
            paint();
          };
          const resetTimer = () => {
            tAccum = 0; tStart = Date.now();
            if (!tRunning) tToggle.textContent = 'Start';
            paint();
          };
          tToggle.addEventListener('click', startStop);
          tReset.addEventListener('click', resetTimer);
          paint();

          // Nav
          const sendNav = (dir) => {
            if (window.opener && !window.opener.closed) {
              try { window.opener.postMessage({ type: 'nav', dir }, '*'); return; }
              catch (_) {}
            }
            setStatus('Deck window not reachable — open the deck and press P, then return here.');
          };
          app.querySelectorAll('[data-nav]').forEach((btn) => {
            btn.addEventListener('click', () => sendNav(btn.getAttribute('data-nav')));
          });

          window.addEventListener('keydown', (ev) => {
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const k = ev.key;
            if (k === 'ArrowRight' || k === 'PageDown') { ev.preventDefault(); sendNav('next'); }
            else if (k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); sendNav('prev'); }
            else if (k === 'Home') { ev.preventDefault(); sendNav('first'); }
            else if (k === 'End') { ev.preventDefault(); sendNav('last'); }
            else if (k === ' ' || k === 'Spacebar') { ev.preventDefault(); startStop(); }
            else if (k === 'r' || k === 'R') { ev.preventDefault(); resetTimer(); }
          });

          // Receive slide updates
          window.addEventListener('message', (e) => {
            const m = e && e.data;
            if (!m || typeof m !== 'object') return;
            if (m.type === 'slide') {
              if (typeof m.total === 'number' && m.total > 0) total = m.total;
              render(m.index | 0);
              setStatus('');
            }
          });

          // Storage fallback (deck always writes its index here)
          window.addEventListener('storage', (e) => {
            if (e.key !== STORAGE_KEY || e.newValue == null) return;
            const n = parseInt(e.newValue, 10);
            if (Number.isFinite(n)) render(n);
            // If we lost our opener (deck reloaded), try to re-handshake.
            sayReady();
          });

          // Handshake — ask deck to push current state.
          const sayReady = () => {
            if (window.opener && !window.opener.closed) {
              try { window.opener.postMessage({ type: 'ready' }, '*'); } catch (_) {}
            }
          };
          if (!window.opener || window.opener.closed) {
            setStatus('Standalone mode — open the deck in another window and press P to link them.');
          }
          sayReady();
          setTimeout(sayReady, 250);
        }
      })();
    </script>
  </body>

</html>
