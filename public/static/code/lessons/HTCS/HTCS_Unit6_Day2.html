    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script type="application/json" id="speaker-notes">
[
"Today is Day 2, and we are zooming out from keys and hashes to network architecture. A peer-to-peer network is not just a technical pattern, it is a political and economic choice: who stores data, who controls access, and who can shut the system down.",
"Quick roadmap of the four parts. Part 01 is the architectural contrast between centralized and peer-to-peer. Part 02 is the mechanics of how a swarm actually moves a file. Part 03 is how cryptographic hashes let us trust an untrusted swarm piece by piece. Part 04 is what survives in the real world — resilience, permanence, and the honest trade-offs that come with all of this.",
"Part 01. Before we talk about how peer-to-peer works mechanically, we have to understand what it is replacing. Three slides on the architectural choice of who controls the system — the data, the traffic, and the uptime — and what changes when no single party owns it.",
"Open with the side-by-side animated comparison so the class sees the contrast in one frame. In a centralized model every participant is a client and one server is the authority. In P2P, each participant can be both a client and a server — every machine is a node, and useful behavior emerges from the swarm rather than a central operator. Step the visualization from nodes only, to links, to moving packets so they see the same five peers laid out as a star versus a mesh.",
"Centralization is not just a technical choice — it transfers ownership. Use Instagram as the canonical example: every photo you upload is licensed to Meta, surfaced or hidden by their ranking, and deletable on their schedule. Then ground it locally: anything written on the school's tools belongs to the school. Same pattern at any employer. The takeaway is that centralized systems concentrate the power to delete, censor, and monetize.",
"Run the topology demo. Toggle modes and fail nodes. In centralized mode, one failure can collapse service. In P2P mode, traffic reroutes around failures if enough peers remain connected. This is the visceral version of the architectural argument from the previous two slides.",
"Part 02. Now that the contrast is clear, here is how a swarm actually moves a file from many peers to many peers. We will go from chunking, to the tracker, to torrent metadata, to the info hash, to DHT, to magnet links, to the jobs the client performs, to a full walkthrough, and then back to resilience and vocabulary.",
"The key scaling trick in P2P file sharing is chunking. A file is split into many pieces, and different peers host different subsets. Downloaders request many pieces in parallel rather than waiting on one source.",
"Explain the tracker before the hashing slide so they understand how peers even find each other. The tracker only stores the peer map — file bytes never flow through it. Make the mapping explicit: info hash to a list of IP addresses and ports. That is why a tracker acts like a directory, not a file host.",
"Walk through each field. Emphasize that the .torrent file is a receipt — it describes the content precisely enough to verify every byte, but doesn't contain a single byte of the actual movie or software.",
"The info hash is the torrent's identity. Anything that calls itself the same torrent has the same info hash. That hash is how trackers index swarms and how the client knows it's fetching the right file.",
"DHT lets the swarm coordinate even if every tracker goes offline. The BitTorrent clients themselves become the directory. This is why 'just shut down the tracker' rarely ends a torrent.",
"A magnet link is just a URL containing the info hash. The client uses that hash to find peers via DHT or the listed trackers, then fetches the full metadata from those peers. The magnet itself fits in a tweet.",
"The client is the only active software in this whole system. The tracker just answers one question. DHT just routes a lookup. The client does all seven of these steps, in order, every time.",
"Use the resilience demo to remove peers one by one. Students can see exactly when the swarm still reconstructs the file and when availability finally fails. This is the mechanical version of resilience — we will revisit it as a cultural property in Part 04.",
"Lock in the terminology before moving on: node, peer, seeder, leecher, tracker, piece, and swarm. Students should leave fluent in this language so the rest of the deck — and any torrent client they open later — reads cleanly.",
"Run through this slowly. Each step maps back to a component we defined earlier. Step 3 is where the tracker or DHT earns its keep. Step 6 is where Day 01's hashing pays off.",
"Part 03. Resilience to losing peers is the easy half. The harder half: any peer can lie about the bytes they send. This is where the hash properties from Day 1 earn their keep. One slide and one demo on how a single property — same input always produces the same digest — turns an untrusted swarm into trustworthy data.",
"Run the malicious-peer demo. Toggle hash verification OFF first so the class watches Mallory's red-flagged pieces fill the file and the INFECTED stamp lands. Then toggle ON and show how each bad piece is rejected and refetched in green from an honest peer. Click any slot to surface the actual expected vs observed hash for forensic confirmation.",
"Part 04. Once a healthy swarm exists, the protocol takes on a life of its own. The same property that lets it survive node outages also lets it survive takedowns. Five slides plus a live demo: internet permanence, why torrents are effectively undeletable, common misconceptions, the honest trade-offs, and finally a real client running in front of the class.",
"Reframe the resilience demo culturally. The same property that lets a swarm survive outages also lets it survive takedowns. Use the embarrassing-video metaphor — you can ask hosts to remove copies, but you can never prove every copy is gone. Internet permanence is the user-facing consequence of P2P resilience.",
"Walk through why a torrent is effectively undeletable. Site takedowns require jurisdiction (PirateBay's servers were seized but mirrors reappeared). The torrent file itself is tiny metadata — one upload to an offshore host and the swarm reconnects. ISPs can issue cease-and-desist letters but only to subscribers in their legal reach. And 'unhosting' just removes you from the swarm; the bytes still sit on your disk and on every other seeder's. The point: the protocol has no off switch — jurisdiction does.",
"Have students vote on each one before revealing the answer. These five mistakes will come up in any discussion about torrenting — knowing the corrections marks you as someone who actually understands the protocol.",
"Address trade-offs honestly. P2P improves resilience and distribution cost, but creates challenges in moderation, legal compliance, abuse response, and quality control.",
"Time for the live demo. Open a real torrent client. Show the peers panel — point out IP addresses from multiple countries so they see this is global. Switch to the pieces view and watch the grid fill in non-sequentially. Pause and resume the download to demonstrate that progress is preserved. If time allows, open Popcorn Time as a bonus to show streaming-while-downloading on top of the same protocol.",
"Recap the mental model: centralized systems optimize control; P2P systems optimize redundancy and participation. Hashes provide trust in data integrity even when peers are untrusted.",
"Bridge to Day 03: next class we turn a shared ledger into money, then ask how a decentralized network keeps that ledger honest with blocks, miners, and proof of work."
]
</script>

    <deck-stage width="1920" height="1080"></deck-stage>
    <div id="deck-root"></div>

    <script>
      /**
       * <deck-stage> — reusable web component for HTML decks.
       *
       * Handles:
       *  (a) speaker notes — reads <script type="application/json" id="speaker-notes">
       *      and posts {slideIndexChanged: N} to the parent window on nav.
       *  (b) keyboard navigation — ←/→, PgUp/PgDn, Space, Home/End, number keys.
       *  (c) press R to reset to slide 0 (with a tasteful keyboard hint).
       *  (d) bottom-center overlay showing slide count + hints, fades out on idle.
       *  (e) auto-scaling — inner canvas is a fixed design size (default 1920×1080)
       *      scaled with `transform: scale()` to fit the viewport, letterboxed.
       *      Set the `noscale` attribute to render at authored size (1:1) — the
       *      PPTX exporter sets this so its DOM capture sees unscaled geometry.
       *  (f) print — `@media print` lays every slide out as its own page at the
       *      design size, so the browser's Print → Save as PDF produces a clean
       *      one-page-per-slide PDF with no extra setup.
       *
       * Slides are HIDDEN, not unmounted. Non-active slides stay in the DOM with
       * `visibility: hidden` + `opacity: 0`, so their state (videos, iframes,
       * form inputs, React trees) is preserved across navigation.
       *
       * Lifecycle event — the component dispatches a `slidechange` CustomEvent on
       * itself whenever the active slide changes (including the initial mount).
       * The event bubbles and composes out of shadow DOM, so you can listen on
       * the <deck-stage> element or on document:
       *
       *   document.querySelector('deck-stage').addEventListener('slidechange', (e) => {
       *     e.detail.index         // new 0-based index
       *     e.detail.previousIndex // previous index, or -1 on init
       *     e.detail.total         // total slide count
       *     e.detail.slide         // the new active slide element
       *     e.detail.previousSlide // the prior slide element, or null on init
       *     e.detail.reason        // 'init' | 'keyboard' | 'click' | 'tap' | 'api'
       *   });
       *
       * Persistence: current slide index is saved to localStorage keyed by the
       * document path, so refresh returns you to the same place.
       *
       * Usage:
       *   <deck-stage width="1920" height="1080">
       *     <section data-label="Title">...</section>
       *     <section data-label="Agenda">...</section>
       *   </deck-stage>
       *
       * Slides are the direct element children of <deck-stage>. Each slide is
       * automatically tagged with:
       *   - data-screen-label="NN Label"   (1-indexed, for comment flow)
       *   - data-om-validate="no_overflowing_text,no_overlapping_text,slide_sized_text"
       */

      (() => {
        const DESIGN_W_DEFAULT = 1920;
        const DESIGN_H_DEFAULT = 1080;
        const STORAGE_PREFIX = 'deck-stage:slide:';
        const OVERLAY_HIDE_MS = 1800;
        const VALIDATE_ATTR = 'no_overflowing_text,no_overlapping_text,slide_sized_text';

        const pad2 = (n) => String(n).padStart(2, '0');

        const stylesheet = `
    :host {
      position: fixed;
      inset: 0;
      display: block;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas {
      position: relative;
      transform-origin: center center;
      flex-shrink: 0;
      background: #fff;
      will-change: transform;
    }

    /* Slides live in light DOM (via <slot>) so authored CSS still applies.
       We absolutely position each slotted child to stack them. */
    ::slotted(*) {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      box-sizing: border-box !important;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    ::slotted([data-deck-active]) {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    /* Tap zones for mobile — back/forward thirds like Stories.
       Transparent, no visible UI, don't block the overlay. */
    .tapzones {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 2147482000;
      pointer-events: none;
    }
    .tapzone {
      flex: 1;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    /* Only activate tap zones on coarse pointers (touch devices). */
    @media (hover: hover) and (pointer: fine) {
      .tapzones { display: none; }
    }

    .overlay {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 6px) scale(0.92);
      filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: #000;
      color: #fff;
      border-radius: 999px;
      font-size: 12px;
      font-feature-settings: "tnum" 1;
      letter-spacing: 0.01em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.8,.2,1), filter 260ms ease;
      transform-origin: center bottom;
      z-index: 2147483000;
      user-select: none;
    }
    .overlay[data-visible] {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
      filter: blur(0);
    }

    .btn {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: 0;
      margin: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      cursor: default;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      min-width: 28px;
      border-radius: 999px;
      color: rgba(255,255,255,0.72);
      transition: background 140ms ease, color 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .btn:active { background: rgba(255,255,255,0.18); }
    .btn:focus { outline: none; }
    .btn:focus-visible { outline: none; }
    .btn::-moz-focus-inner { border: 0; }
    .btn svg { width: 14px; height: 14px; display: block; }
    .btn.reset,
    .btn.presenter {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 0 10px 0 12px;
      gap: 6px;
      color: rgba(255,255,255,0.72);
    }
    .btn.reset .kbd,
    .btn.presenter .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1;
      color: rgba(255,255,255,0.88);
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
    }

    .count {
      font-variant-numeric: tabular-nums;
      color: #fff;
      font-weight: 500;
      padding: 0 8px;
      min-width: 42px;
      text-align: center;
      font-size: 12px;
    }
    .count .sep { color: rgba(255,255,255,0.45); margin: 0 3px; font-weight: 400; }
    .count .total { color: rgba(255,255,255,0.55); }

    .divider {
      width: 1px;
      height: 14px;
      background: rgba(255,255,255,0.18);
      margin: 0 2px;
    }

    /* ── Print: one page per slide, no chrome ────────────────────────────
       The screen layout stacks every slide at inset:0 inside a scaled
       canvas; for print we want them in document flow at the authored
       design size so the browser paginates one slide per sheet. The
       @page size is set from the width/height attributes via the inline
       <style id="deck-stage-print-page"> that connectedCallback injects
       into <head> (the @page at-rule has no effect inside shadow DOM). */
    @media print {
      :host {
        position: static;
        inset: auto;
        background: none;
        overflow: visible;
        color: inherit;
      }
      .stage { position: static; display: block; }
      .canvas {
        transform: none !important;
        width: auto !important;
        height: auto !important;
        background: none;
        will-change: auto;
      }
      ::slotted(*) {
        position: relative !important;
        inset: auto !important;
        width: var(--deck-design-w) !important;
        height: var(--deck-design-h) !important;
        box-sizing: border-box !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto;
        break-after: page;
        page-break-after: always;
        break-inside: avoid;
        overflow: hidden;
      }
      ::slotted(*:last-child) {
        break-after: auto;
        page-break-after: auto;
      }
      .overlay, .tapzones { display: none !important; }
    }
  `;

        class DeckStage extends HTMLElement {
          static get observedAttributes() { return ['width', 'height', 'noscale']; }

          constructor() {
            super();
            this._root = this.attachShadow({ mode: 'open' });
            this._index = 0;
            this._slides = [];
            this._notes = [];
            this._hideTimer = null;
            this._mouseIdleTimer = null;
            this._storageKey = STORAGE_PREFIX + (location.pathname || '/');

            this._onKey = this._onKey.bind(this);
            this._onResize = this._onResize.bind(this);
            this._onSlotChange = this._onSlotChange.bind(this);
            this._onMouseMove = this._onMouseMove.bind(this);
            this._onTapBack = this._onTapBack.bind(this);
            this._onTapForward = this._onTapForward.bind(this);
          }

          get designWidth() {
            return parseInt(this.getAttribute('width'), 10) || DESIGN_W_DEFAULT;
          }
          get designHeight() {
            return parseInt(this.getAttribute('height'), 10) || DESIGN_H_DEFAULT;
          }

          connectedCallback() {
            this._render();
            this._loadNotes();
            this._syncPrintPageRule();
            window.addEventListener('keydown', this._onKey);
            window.addEventListener('resize', this._onResize);
            window.addEventListener('mousemove', this._onMouseMove, { passive: true });
            // Initial collection + layout happens via slotchange, which fires on mount.
          }

          disconnectedCallback() {
            window.removeEventListener('keydown', this._onKey);
            window.removeEventListener('resize', this._onResize);
            window.removeEventListener('mousemove', this._onMouseMove);
            if (this._hideTimer) clearTimeout(this._hideTimer);
            if (this._mouseIdleTimer) clearTimeout(this._mouseIdleTimer);
          }

          attributeChangedCallback() {
            if (this._canvas) {
              this._canvas.style.width = this.designWidth + 'px';
              this._canvas.style.height = this.designHeight + 'px';
              this._canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
              this._canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');
              this._fit();
              this._syncPrintPageRule();
            }
          }

          _render() {
            const style = document.createElement('style');
            style.textContent = stylesheet;

            const stage = document.createElement('div');
            stage.className = 'stage';

            const canvas = document.createElement('div');
            canvas.className = 'canvas';
            canvas.style.width = this.designWidth + 'px';
            canvas.style.height = this.designHeight + 'px';
            canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
            canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');

            const slot = document.createElement('slot');
            slot.addEventListener('slotchange', this._onSlotChange);
            canvas.appendChild(slot);
            stage.appendChild(canvas);

            // Tap zones (mobile): left third = back, right third = forward.
            const tapzones = document.createElement('div');
            tapzones.className = 'tapzones export-hidden';
            tapzones.setAttribute('aria-hidden', 'true');
            const tzBack = document.createElement('div');
            tzBack.className = 'tapzone tapzone--back';
            const tzMid = document.createElement('div');
            tzMid.className = 'tapzone tapzone--mid';
            tzMid.style.pointerEvents = 'none';
            const tzFwd = document.createElement('div');
            tzFwd.className = 'tapzone tapzone--fwd';
            tzBack.addEventListener('click', this._onTapBack);
            tzFwd.addEventListener('click', this._onTapForward);
            tapzones.append(tzBack, tzMid, tzFwd);

            // Overlay: compact, solid black, with clickable controls.
            const overlay = document.createElement('div');
            overlay.className = 'overlay export-hidden';
            overlay.setAttribute('role', 'toolbar');
            overlay.setAttribute('aria-label', 'Deck controls');
            overlay.innerHTML = `
        <button class="btn prev" type="button" aria-label="Previous slide" title="Previous (←)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
        </button>
        <span class="count" aria-live="polite"><span class="current">1</span><span class="sep">/</span><span class="total">1</span></span>
        <button class="btn next" type="button" aria-label="Next slide" title="Next (→)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        </button>
        <span class="divider"></span>
        <button class="btn reset" type="button" aria-label="Reset to first slide" title="Reset (R)">Reset<span class="kbd">R</span></button>
        <button class="btn presenter" type="button" aria-label="Open presenter view" title="Presenter view (P)">Presenter<span class="kbd">P</span></button>
      `;

            overlay.querySelector('.prev').addEventListener('click', () => this._go(this._index - 1, 'click'));
            overlay.querySelector('.next').addEventListener('click', () => this._go(this._index + 1, 'click'));
            overlay.querySelector('.reset').addEventListener('click', () => this._go(0, 'click'));
            overlay.querySelector('.presenter').addEventListener('click', () => {
              window.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true }));
            });

            this._root.append(style, stage, tapzones, overlay);
            this._canvas = canvas;
            this._slot = slot;
            this._overlay = overlay;
            this._countEl = overlay.querySelector('.current');
            this._totalEl = overlay.querySelector('.total');
          }

          /** @page must live in the document stylesheet — it's a no-op inside
           *  shadow DOM. Inject/update a single <head> style tag so the print
           *  sheet matches the design size and Save-as-PDF yields one slide per
           *  page with no margins. */
          _syncPrintPageRule() {
            const id = 'deck-stage-print-page';
            let tag = document.getElementById(id);
            if (!tag) {
              tag = document.createElement('style');
              tag.id = id;
              document.head.appendChild(tag);
            }
            tag.textContent =
              '@page { size: ' + this.designWidth + 'px ' + this.designHeight + 'px; margin: 0; } ' +
              '@media print { html, body { margin: 0 !important; padding: 0 !important; background: none !important; overflow: visible !important; height: auto !important; } ' +
              '* { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }';
          }

          _onSlotChange() {
            this._collectSlides();
            this._restoreIndex();
            this._applyIndex({ showOverlay: false, broadcast: true, reason: 'init' });
            this._fit();
          }

          _collectSlides() {
            const assigned = this._slot.assignedElements({ flatten: true });
            this._slides = assigned.filter((el) => {
              // Skip template/style/script nodes even if someone slots them.
              const tag = el.tagName;
              return tag !== 'TEMPLATE' && tag !== 'SCRIPT' && tag !== 'STYLE';
            });

            this._slides.forEach((slide, i) => {
              const n = i + 1;
              // Determine a label for comment flow: prefer explicit data-label,
              // then an existing data-screen-label, then first heading, else "Slide".
              let label = slide.getAttribute('data-label');
              if (!label) {
                const existing = slide.getAttribute('data-screen-label');
                if (existing) {
                  // Strip any leading number the author may have included.
                  label = existing.replace(/^\s*\d+\s*/, '').trim() || existing;
                }
              }
              if (!label) {
                const h = slide.querySelector('h1, h2, h3, [data-title]');
                if (h) label = (h.textContent || '').trim().slice(0, 40);
              }
              if (!label) label = 'Slide';
              slide.setAttribute('data-screen-label', `${pad2(n)} ${label}`);

              // Validation attribute for comment flow / auto-checks.
              if (!slide.hasAttribute('data-om-validate')) {
                slide.setAttribute('data-om-validate', VALIDATE_ATTR);
              }

              slide.setAttribute('data-deck-slide', String(i));
            });

            if (this._totalEl) this._totalEl.textContent = String(this._slides.length || 1);
            if (this._index >= this._slides.length) this._index = Math.max(0, this._slides.length - 1);
          }

          _loadNotes() {
            const tag = document.getElementById('speaker-notes');
            if (!tag) { this._notes = []; return; }
            try {
              const parsed = JSON.parse(tag.textContent || '[]');
              if (Array.isArray(parsed)) this._notes = parsed;
            } catch (e) {
              console.warn('[deck-stage] Failed to parse #speaker-notes JSON:', e);
              this._notes = [];
            }
          }

          _restoreIndex() {
            try {
              const raw = localStorage.getItem(this._storageKey);
              if (raw != null) {
                const n = parseInt(raw, 10);
                if (Number.isFinite(n) && n >= 0 && n < this._slides.length) {
                  this._index = n;
                }
              }
            } catch (e) { /* ignore */ }
          }

          _persistIndex() {
            try { localStorage.setItem(this._storageKey, String(this._index)); }
            catch (e) { /* ignore */ }
          }

          _applyIndex({ showOverlay = true, broadcast = true, reason = 'init' } = {}) {
            if (!this._slides.length) return;
            const prev = this._prevIndex == null ? -1 : this._prevIndex;
            const curr = this._index;
            this._slides.forEach((s, i) => {
              if (i === curr) s.setAttribute('data-deck-active', '');
              else s.removeAttribute('data-deck-active');
            });
            if (this._countEl) this._countEl.textContent = String(curr + 1);
            this._persistIndex();

            if (broadcast) {
              // (1) Legacy: host-window postMessage for speaker-notes renderers.
              try { window.postMessage({ slideIndexChanged: curr }, '*'); } catch (e) { }

              // (2) In-page CustomEvent on the <deck-stage> element itself.
              //     Bubbles and composes out of shadow DOM so slide code can listen:
              //       document.querySelector('deck-stage').addEventListener('slidechange', e => {
              //         e.detail.index, e.detail.previousIndex, e.detail.total, e.detail.slide, e.detail.reason
              //       });
              const detail = {
                index: curr,
                previousIndex: prev,
                total: this._slides.length,
                slide: this._slides[curr] || null,
                previousSlide: prev >= 0 ? (this._slides[prev] || null) : null,
                reason: reason, // 'init' | 'keyboard' | 'click' | 'tap' | 'api'
              };
              this.dispatchEvent(new CustomEvent('slidechange', {
                detail,
                bubbles: true,
                composed: true,
              }));
            }

            this._prevIndex = curr;
            if (showOverlay) this._flashOverlay();
          }

          _flashOverlay() {
            if (!this._overlay) return;
            this._overlay.setAttribute('data-visible', '');
            if (this._hideTimer) clearTimeout(this._hideTimer);
            this._hideTimer = setTimeout(() => {
              this._overlay.removeAttribute('data-visible');
            }, OVERLAY_HIDE_MS);
          }

          _fit() {
            if (!this._canvas) return;
            // PPTX export sets noscale so the DOM capture sees authored-size
            // geometry — the scaled canvas is in shadow DOM, so the exporter's
            // resetTransformSelector can't reach .canvas.style.transform directly.
            if (this.hasAttribute('noscale')) {
              this._canvas.style.transform = 'none';
              return;
            }
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const s = Math.min(vw / this.designWidth, vh / this.designHeight);
            this._canvas.style.transform = `scale(${s})`;
          }

          _onResize() { this._fit(); }

          _onMouseMove() {
            // Keep overlay visible while mouse moves; hide after idle.
            this._flashOverlay();
          }

          _onTapBack(e) {
            e.preventDefault();
            this._go(this._index - 1, 'tap');
          }

          _onTapForward(e) {
            e.preventDefault();
            this._go(this._index + 1, 'tap');
          }

          _onKey(e) {
            // Ignore when the user is typing.
            const t = e.target;
            if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
            if (e.metaKey || e.ctrlKey || e.altKey) return;

            const key = e.key;
            let handled = true;

            if (key === 'ArrowRight' || key === 'PageDown' || key === ' ' || key === 'Spacebar') {
              this._go(this._index + 1, 'keyboard');
            } else if (key === 'ArrowLeft' || key === 'PageUp') {
              this._go(this._index - 1, 'keyboard');
            } else if (key === 'Home') {
              this._go(0, 'keyboard');
            } else if (key === 'End') {
              this._go(this._slides.length - 1, 'keyboard');
            } else if (key === 'r' || key === 'R') {
              this._go(0, 'keyboard');
            } else if (/^[0-9]$/.test(key)) {
              // 1..9 jump to that slide; 0 jumps to 10.
              const n = key === '0' ? 9 : parseInt(key, 10) - 1;
              if (n < this._slides.length) this._go(n, 'keyboard');
            } else {
              handled = false;
            }

            if (handled) {
              e.preventDefault();
              this._flashOverlay();
            }
          }

          _go(i, reason = 'api') {
            if (!this._slides.length) return;
            const clamped = Math.max(0, Math.min(this._slides.length - 1, i));
            if (clamped === this._index) {
              this._flashOverlay();
              return;
            }
            this._index = clamped;
            this._applyIndex({ showOverlay: true, broadcast: true, reason });
          }

          // Public API ------------------------------------------------------------

          /** Current slide index (0-based). */
          get index() { return this._index; }
          /** Total slide count. */
          get length() { return this._slides.length; }
          /** Programmatically navigate. */
          goTo(i) { this._go(i, 'api'); }
          next() { this._go(this._index + 1, 'api'); }
          prev() { this._go(this._index - 1, 'api'); }
          reset() { this._go(0, 'api'); }
        }

        if (!customElements.get('deck-stage')) {
          customElements.define('deck-stage', DeckStage);
        }
      })();

    </script>

    <script type="text/babel" data-presets="react">
      {
        const { COLORS, TYPE_SCALE, FONTS } = window.HTCS_TOKENS;
        const { useState, useMemo, useEffect, useRef } = React;

        // ── Animated network primitives (Day 02) ───────────────────────────────
        function useAnimSeconds() {
          const [sec, setSec] = useState(0);
          useEffect(() => {
            let raf = 0;
            const loop = (t) => {
              setSec(t / 1000);
              raf = requestAnimationFrame(loop);
            };
            raf = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(raf);
          }, []);
          return sec;
        }

        /** SVG bust — matches Day 01 / AliceBob PersonSvg styling */
        function NetworkPersonSvg({ name = 'Peer', scale = 1 }) {
          const color = COLORS.ink;
          const tint = '#E8DDC4';
          return (
            <g transform={`scale(${scale})`}>
              <path d="M10 140 Q10 90 60 90 Q110 90 110 140 Z" fill={tint} stroke={color} strokeWidth="2" />
              <rect x="50" y="78" width="20" height="14" fill={tint} stroke={color} strokeWidth="2" />
              <circle cx="60" cy="48" r="32" fill={tint} stroke={color} strokeWidth="2" />
              {name === 'Alice' && <path d="M28 50 Q28 18 60 18 Q92 18 92 50 Q92 42 82 40 Q70 36 60 38 Q50 36 38 40 Q28 42 28 50 Z" fill={color} />}
              {name === 'Bob' && <path d="M30 40 Q30 20 60 20 Q90 20 90 40 Q82 32 60 32 Q38 32 30 40 Z" fill={color} />}
              {(name !== 'Alice' && name !== 'Bob') && <path d="M32 42 Q32 22 60 22 Q88 22 88 42 Q82 34 60 34 Q38 34 32 42 Z" fill={color} />}
              <circle cx="50" cy="50" r="2" fill={color} />
              <circle cx="70" cy="50" r="2" fill={color} />
              <path d="M52 62 Q60 68 68 62" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" />
            </g>
          );
        }

        function ServerRackSvg({ down = false, scale = 1, showLabel = true }) {
          const c = down ? COLORS.muted : COLORS.ink;
          return (
            <g transform={`scale(${scale})`}>
              <rect x="8" y="10" width="104" height="120" rx="4" fill={down ? '#E8E4D8' : COLORS.paper} stroke={c} strokeWidth="2" />
              {[34, 58, 82].map((y, i) => (
                <g key={i}>
                  <rect x="18" y={y} width="84" height="18" fill={down ? COLORS.ruleFaint : '#f5f2ea'} stroke={c} strokeWidth="1" />
                  <circle cx="88" cy={y + 9} r="4" fill={down ? COLORS.muted : COLORS.ok} />
                </g>
              ))}
              {showLabel && <text x="60" y="148" textAnchor="middle" fontFamily={FONTS.sans} fontSize="14" letterSpacing="0.12em" fill={c}>HUB</text>}
            </g>
          );
        }

        function NetworkLinkLine({ x1, y1, x2, y2, active = true, dashed = false }) {
          return (
            <line
              x1={x1} y1={y1} x2={x2} y2={y2}
              stroke={active ? COLORS.ink : COLORS.rule}
              strokeWidth={active ? 2.5 : 1.5}
              strokeDasharray={dashed ? '6 6' : 'none'}
              opacity={active ? 1 : 0.35}
            />
          );
        }

        function PacketOnEdge({ x1, y1, x2, y2, t, phase = 0, color = COLORS.gold, r = 5 }) {
          const u = ((t * 0.55 + phase) % 1 + 1) % 1;
          const x = x1 + (x2 - x1) * u;
          const y = y1 + (y2 - y1) * u;
          return <circle cx={x} cy={y} r={r} fill={color} opacity={0.95} />;
        }

        const PEER_NAMES = ['Alice', 'Bob', 'Carol', 'Dana', 'Erin'];

        /** Hub at center; peers on a wide ring (radius tuned so avatars clear the ~120px-wide hub). */
        function getCentralizedLayout(w, h) {
          const cx = w * 0.5;
          const cy = h * 0.5;
          const n = PEER_NAMES.length;
          const r = Math.min(w, h) * 0.34;
          const hub = { x: cx, y: cy, id: 'hub' };
          const peers = PEER_NAMES.map((name, i) => {
            const ang = -Math.PI / 2 + (i / n) * Math.PI * 2;
            return {
              id: `p-${i}`,
              name,
              x: cx + Math.cos(ang) * r,
              y: cy + Math.sin(ang) * r,
              i,
            };
          });
          return { hub, peers };
        }

        /** Line from hub rim toward peer along the spoke (works for any peer angle). */
        function centralizedSpokeEndpoints(hub, p, hubLead = 55, peerLead = 55) {
          const dx = p.x - hub.x;
          const dy = p.y - hub.y;
          const len = Math.hypot(dx, dy) || 1;
          const ux = dx / len;
          const uy = dy / len;
          return {
            x1: hub.x + ux * hubLead,
            y1: hub.y + uy * hubLead,
            x2: p.x - ux * peerLead,
            y2: p.y - uy * peerLead,
          };
        }

        function getP2PLayout(w, h) {
          const cx = w * 0.5;
          const cy = h * 0.5;
          const r = Math.min(w, h) * 0.32;
          const peers = PEER_NAMES.map((name, i) => {
            const ang = -Math.PI / 2 + (i / PEER_NAMES.length) * Math.PI * 2;
            return {
              id: `p-${i}`,
              name,
              x: cx + Math.cos(ang) * r,
              y: cy + Math.sin(ang) * r,
              i,
            };
          });
          return { cx, cy, peers };
        }

        function TopologySvgVisualization({ mode, hubDown, peerDown, showPackets = true, revealStep = 3, compact = false }) {
          const t = useAnimSeconds();
          const w = compact ? 560 : 920;
          const h = compact ? 530 : 530;
          const { hub, peers } = getCentralizedLayout(w, h);
          const p2 = getP2PLayout(w, h);
          const failedIdx = 4;

          const showLinks = revealStep >= 1;
          const packetsOn = Boolean(showPackets) && revealStep >= 2;

          const hubDead = mode === 'centralized' && hubDown;
          const peerFailed = peerDown;

          const activePeer = (idx) => {
            if (peerFailed && idx === failedIdx) return false;
            return true;
          };

          const edgesCentral = [];
          if (showLinks && mode === 'centralized') {
            peers.forEach((p) => {
              const ok = !hubDead && activePeer(p.i);
              const e = centralizedSpokeEndpoints(hub, p, 58, 72);
              edgesCentral.push({ x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, ok, key: `h-${p.i}` });
            });
          }

          const edgesP2p = [];
          if (showLinks && mode === 'p2p') {
            const list = p2.peers.filter((p) => activePeer(p.i));
            for (let a = 0; a < list.length; a++) {
              for (let b = a + 1; b < list.length; b++) {
                edgesP2p.push({
                  x1: list[a].x, y1: list[a].y, x2: list[b].x, y2: list[b].y,
                  ok: true, key: `${list[a].i}-${list[b].i}`,
                });
              }
            }
          }

          return (
            <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={compact ? '100%' : 420} preserveAspectRatio="xMidYMid meet" style={{ display: 'block', width: '100%', height: compact ? '100%' : undefined, maxHeight: compact ? '100%' : 440, flex: compact ? '1 1 auto' : undefined, minHeight: 0 }}>
              <defs>
                <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="2" stdDeviation="2" floodOpacity="0.12" />
                </filter>
              </defs>
              {mode === 'centralized' && (
                <g>
                  {edgesCentral.map((e, i) => (
                    <g key={e.key}>
                      <NetworkLinkLine x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} active={e.ok} dashed={!e.ok} />
                      {packetsOn && e.ok && (
                        <>
                          <PacketOnEdge x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} t={t} phase={i * 0.17} />
                          <PacketOnEdge x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} t={t} phase={i * 0.17 + 0.5} color={COLORS.accentSoft} r={4} />
                        </>
                      )}
                    </g>
                  ))}
                  <g transform={`translate(${hub.x - 60}, ${hub.y - 70})`} filter="url(#softShadow)">
                    <ServerRackSvg down={hubDead} />
                  </g>
                  {peers.map((p) => {
                    const ok = activePeer(p.i);
                    const dim = hubDead || !ok;
                    return (
                      <g key={p.id} transform={`translate(${p.x - 60}, ${p.y - 70})`} opacity={dim ? 0.38 : 1}>
                        <NetworkPersonSvg name={p.name} />
                        <text x="60" y={p.name === 'Alice' ? 6 : 168} textAnchor="middle" fontFamily={FONTS.serif} fontStyle="italic" fontSize={compact ? 16 : 20} fill={dim ? COLORS.muted : COLORS.ink}>{p.name}</text>
                        {!ok && (
                          <text x="60" y="188" textAnchor="middle" fontFamily={FONTS.sans} fontSize={12} letterSpacing="0.14em" fill={COLORS.accent}>OFFLINE</text>
                        )}
                      </g>
                    );
                  })}
                </g>
              )}
              {mode === 'p2p' && (
                <g>
                  {edgesP2p.map((e, i) => (
                    <g key={e.key}>
                      <NetworkLinkLine x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} active />
                      {packetsOn && (
                        <>
                          <PacketOnEdge x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} t={t} phase={i * 0.09} />
                          <PacketOnEdge x1={e.x2} y1={e.y2} x2={e.x1} y2={e.y1} t={t} phase={i * 0.09 + 0.33} color={COLORS.gold} r={4} />
                        </>
                      )}
                    </g>
                  ))}
                  {p2.peers.map((p) => {
                    const ok = activePeer(p.i);
                    return (
                      <g key={p.id} transform={`translate(${p.x - 60}, ${p.y - 70})`} opacity={ok ? 1 : 0.35}>
                        <NetworkPersonSvg name={p.name} />
                        <text x="60" y={p.name === 'Alice' ? 6 : 168} textAnchor="middle" fontFamily={FONTS.serif} fontStyle="italic" fontSize={compact ? 16 : 20} fill={ok ? COLORS.ink : COLORS.muted}>{p.name}</text>
                        {!ok && (
                          <text x="60" y="188" textAnchor="middle" fontFamily={FONTS.sans} fontSize={12} letterSpacing="0.14em" fill={COLORS.accent}>OFFLINE</text>
                        )}
                      </g>
                    );
                  })}
                </g>
              )}
            </svg>
          );
        }

        function topologyCaption(mode, hubDown, peerDown) {
          if (mode === 'centralized' && hubDown) {
            return 'Single point of failure: hub down. Alice, Bob, Carol, Dana, and Erin all lose service.';
          }
          if (mode === 'centralized' && peerDown) {
            return 'Hub still up: Erin is offline, but the other four still receive from the hub.';
          }
          if (mode === 'p2p' && peerDown) {
            return 'Mesh stays connected: Erin is offline; redundant paths keep the other peers linked.';
          }
          if (mode === 'centralized') {
            return 'All traffic routes through the hub: simple control, one choke point.';
          }
          return 'Peers exchange directly: many paths, no single owner of all traffic.';

        // Slide 6 demo — three-stage walk-through of how a file is split,
        // why a single host bottlenecks, and how a P2P swarm trades centralized
        // bandwidth for parallel peers. Same per-source rate constant across
        // stages so the speedup is honest (server upstream is divided across

        const CHUNK_PIECES = 24;
        // One uplink's worth of bandwidth, in pieces/sec. Both the server's
        // single uplink and each peer's individual uplink push at this rate,
        // so the comparison stays apples-to-apples and the speedup is honest.
        // Speedup = (N · R) / (R / N) = N²  — independent of R itself.
        const CHUNK_UPLINK_RATE = 5;
        const CHUNK_PEER_RATE = CHUNK_UPLINK_RATE;          // pieces/sec per peer uplink
        const CHUNK_SERVER_TOTAL_RATE = CHUNK_UPLINK_RATE;  // server's total uplink, shared
        const CHUNK_STAGES = ['1. Split', '2. Server', '3. Swarm'];

        // Stage 1 — file is sliced into PIECES labeled, hash-addressable chunks.
        function ChunkSplitStage({ elapsed }) {
          const progress = Math.min(1, elapsed / 1.8);
          const fileW = 1240;
          const fileH = 70;
          return (
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20, padding: '6px 0' }}>
              <div style={{ width: '100%', maxWidth: fileW }}>
                <div style={{ fontFamily: FONTS.sans, fontSize: 13, letterSpacing: '0.18em', color: COLORS.muted, marginBottom: 6 }}>SOURCE FILE</div>
                <svg viewBox={`0 0 ${fileW} ${fileH}`} width="100%" height={fileH} preserveAspectRatio="none" style={{ display: 'block' }}>
                  <rect x="2" y="2" width={fileW - 4} height={fileH - 4} fill={COLORS.paper} stroke={COLORS.ink} strokeWidth="2" />
                  {Array.from({ length: CHUNK_PIECES - 1 }).map((_, i) => {
                    const reveal = (i + 1) / CHUNK_PIECES;
                    if (progress < reveal * 0.55) return null;
                    const x = ((i + 1) / CHUNK_PIECES) * fileW;
                    return <line key={i} x1={x} y1="2" x2={x} y2={fileH - 2} stroke={COLORS.rule} strokeWidth="1" />;
                  })}
                  <text x={fileW / 2} y={fileH / 2 + 8} textAnchor="middle" fontFamily={FONTS.serif} fontStyle="italic" fontSize="22" fill={COLORS.ink}>movie.mp4 · 1.2 GB</text>
                </svg>
              </div>

              <div style={{ fontSize: 28, color: COLORS.muted, opacity: progress > 0.5 ? 1 : 0, transition: 'opacity 220ms linear', lineHeight: 1 }}>↓</div>

              <div style={{ width: '100%', maxWidth: fileW }}>
                <div style={{ fontFamily: FONTS.sans, fontSize: 13, letterSpacing: '0.18em', color: COLORS.muted, marginBottom: 6 }}>{CHUNK_PIECES} INDEPENDENTLY ADDRESSABLE PIECES (LABEL · HASH)</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: 6 }}>
                  {Array.from({ length: CHUNK_PIECES }).map((_, i) => {
                    const reveal = i / CHUNK_PIECES;
                    const visible = progress >= 0.55 + reveal * 0.45;
                    const label = `piece-${String(i + 1).padStart(2, '0')}`;
                    const hash = simpleHash(label).slice(0, 6);
                    const tint = PEER_COLORS[PEER_NAMES[i % PEER_NAMES.length]];
                    return (
                      <div key={i} style={{
                        border: `1px solid ${COLORS.rule}`,
                        background: visible ? `${tint}33` : 'transparent',
                        opacity: visible ? 1 : 0,
                        transform: visible ? 'translateY(0)' : 'translateY(-6px)',
                        transition: 'opacity 220ms linear, background 220ms linear, transform 220ms ease-out',
                        padding: '7px 4px',
                        textAlign: 'center',

                        <div style={{ fontFamily: FONTS.mono, fontSize: 12, color: COLORS.ink, fontWeight: 600 }}>{label}</div>
                        <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: COLORS.muted, marginTop: 2 }}>{hash}</div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div style={{ fontFamily: FONTS.serif, fontSize: 22, fontStyle: 'italic', color: COLORS.ink, textAlign: 'center', maxWidth: 1100, marginTop: 4 }}>
                Files are broken into many fixed-size chunks. Each piece has a known hash, so any peer can serve any piece, and the receiver can verify it.
              </div>
            </div>
          );
        }

        // Stage 2 — single server, 5 clients sharing one upstream pipe.
        // YOU are one of the clients; your effective rate is SERVER_TOTAL / N.
        function ChunkCentralizedStage({ elapsed, t }) {
          const clientNames = PEER_NAMES;          // 5 clients
          const N = clientNames.length;
          const perClientRate = CHUNK_SERVER_TOTAL_RATE / N;
          const yourPieces = Math.min(CHUNK_PIECES, Math.floor(elapsed * perClientRate));
          const done = yourPieces >= CHUNK_PIECES;
          const serverColor = COLORS.accent;

          const w = 560, h = 530;
          const { hub, peers: layoutPeers } = getCentralizedLayout(w, h);

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 28, alignItems: 'start' }}>

                <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={420} preserveAspectRatio="xMidYMid meet" style={{ display: 'block' }}>

                        {!done && (
                          <PacketOnEdge x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} t={t * 0.35} phase={p.i * 0.2} color={serverColor} r={6} />

                  <g transform={`translate(${hub.x - 60}, ${hub.y - 70})`}>
                    <ServerRackSvg />

                  {clients.map((p) => (

                <div style={{ marginTop: 8, padding: '6px 12px', background: serverColor, fontFamily: FONTS.sans, fontSize: 13, letterSpacing: '0.18em', color: COLORS.paper, textAlign: 'center', textTransform: 'uppercase' }}>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: 4, maxWidth: 560 }}>
                  {Array.from({ length: CHUNK_PIECES }).map((_, i) => {
                    const filled = i < yourPieces;
                    return (
                      <div key={i} title={filled ? `piece ${i + 1} from server` : `piece ${i + 1} (waiting)`} style={{
                        aspectRatio: '1',
                        minWidth: 12,
                        background: filled ? serverColor : 'transparent',
                        border: `1px solid ${COLORS.rule}`,
                        transition: 'background 180ms linear',
                      }} />
                    );
                  })}
                </div>
                <div style={{ fontFamily: FONTS.serif, fontSize: 22, marginTop: 12 }}>
                  Downloaded <strong>{yourPieces}</strong> / {CHUNK_PIECES} pieces · elapsed <strong>{elapsed.toFixed(1)}s</strong>{done ? '. Complete.' : '...'}
                </div>
                <div style={{ fontFamily: FONTS.serif, fontSize: 17, color: COLORS.inkSoft, marginTop: 6, lineHeight: 1.4 }}>
                  Server uplink: <strong>{CHUNK_SERVER_TOTAL_RATE.toFixed(0)} pieces/sec</strong>, split <strong>{N} ways</strong> → each client gets <strong>{perClientRate.toFixed(2)} pieces/sec</strong>.
                </div>
                <div style={{ marginTop: 12, padding: '10px 14px', background: `${serverColor}14`, border: `1px solid ${serverColor}`, borderLeftWidth: 4 }}>
                  <div style={{ fontFamily: FONTS.serif, fontSize: 17, color: COLORS.ink, fontStyle: 'italic' }}>
                    One source, many askers. Bandwidth and risk concentrate at the host. The more clients show up, the slower everyone gets.
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // Stage 3 — P2P swarm. YOU at center; each peer contributes its own
        // upload bandwidth in parallel, so the total rate scales with peers.
        function ChunkSwarmStage({ elapsed, t }) {
          const N = PEER_NAMES.length;
          const delivered = Math.min(CHUNK_PIECES, Math.floor(elapsed * N * CHUNK_PEER_RATE));
          const done = delivered >= CHUNK_PIECES;
          const owners = Array.from({ length: CHUNK_PIECES }, (_, i) => PEER_NAMES[i % N]);

          const w = 560, h = 530;
          const { cx, cy, peers: layoutPeers } = getP2PLayout(w, h);
          const peers = layoutPeers.map((p) => ({ ...p, color: PEER_COLORS[p.name] }));
          const hub = { x: cx, y: cy };

          return (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 28, alignItems: 'start' }}>
              <div>
                <div style={{ fontFamily: FONTS.sans, fontSize: 13, letterSpacing: '0.18em', color: COLORS.muted, marginBottom: 6 }}>SWARM · {N} PARALLEL PEERS</div>
                <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={420} preserveAspectRatio="xMidYMid meet" style={{ display: 'block' }}>
                  {peers.map((p) => {
                    const e = centralizedSpokeEndpoints(hub, p, 58, 72);
                    return (
                      <g key={`edge-${p.i}`}>
                        <NetworkLinkLine x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} active />
                        {!done && (
                          <>
                            <PacketOnEdge x1={e.x2} y1={e.y2} x2={e.x1} y2={e.y1} t={t} phase={p.i * 0.17} color={p.color} r={6} />
                            <PacketOnEdge x1={e.x2} y1={e.y2} x2={e.x1} y2={e.y1} t={t} phase={p.i * 0.17 + 0.5} color={p.color} r={4} />
                          </>
                        )}
                      </g>
                    );
                  })}
                  <g transform={`translate(${cx}, ${cy})`}>
                    <circle r="44" fill={COLORS.ink} stroke={COLORS.ink} strokeWidth="2" />
                    <text textAnchor="middle" y="6" fontFamily={FONTS.sans} fontSize="20" letterSpacing="0.12em" fill={COLORS.paper}>YOU</text>
                  </g>
                  {peers.map((p) => (
                    <g key={p.name} transform={`translate(${p.x - 60}, ${p.y - 70})`}>
                      <NetworkPersonSvg name={p.name} />
                      <circle cx="106" cy="10" r="9" fill={p.color} stroke={COLORS.ink} strokeWidth="1.5" />
                      <text x="60" y={p.name === 'Alice' ? 6 : 168} textAnchor="middle" fontFamily={FONTS.serif} fontStyle="italic" fontSize="20" fill={COLORS.ink}>{p.name}</text>
                    </g>
                  ))}
                </svg>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column' }}>
                <div style={{ fontFamily: FONTS.sans, fontSize: 13, letterSpacing: '0.18em', color: COLORS.muted, marginBottom: 6 }}>YOUR FILE (PIECES COLOR-CODED BY SOURCE PEER)</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: 4, maxWidth: 560 }}>
                  {Array.from({ length: CHUNK_PIECES }).map((_, i) => {
                    const filled = i < delivered;
                    const owner = owners[i];
                    return (
                      <div key={i} title={filled ? `piece ${i + 1} from ${owner}` : `piece ${i + 1} (waiting)`} style={{
                        aspectRatio: '1',
                        minWidth: 12,
                        background: filled ? PEER_COLORS[owner] : 'transparent',
                        border: `1px solid ${COLORS.rule}`,
                        transition: 'background 180ms linear',
                      }} />
                    );
                  })}
                </div>
                <div style={{ fontFamily: FONTS.serif, fontSize: 22, marginTop: 12 }}>
                  Downloaded <strong>{delivered}</strong> / {CHUNK_PIECES} pieces · elapsed <strong>{elapsed.toFixed(1)}s</strong>{done ? '. Complete.' : '...'}
                </div>
                <div style={{ fontFamily: FONTS.serif, fontSize: 17, color: COLORS.inkSoft, marginTop: 6, lineHeight: 1.4 }}>
                  Each peer contributes <strong>{CHUNK_PEER_RATE.toFixed(0)} pieces/sec</strong>. With <strong>{N}</strong> peers in parallel, total throughput ≈ <strong>{(N * CHUNK_PEER_RATE).toFixed(0)} pieces/sec</strong>, about <strong>N² = {N * N}×</strong> the centralized rate.
                </div>
                <div style={{ marginTop: 12, padding: '10px 14px', background: `${COLORS.ok}14`, border: `1px solid ${COLORS.ok}`, borderLeftWidth: 4 }}>
                  <div style={{ fontFamily: FONTS.serif, fontSize: 17, color: COLORS.ink, fontStyle: 'italic' }}>
                    Many sources in parallel. Every new peer brings its own upload pipe; load and risk spread across the swarm instead of stacking on one host.
                  </div>
                </div>
                <div style={{ marginTop: 12, display: 'flex', flexWrap: 'wrap', gap: 12 }}>
                  {PEER_NAMES.map((name) => (
                    <div key={name} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span style={{ width: 14, height: 14, background: PEER_COLORS[name], border: `1px solid ${COLORS.ink}`, display: 'inline-block' }} />
                      <span style={{ fontFamily: FONTS.serif, fontStyle: 'italic', fontSize: 16 }}>{name}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        }

        function ChunkDistributionDemo() {
          const [stage, setStage] = useState(0);
          const [resetKey, setResetKey] = useState(0);
          const t = useAnimSeconds();
          const startRef = useRef(null);
          const sigRef = useRef('');

          // Reset the elapsed clock whenever the stage or reset button changes,
          // so each stage starts from t=0 and stats stay legible.
          const sig = `${stage}|${resetKey}`;
          if (sigRef.current !== sig) {
            sigRef.current = sig;
            startRef.current = null;
          }
          if (startRef.current === null && t > 0) startRef.current = t;
          const elapsed = startRef.current == null ? 0 : Math.max(0, t - startRef.current);

          // Freeze the elapsed readout once the stage's download finishes,
          // so the on-screen timer stops the moment the last piece arrives.
          const N = PEER_NAMES.length;
          const stageDuration =
            stage === 1 ? CHUNK_PIECES / (CHUNK_SERVER_TOTAL_RATE / N) :
            stage === 2 ? CHUNK_PIECES / (N * CHUNK_PEER_RATE) :
            Infinity;
          const elapsedShown = Math.min(elapsed, stageDuration);

          return (
            <div style={{ border: `1px solid ${COLORS.rule}`, padding: 12, marginTop: 10, display: 'flex', flexDirection: 'column' }}>
              <ChunkStepper stage={stage} setStage={setStage} onReset={() => setResetKey((k) => k + 1)} />
              {stage === 0 && <ChunkSplitStage elapsed={elapsed} />}
              {stage === 1 && <ChunkCentralizedStage elapsed={elapsedShown} t={t} />}
              {stage === 2 && <ChunkSwarmStage elapsed={elapsedShown} t={t} />}
              <ChunkRealWorldNote />
            </div>
          );
        }

        function simpleHash(text) {
          let hash = 0;
          for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
          return hash.toString(16).padStart(8, '0');
        }

        // Slide 6 demo — animated 5-peer swarm with one masked attacker (Mallory).
        // A single Hash Verification toggle decides whether her poisoned pieces are
        // quietly accepted (file ends up INFECTED) or caught and refetched from
        // honest peers (file ends up clean). Click any filled/infected slot to
        // surface the actual expected vs observed hash.
        function MaliciousPeerDemo() {
          const PIECES = 12;
          const PIECE_INTERVAL = 0.75;          // sec between piece arrivals
          const REJECT_FLASH = 0.55;             // sec the rejected slot pulses red
          const REFETCH_TIME = 0.55;             // sec for honest re-fetch packet to fly
          const HONEST = ['Alice', 'Bob', 'Carol', 'Dana'];
          const MALLORY_PIECES = new Set([2, 5, 9]); // 3 of 12 are malicious

          const ownerOf = (i) => MALLORY_PIECES.has(i) ? 'Mallory' : HONEST[i % HONEST.length];
          const refetcherOf = (i) => HONEST[(i * 3 + 1) % HONEST.length];
          const pieceLabel = (i) => `piece-${String(i + 1).padStart(2, '0')}`;

          const [hashOn, setHashOn] = useState(false);
          const [resetKey, setResetKey] = useState(0);
          const [inspectIdx, setInspectIdx] = useState(null);
          const t = useAnimSeconds();
          const startRef = useRef(null);
          const sigRef = useRef('');

          // Reset start clock when toggling verification or pressing Reset.
          const sig = `${hashOn}|${resetKey}`;
          if (sigRef.current !== sig) {
            sigRef.current = sig;
            startRef.current = null;
          }
          if (startRef.current === null && t > 0) startRef.current = t;
          const elapsed = startRef.current == null ? 0 : Math.max(0, t - startRef.current);

          useEffect(() => { setInspectIdx(null); }, [resetKey, hashOn]);

          // Compute deterministic per-piece state from elapsed seconds.
          // phases: 'pending' | 'inflight' | 'rejected' | 'refetching' | 'filled' | 'infected'
          const pieceStates = [];
          for (let i = 0; i < PIECES; i++) {
            const arrival = (i + 1) * PIECE_INTERVAL;
            const owner = ownerOf(i);
            const isMal = owner === 'Mallory';
            let st;
            if (elapsed < arrival - PIECE_INTERVAL) {
              st = { phase: 'pending', owner, isMal };
            } else if (elapsed < arrival) {
              st = {
                phase: 'inflight',
                owner,
                isMal,
                flightT: 1 - (arrival - elapsed) / PIECE_INTERVAL,
              };
            } else if (!isMal) {
              st = { phase: 'filled', owner, color: PEER_COLORS[owner], isMal: false };
            } else if (!hashOn) {
              st = { phase: 'infected', owner: 'Mallory', color: COLORS.danger, isMal: true };
            } else {
              const since = elapsed - arrival;
              if (since < REJECT_FLASH) {
                st = { phase: 'rejected', owner, isMal: true };
              } else if (since < REJECT_FLASH + REFETCH_TIME) {
                const refetcher = refetcherOf(i);
                st = {
                  phase: 'refetching',
                  owner: refetcher,
                  originalOwner: 'Mallory',
                  isMal: true,
                  flightT: (since - REJECT_FLASH) / REFETCH_TIME,
                };
              } else {
                const refetcher = refetcherOf(i);
                st = {
                  phase: 'filled',
                  owner: refetcher,
                  color: PEER_COLORS[refetcher],
                  isMal: false,
                  wasMal: true,
                };
              }
            }
            pieceStates.push(st);
          }

          const allDone = pieceStates.every(s => s.phase === 'filled' || s.phase === 'infected');
          const blocked = pieceStates.filter(s => s.wasMal && s.phase === 'filled').length;
          const accepted = pieceStates.filter(s => s.phase === 'infected').length;
          const remaining = pieceStates.filter(s => s.phase !== 'filled' && s.phase !== 'infected').length;

          // Swarm geometry — Mallory occupies the top slot so the class sees her first.
          const SWARM = ['Mallory', 'Bob', 'Carol', 'Dana', 'Alice'];
          const w = 540, h = 460, cx = w / 2, cy = h / 2;
          const ringR = Math.min(w, h) * 0.36;
          const peers = SWARM.map((name, i) => {
            const ang = -Math.PI / 2 + (i / SWARM.length) * Math.PI * 2;
            return {
              name, i,
              x: cx + Math.cos(ang) * ringR,
              y: cy + Math.sin(ang) * ringR,
              color: name === 'Mallory' ? COLORS.danger : PEER_COLORS[name],
              isMallory: name === 'Mallory',
            };
          });
          const edgeFor = (p) => {
            const dx = cx - p.x, dy = cy - p.y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            return { x1: p.x + ux * 60, y1: p.y + uy * 60, x2: cx - ux * 50, y2: cy - uy * 50 };
          };
          const edgeByName = Object.fromEntries(peers.map(p => [p.name, edgeFor(p)]));

          // In-flight packets to render this frame.
          const inflight = [];
          pieceStates.forEach((st, i) => {
            if (st.phase === 'inflight' || st.phase === 'refetching') {
              const e = edgeByName[st.owner];
              if (!e) return;
              const u = st.flightT;
              inflight.push({
                i,
                x: e.x1 + (e.x2 - e.x1) * u,
                y: e.y1 + (e.y2 - e.y1) * u,
                color: st.phase === 'refetching' ? COLORS.ok : (st.isMal ? COLORS.danger : PEER_COLORS[st.owner]),
                isMal: st.phase === 'inflight' && st.isMal,
                isRefetch: st.phase === 'refetching',
              });
            }
          });

          // Forensic readout for the inspected piece.
          let inspectInfo = null;
          if (inspectIdx !== null && pieceStates[inspectIdx]) {
            const st = pieceStates[inspectIdx];
            if (st.phase === 'filled' || st.phase === 'infected' || st.phase === 'rejected') {
              const expected = simpleHash(pieceLabel(inspectIdx));
              const wasPoisoned = st.phase === 'infected' || st.phase === 'rejected' || st.wasMal;
              const observedRaw = wasPoisoned ? pieceLabel(inspectIdx) + '::PWN' : pieceLabel(inspectIdx);
              const observed = simpleHash(observedRaw);
              inspectInfo = {
                idx: inspectIdx,
                expected,
                observed,
                mismatched: wasPoisoned,
                rescued: st.wasMal && st.phase === 'filled',
              };
            }
          }

          const btn = (active) => ({
            fontFamily: FONTS.sans,
            fontSize: 18,
            letterSpacing: '0.06em',
            padding: '10px 18px',
            border: `1px solid ${active ? COLORS.ok : COLORS.danger}`,
            background: active ? 'rgba(59,110,74,0.10)' : 'rgba(155,42,27,0.08)',
            color: active ? COLORS.ok : COLORS.danger,
            cursor: 'pointer',
          });

          return (
            <div style={{ border: `1px solid ${COLORS.rule}`, padding: 22, marginTop: 18 }}>
              {/* Top controls */}
              <div style={{ display: 'flex', gap: 14, alignItems: 'center', flexWrap: 'wrap' }}>
                <button type="button" onClick={() => setHashOn(v => !v)} style={btn(hashOn)}>
                  Hash verification: {hashOn ? 'ON' : 'OFF'}
                </button>
                <button
                  type="button"
                  onClick={() => setResetKey(k => k + 1)}
                  style={{ fontFamily: FONTS.sans, fontSize: 16, letterSpacing: '0.06em', padding: '10px 16px', border: `1px solid ${COLORS.rule}`, background: COLORS.paper, cursor: 'pointer' }}
                >Reset download</button>
                <div style={{ marginLeft: 'auto', display: 'flex', gap: 18, fontFamily: FONTS.sans, fontSize: 15, letterSpacing: '0.16em', textTransform: 'uppercase', color: COLORS.muted }}>
                  <span>Blocked: <strong style={{ color: COLORS.ok }}>{blocked}</strong></span>
                  <span>Accepted: <strong style={{ color: accepted > 0 ? COLORS.danger : COLORS.muted }}>{accepted}</strong></span>
                  <span>Remaining: <strong style={{ color: COLORS.ink }}>{remaining}</strong></span>
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '540px 1fr', gap: 28, marginTop: 18, alignItems: 'start' }}>
                {/* SWARM */}
                <div>
                  <div style={{ fontFamily: FONTS.sans, fontSize: 14, letterSpacing: '0.18em', color: COLORS.muted, marginBottom: 6 }}>SWARM · MALLORY IS MASKED</div>
                  <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={320} preserveAspectRatio="xMidYMid meet" style={{ display: 'block' }}>
                    {peers.map(p => {
                      const e = edgeByName[p.name];
                      return (
                        <NetworkLinkLine
                          key={`e-${p.name}`}
                          x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2}
                          active={!p.isMallory || !hashOn}
                          dashed={p.isMallory && hashOn}
                        />
                      );
                    })}
                    {inflight.map(pkt => (
                      <g key={`pkt-${pkt.i}`}>
                        <circle cx={pkt.x} cy={pkt.y} r={pkt.isMal ? 11 : 7} fill={pkt.color} stroke={COLORS.ink} strokeWidth={pkt.isMal ? 1.5 : 0} opacity={0.96} />
                        {pkt.isMal && (
                          <text x={pkt.x} y={pkt.y + 4} textAnchor="middle" fontFamily={FONTS.sans} fontSize="13" fontWeight="700" fill={COLORS.paper}>!</text>
                        )}
                        {pkt.isRefetch && (
                          <text x={pkt.x} y={pkt.y - 14} textAnchor="middle" fontFamily={FONTS.sans} fontSize="11" letterSpacing="0.12em" fill={COLORS.ok}>REFETCH</text>
                        )}
                      </g>
                    ))}
                    <g transform={`translate(${cx}, ${cy})`}>
                      <circle r="44" fill={COLORS.ink} stroke={COLORS.ink} strokeWidth="2" />
                      <text textAnchor="middle" y="6" fontFamily={FONTS.sans} fontSize="20" letterSpacing="0.12em" fill={COLORS.paper}>YOU</text>
                    </g>
                    {peers.map(p => (
