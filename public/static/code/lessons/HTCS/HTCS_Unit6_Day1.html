    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script type="application/json" id="speaker-notes">
[
"Welcome to Honors Topics in Computer Science. Today is Day One, and we're starting with the two mathematical tools that, more than any others, hold up the modern internet. One is a hash function. The other is a pair of asymmetric keys. By the end of the next thirty minutes, if I've done my job, you'll understand what each of them is, why each of them exists, and how together they make it possible for you to log in, push a commit, and buy something online without strangers reading over your shoulder.",

"Here's the plan. Four questions, in order. First: what is a hash function, and what are the five properties that make one trustworthy. Second: where hashes are already in your life, usually without you noticing. Third: the problem that keeps symmetric encryption from working on the open internet, and how asymmetric keys solve it. Fourth: we put the pieces together and trace what actually happens when you type a URL that starts with h-t-t-p-s. Four questions, four parts. Let's start at the top.",

"Part 01. Hash functions. I want you to hold one idea in your head for this whole section: a hash function turns anything into a fixed-length fingerprint. That's the whole job. The input can be one letter or a four-gigabyte video. The output is always the same small size. And once you've seen that, a lot of the places hashes show up suddenly make sense.",

"Here's the picture. On the left, input — any bytes at all, any length. In the middle, the hash function, which we'll just write as H of x. On the right, a fixed-length output. For SHA-256, that output is 256 bits long — which we usually write as 64 hexadecimal characters, like you see here. Feed the same input in again tomorrow, from a different computer on the other side of the planet, and you'll get the exact same 64 characters out. That reproducibility is the whole basis of what makes this useful.",

"Property one: deterministic. I can't emphasize this enough. There is no randomness inside a cryptographic hash function. No timestamp, no nonce, no salt baked into the function itself. If Alice hashes the word 'hello' on Monday, on Tuesday, and Bob hashes 'hello' on Friday in Melbourne, all three get the exact same digest. That's what lets a hash work as a fingerprint — everyone can produce it and everyone can check it.",

"Property two is where hashes stop feeling like checksums and start feeling like magic. Look at the two inputs on the left. The only difference is the last character: a lowercase 'o' versus the digit zero. One bit of one character. Now look at the hashes. They're almost completely different — the yellow squares on the right show every bit that flipped. About half of the 256 bits change. This is called the avalanche effect, and it's on purpose: a good hash function scrambles the input so thoroughly that two similar inputs produce outputs that look like unrelated random noise.",

"Property three: hashes are one way. Given a digest, there is no algorithm — none — that recovers the original input. This isn't because we haven't discovered one yet; it's because the hash function deliberately destroys information. A four-gigabyte video collapses to 64 characters. Most of the information is gone. The only attack on a good hash is to guess inputs and try them one by one until you find one that matches. And for SHA-256, that takes longer than the universe has existed.",

"Property four: collision resistance. If two different inputs ever produce the same digest, we call that a collision, and it breaks every system that trusts the hash. A 256-bit hash has roughly 2 to the 256 possible outputs — a number so large that finding two random inputs that collide should take longer than the age of the universe. If anyone ever finds a way to produce collisions faster than that, we retire the algorithm. This has already happened once, and we'll see the graveyard in a minute.",

"Property five is the subtle one. A hash has to be fast enough that we can compute it on every keystroke, every network packet, every commit — microseconds per megabyte on modern hardware. But it has to be slow enough in the reverse direction that it's effectively impossible. Fast forward; infeasible backward. The gap between those two numbers — about sixty orders of magnitude — is what the whole field of cryptography is built on.",

"So here they are on one slide. Deterministic. Fast. Pre-image resistant — you can't recover the input. Collision resistant — you can't find two inputs that match. Avalanche — one-bit changes flip half the output. All five at once. If you're missing any one of them, you don't have a cryptographic hash. You have a plain hash, which is fine for a hash table but will ruin your week in a security context.",

"That distinction matters, because most hash functions you'll encounter in the wild are not cryptographic. CRC-32 catches random transmission errors — useful, but easy to forge. Adler-32 is for zlib compression. MurmurHash is what your programming language probably uses for dictionary keys. MD5 and SHA-1 used to be cryptographic, but both have been broken. For anything security-sensitive today, you want SHA-256, SHA-3, or BLAKE3.",

"Quick history lesson, because it's important. MD5 was introduced in 1992 and broken in 2004 — people can now produce MD5 collisions in seconds on a laptop. In 2008, researchers used that weakness to forge a rogue Certificate Authority. SHA-1 was broken in 2017 by Google's SHAttered attack, which produced two different PDFs with the same SHA-1 digest. Both of these algorithms are still around in legacy systems, but you should never use them for anything new. Reach for SHA-256 or better.",

"Alright — slide for you. Type anything in either box. You'll see the live SHA-256 digest update. Now change one character in one of them. Watch how much of the hash flips — the yellow squares. That's the avalanche effect we talked about three slides ago. This is running locally in your browser, using the same SubtleCrypto API that every secure website uses. No server round-trip. Take a minute, play with it.",

"Part 02. We've got the theory and you've felt the avalanche effect with your own fingers. Now I want to show you that those same five properties aren't an academic exercise — they're already protecting your passwords, your code, and every site you visit. Three quick examples.",

"Start with passwords. When you sign up to a site, your password is never — or at least, never should be — stored. The server hashes it and stores the digest. When you log in, the server hashes what you just typed and compares. If the hashes match, you're in. The consequence is that when a database gets leaked, the attackers walk away with hashes, not passwords. Even the engineers who wrote the server have never seen your password in plaintext.",

"Git. Every single commit in every Git repository in the world is named by its own hash. That ID you see next to git log output — a1b2c3d — that's the SHA-1 of the commit's contents: the tree, its parent pointer, the author, the message. If anything about an old commit changes, even a single byte, its hash changes, and every commit descended from it changes too. You cannot rewrite history silently. The chain of hashes is the integrity check.",

"TLS — the S in HTTPS — attaches a hash to every packet it sends. A keyed hash, called a MAC. If any router in the middle flips a bit of your traffic, the MAC stops matching and the connection tears down. Same idea with downloads: when you grab Ubuntu or a piece of software, the publisher gives you the expected hash. You hash what you got and compare. If they match, you know nobody swapped a malicious version on the mirror.",

"Part 03. That's hashing. Now we change gears entirely and talk about how two strangers, who have never met, share a secret over a network where everyone can listen. Hashes can prove a message wasn't tampered with — but they can't keep it private. For privacy, we need keys.",

"This is the classic setup. Alice and Bob. Alice wants to send Bob a message. Only Bob should be able to read it. They've never met — they have no pre-arranged secret. Everything that passes between them travels over the open internet, where every router, every Wi-Fi access point, and every government can see it. For decades this problem was considered basically unsolvable.",

"Start with what we had before: symmetric encryption. One key, same key on both sides. You lock the message with it, you unlock the message with it. Alice and Bob both have copies of the same key. This is fast, it's been around for centuries — think Caesar cipher, Enigma — and it works perfectly, with exactly one catch.",

"How do they get the key to each other in the first place? Alice can't just email it to Bob, because Eve is reading email. She can't post it on a website, because Eve is reading websites. She can't text it, because Eve is reading texts. To share the key, Alice needs a secure channel — but if she had a secure channel, she wouldn't need the key. It's circular. This is called the key distribution problem, and for most of human history the only answer was 'meet in person.'",

"1976. Whitfield Diffie and Martin Hellman publish a paper that proposes something outrageous: what if the key that locks a message and the key that unlocks it were two different keys? Not the same key used twice — two mathematically linked keys, generated together, such that one could lock and the other could unlock, but neither could be derived from the other. The public key, on the left, only locks — safe to share with anyone, put it on your website, print it on your business card. The private key, on the right, only unlocks — it never leaves your computer. The pair is generated together from a hard math problem (factoring large primes, or elliptic curves), and the hardness of that problem is what keeps the private key private.",

"Back to Alice and Bob. Step one: Bob generates his keypair and publishes his public key. It goes up on his website, or into a public keyring, or on his GitHub profile. His private key stays on his laptop. Anyone in the world can download his public key — including Eve — and that's completely fine.",

"Step two: Alice wants to send Bob a message. She fetches Bob's public key and uses it to encrypt her message. The result is ciphertext — an envelope sealed with Bob's public key. Here's the strange part: even Alice can't unseal it now. The public key can only lock. She does not have the matching private key, so once she's encrypted, the message is opaque even to her.",

"Step three: Alice sends the ciphertext across the open internet to Bob. Bob receives it and uses his private key — the one that never left his computer — to decrypt. Out pops 'Meet me at noon.' Nothing secret ever travelled over the wire. The public key is public. The ciphertext is useless without the private key. The private key never moved.",

"So what about Eve? She's been watching the whole time. She has Bob's public key — everyone does. She has the ciphertext — she copied it off the wire. She has absolutely nothing useful. To open the envelope she'd need Bob's private key, which she doesn't have, and trying every possible private key would take, roughly, the rest of her life and the rest of the universe's life.",

"Before we move on, let's walk that exchange together one more time. Click through it step by step. You'll see Bob generate a keypair, publish the public key, Alice fetch it and encrypt, the ciphertext travel the wire while Eve watches, and Bob decrypt on the other side. Take your time with it — this is the picture you want burned into your head before we start combining the pieces.",

"Part 04. We've now got both ingredients on the table — hashes that fingerprint, and keys that gate. The last act of today is putting them together. With those two tools, almost every trust guarantee the modern internet depends on falls out as a combination.",

"Here's a beautiful twist. The keys work in both directions. Encrypt with public, decrypt with private — that's what we just saw; it gives you confidentiality. But you can also flip it: encrypt with private, decrypt with public. If Bob encrypts something with his private key, anyone can decrypt it with his public key. That sounds useless — everyone can read it — but it proves one critical thing: only Bob could have produced it. That's authenticity. That's a signature.",

"A digital signature is hashing and asymmetric encryption combined. Bob hashes his document, giving a short digest. Then he encrypts that digest with his private key — that encrypted digest is the signature. He attaches it to the document and sends the pair. To verify, anyone hashes the document themselves, decrypts the signature with Bob's public key, and compares. If they match, the document is authentic and hasn't been altered. If either changes, the signatures stop matching.",

"And now, HTTPS. Every padlock in your browser. When you connect to a site, the server sends its certificate — which is a public key signed by a Certificate Authority your browser trusts. Your browser and the server use asymmetric crypto to negotiate a session key. They switch to that session key for the rest of the conversation, because symmetric is much faster. Every packet gets a MAC — a keyed hash — so tampering is detected. Every single piece we've talked about today shows up in that handshake.",

"If you remember nothing else from today, remember these two shapes. A hash is a fingerprint. It's a one-way summary that proves something hasn't changed — integrity. A key is a gate. It's a lock you carry in two halves, and the direction you turn it tells you whether you're keeping secrets or proving identity. Combine the two and you get essentially every trust guarantee the modern internet depends on.",

"Seven takeaways. A hash is one-way and fixed-length. Good hashes are deterministic, collision-resistant, and show avalanche. MD5 and SHA-1 are broken — retire them. Symmetric is fast but needs a shared secret. Asymmetric splits the key into a public lock and a private unlock. Signatures swap the roles — private to sign, public to verify. And HTTPS is the whole kit together: asymmetric to start the conversation, symmetric to carry it, hashes to seal every packet.",

"Next class we'll tackle the one question I deliberately didn't answer today. I kept saying 'Bob publishes his public key,' and 'anyone can download it.' But if the public key is public, how do you know it's actually Bob's and not Eve's? That's the story of certificates, Certificate Authorities, and the chain of trust that makes the whole thing actually work in practice. Questions before we wrap?"
]
</script>

  <body>
    <deck-stage width="1920" height="1080"></deck-stage>
    <div id="deck-root"></div>

    <script>
      /**
       * <deck-stage> — reusable web component for HTML decks.
       *
       * Handles:
       *  (a) speaker notes — reads <script type="application/json" id="speaker-notes">
       *      and posts {slideIndexChanged: N} to the parent window on nav.
       *  (b) keyboard navigation — ←/→, PgUp/PgDn, Space, Home/End, number keys.
       *  (c) press R to reset to slide 0 (with a tasteful keyboard hint).
       *  (d) bottom-center overlay showing slide count + hints, fades out on idle.
       *  (e) auto-scaling — inner canvas is a fixed design size (default 1920×1080)
       *      scaled with `transform: scale()` to fit the viewport, letterboxed.
       *      Set the `noscale` attribute to render at authored size (1:1) — the
       *      PPTX exporter sets this so its DOM capture sees unscaled geometry.
       *  (f) print — `@media print` lays every slide out as its own page at the
       *      design size, so the browser's Print → Save as PDF produces a clean
       *      one-page-per-slide PDF with no extra setup.
       *
       * Slides are HIDDEN, not unmounted. Non-active slides stay in the DOM with
       * `visibility: hidden` + `opacity: 0`, so their state (videos, iframes,
       * form inputs, React trees) is preserved across navigation.
       *
       * Lifecycle event — the component dispatches a `slidechange` CustomEvent on
       * itself whenever the active slide changes (including the initial mount).
       * The event bubbles and composes out of shadow DOM, so you can listen on
       * the <deck-stage> element or on document:
       *
       *   document.querySelector('deck-stage').addEventListener('slidechange', (e) => {
       *     e.detail.index         // new 0-based index
       *     e.detail.previousIndex // previous index, or -1 on init
       *     e.detail.total         // total slide count
       *     e.detail.slide         // the new active slide element
       *     e.detail.previousSlide // the prior slide element, or null on init
       *     e.detail.reason        // 'init' | 'keyboard' | 'click' | 'tap' | 'api'
       *   });
       *
       * Persistence: current slide index is saved to localStorage keyed by the
       * document path, so refresh returns you to the same place.
       *
       * Usage:
       *   <deck-stage width="1920" height="1080">
       *     <section data-label="Title">...</section>
       *     <section data-label="Agenda">...</section>
       *   </deck-stage>
       *
       * Slides are the direct element children of <deck-stage>. Each slide is
       * automatically tagged with:
       *   - data-screen-label="NN Label"   (1-indexed, for comment flow)
       *   - data-om-validate="no_overflowing_text,no_overlapping_text,slide_sized_text"
       */

      (() => {
        const DESIGN_W_DEFAULT = 1920;
        const DESIGN_H_DEFAULT = 1080;
        const STORAGE_PREFIX = 'deck-stage:slide:';
        const OVERLAY_HIDE_MS = 1800;
        const VALIDATE_ATTR = 'no_overflowing_text,no_overlapping_text,slide_sized_text';

        const pad2 = (n) => String(n).padStart(2, '0');

        const stylesheet = `
    :host {
      position: fixed;
      inset: 0;
      display: block;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas {
      position: relative;
      transform-origin: center center;
      flex-shrink: 0;
      background: #fff;
      will-change: transform;
    }

    /* Slides live in light DOM (via <slot>) so authored CSS still applies.
       We absolutely position each slotted child to stack them. */
    ::slotted(*) {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      box-sizing: border-box !important;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    ::slotted([data-deck-active]) {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    /* Tap zones for mobile — back/forward thirds like Stories.
       Transparent, no visible UI, don't block the overlay. */
    .tapzones {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 2147482000;
      pointer-events: none;
    }
    .tapzone {
      flex: 1;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    /* Only activate tap zones on coarse pointers (touch devices). */
    @media (hover: hover) and (pointer: fine) {
      .tapzones { display: none; }
    }

    .overlay {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 6px) scale(0.92);
      filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: #000;
      color: #fff;
      border-radius: 999px;
      font-size: 12px;
      font-feature-settings: "tnum" 1;
      letter-spacing: 0.01em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.8,.2,1), filter 260ms ease;
      transform-origin: center bottom;
      z-index: 2147483000;
      user-select: none;
    }
    .overlay[data-visible] {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
      filter: blur(0);
    }

    .btn {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: 0;
      margin: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      cursor: default;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      min-width: 28px;
      border-radius: 999px;
      color: rgba(255,255,255,0.72);
      transition: background 140ms ease, color 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .btn:active { background: rgba(255,255,255,0.18); }
    .btn:focus { outline: none; }
    .btn:focus-visible { outline: none; }
    .btn::-moz-focus-inner { border: 0; }
    .btn svg { width: 14px; height: 14px; display: block; }
    .btn.reset,
    .btn.presenter {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 0 10px 0 12px;
      gap: 6px;
      color: rgba(255,255,255,0.72);
    }
    .btn.reset .kbd,
    .btn.presenter .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1;
      color: rgba(255,255,255,0.88);
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
    }

    .count {
      font-variant-numeric: tabular-nums;
      color: #fff;
      font-weight: 500;
      padding: 0 8px;
      min-width: 42px;
      text-align: center;
      font-size: 12px;
    }
    .count .sep { color: rgba(255,255,255,0.45); margin: 0 3px; font-weight: 400; }
    .count .total { color: rgba(255,255,255,0.55); }

    .divider {
      width: 1px;
      height: 14px;
      background: rgba(255,255,255,0.18);
      margin: 0 2px;
    }

    /* ── Print: one page per slide, no chrome ────────────────────────────
       The screen layout stacks every slide at inset:0 inside a scaled
       canvas; for print we want them in document flow at the authored
       design size so the browser paginates one slide per sheet. The
       @page size is set from the width/height attributes via the inline
       <style id="deck-stage-print-page"> that connectedCallback injects
       into <head> (the @page at-rule has no effect inside shadow DOM). */
    @media print {
      :host {
        position: static;
        inset: auto;
        background: none;
        overflow: visible;
        color: inherit;
      }
      .stage { position: static; display: block; }
      .canvas {
        transform: none !important;
        width: auto !important;
        height: auto !important;
        background: none;
        will-change: auto;
      }
      ::slotted(*) {
        position: relative !important;
        inset: auto !important;
        width: var(--deck-design-w) !important;
        height: var(--deck-design-h) !important;
        box-sizing: border-box !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto;
        break-after: page;
        page-break-after: always;
        break-inside: avoid;
        overflow: hidden;
      }
      ::slotted(*:last-child) {
        break-after: auto;
        page-break-after: auto;
      }
      .overlay, .tapzones { display: none !important; }
    }
  `;

        class DeckStage extends HTMLElement {
          static get observedAttributes() { return ['width', 'height', 'noscale']; }

          constructor() {
            super();
            this._root = this.attachShadow({ mode: 'open' });
            this._index = 0;
            this._slides = [];
            this._notes = [];
            this._hideTimer = null;
            this._mouseIdleTimer = null;
            this._storageKey = STORAGE_PREFIX + (location.pathname || '/');

            this._onKey = this._onKey.bind(this);
            this._onResize = this._onResize.bind(this);
            this._onSlotChange = this._onSlotChange.bind(this);
            this._onMouseMove = this._onMouseMove.bind(this);
            this._onTapBack = this._onTapBack.bind(this);
            this._onTapForward = this._onTapForward.bind(this);
          }

          get designWidth() {
            return parseInt(this.getAttribute('width'), 10) || DESIGN_W_DEFAULT;
          }
          get designHeight() {
            return parseInt(this.getAttribute('height'), 10) || DESIGN_H_DEFAULT;
          }

          connectedCallback() {
            this._render();
            this._loadNotes();
            this._syncPrintPageRule();
            window.addEventListener('keydown', this._onKey);
            window.addEventListener('resize', this._onResize);
            window.addEventListener('mousemove', this._onMouseMove, { passive: true });
            // Initial collection + layout happens via slotchange, which fires on mount.
          }

          disconnectedCallback() {
            window.removeEventListener('keydown', this._onKey);
            window.removeEventListener('resize', this._onResize);
            window.removeEventListener('mousemove', this._onMouseMove);
            if (this._hideTimer) clearTimeout(this._hideTimer);
            if (this._mouseIdleTimer) clearTimeout(this._mouseIdleTimer);
          }

          attributeChangedCallback() {
            if (this._canvas) {
              this._canvas.style.width = this.designWidth + 'px';
              this._canvas.style.height = this.designHeight + 'px';
              this._canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
              this._canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');
              this._fit();
              this._syncPrintPageRule();
            }
          }

          _render() {
            const style = document.createElement('style');
            style.textContent = stylesheet;

            const stage = document.createElement('div');
            stage.className = 'stage';

            const canvas = document.createElement('div');
            canvas.className = 'canvas';
            canvas.style.width = this.designWidth + 'px';
            canvas.style.height = this.designHeight + 'px';
            canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
            canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');

            const slot = document.createElement('slot');
            slot.addEventListener('slotchange', this._onSlotChange);
            canvas.appendChild(slot);
            stage.appendChild(canvas);

            // Tap zones (mobile): left third = back, right third = forward.
            const tapzones = document.createElement('div');
            tapzones.className = 'tapzones export-hidden';
            tapzones.setAttribute('aria-hidden', 'true');
            const tzBack = document.createElement('div');
            tzBack.className = 'tapzone tapzone--back';
            const tzMid = document.createElement('div');
            tzMid.className = 'tapzone tapzone--mid';
            tzMid.style.pointerEvents = 'none';
            const tzFwd = document.createElement('div');
            tzFwd.className = 'tapzone tapzone--fwd';
            tzBack.addEventListener('click', this._onTapBack);
            tzFwd.addEventListener('click', this._onTapForward);
            tapzones.append(tzBack, tzMid, tzFwd);

            // Overlay: compact, solid black, with clickable controls.
            const overlay = document.createElement('div');
            overlay.className = 'overlay export-hidden';
            overlay.setAttribute('role', 'toolbar');
            overlay.setAttribute('aria-label', 'Deck controls');
            overlay.innerHTML = `
        <button class="btn prev" type="button" aria-label="Previous slide" title="Previous (←)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
        </button>
        <span class="count" aria-live="polite"><span class="current">1</span><span class="sep">/</span><span class="total">1</span></span>
        <button class="btn next" type="button" aria-label="Next slide" title="Next (→)">

            overlay.querySelector('.prev').addEventListener('click', () => this._go(this._index - 1, 'click'));

          /** @page must live in the document stylesheet — it's a no-op inside

          _syncPrintPageRule() {

            let tag = document.getElementById(id);
            if (!tag) {

              tag.id = id;
              document.head.appendChild(tag);
            }

              const tag = el.tagName;
              return tag !== 'TEMPLATE' && tag !== 'SCRIPT' && tag !== 'STYLE';
            });

            this._slides.forEach((slide, i) => {
              const n = i + 1;

              // then an existing data-screen-label, then first heading, else "Slide".
              let label = slide.getAttribute('data-label');
              if (!label) {

                  label = existing.replace(/^\s*\d+\s*/, '').trim() || existing;

            if (!tag) { this._notes = []; return; }

            } catch (e) {
              console.warn('[deck-stage] Failed to parse #speaker-notes JSON:', e);
              this._notes = [];
            }

          _restoreIndex() {
            try {
              const raw = localStorage.getItem(this._storageKey);
              if (raw != null) {

                if (Number.isFinite(n) && n >= 0 && n < this._slides.length) {

                }

          }

          _persistIndex() {
            try { localStorage.setItem(this._storageKey, String(this._index)); }
            catch (e) { /* ignore */ }
          }

          _applyIndex({ showOverlay = true, broadcast = true, reason = 'init' } = {}) {
            if (!this._slides.length) return;
            const prev = this._prevIndex == null ? -1 : this._prevIndex;
            const curr = this._index;
            this._slides.forEach((s, i) => {
              if (i === curr) s.setAttribute('data-deck-active', '');
              else s.removeAttribute('data-deck-active');
            });
            if (this._countEl) this._countEl.textContent = String(curr + 1);
            this._persistIndex();

              try { window.postMessage({ slideIndexChanged: curr }, '*'); } catch (e) { }

              // (2) In-page CustomEvent on the <deck-stage> element itself.
              //     Bubbles and composes out of shadow DOM so slide code can listen:
              //       document.querySelector('deck-stage').addEventListener('slidechange', e => {
              //         e.detail.index, e.detail.previousIndex, e.detail.total, e.detail.slide, e.detail.reason
              //       });
              const detail = {
                index: curr,
                previousIndex: prev,
                total: this._slides.length,
                slide: this._slides[curr] || null,
                previousSlide: prev >= 0 ? (this._slides[prev] || null) : null,
                reason: reason, // 'init' | 'keyboard' | 'click' | 'tap' | 'api'
              };
              this.dispatchEvent(new CustomEvent('slidechange', {
                detail,
                bubbles: true,
                composed: true,
              }));
            }

            this._prevIndex = curr;
            if (showOverlay) this._flashOverlay();
          }

          _flashOverlay() {
            if (!this._overlay) return;
            this._overlay.setAttribute('data-visible', '');
            if (this._hideTimer) clearTimeout(this._hideTimer);
            this._hideTimer = setTimeout(() => {
              this._overlay.removeAttribute('data-visible');
            }, OVERLAY_HIDE_MS);
          }

          _fit() {
            if (!this._canvas) return;
            // PPTX export sets noscale so the DOM capture sees authored-size
            // geometry — the scaled canvas is in shadow DOM, so the exporter's
            // resetTransformSelector can't reach .canvas.style.transform directly.
            if (this.hasAttribute('noscale')) {

              return;
            }
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const s = Math.min(vw / this.designWidth, vh / this.designHeight);
            this._canvas.style.transform = `scale(${s})`;
          }

          _onResize() { this._fit(); }

          _onMouseMove() {
            // Keep overlay visible while mouse moves; hide after idle.
            this._flashOverlay();
          }

          _onTapBack(e) {
            e.preventDefault();
            this._go(this._index - 1, 'tap');
          }

          _onTapForward(e) {
            e.preventDefault();
            this._go(this._index + 1, 'tap');
          }

          _onKey(e) {
            // Ignore when the user is typing.
            const t = e.target;
            if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
            if (e.metaKey || e.ctrlKey || e.altKey) return;

            const key = e.key;
            let handled = true;

            if (key === 'ArrowRight' || key === 'PageDown' || key === ' ' || key === 'Spacebar') {
              this._go(this._index + 1, 'keyboard');
            } else if (key === 'ArrowLeft' || key === 'PageUp') {
              this._go(this._index - 1, 'keyboard');
            } else if (key === 'Home') {
              this._go(0, 'keyboard');
            } else if (key === 'End') {
              this._go(this._slides.length - 1, 'keyboard');
            } else if (key === 'r' || key === 'R') {
              this._go(0, 'keyboard');
            } else if (/^[0-9]$/.test(key)) {
              // 1..9 jump to that slide; 0 jumps to 10.
              const n = key === '0' ? 9 : parseInt(key, 10) - 1;
              if (n < this._slides.length) this._go(n, 'keyboard');
            } else {
              handled = false;
            }

            if (handled) {
              e.preventDefault();
              this._flashOverlay();
            }
          }

          _go(i, reason = 'api') {
            if (!this._slides.length) return;
            const clamped = Math.max(0, Math.min(this._slides.length - 1, i));
            if (clamped === this._index) {
              this._flashOverlay();
              return;
            }
            this._index = clamped;
            this._applyIndex({ showOverlay: true, broadcast: true, reason });
          }

          // Public API ------------------------------------------------------------

          /** Current slide index (0-based). */
          get index() { return this._index; }
          /** Total slide count. */
          get length() { return this._slides.length; }
          /** Programmatically navigate. */
          goTo(i) { this._go(i, 'api'); }
          next() { this._go(this._index + 1, 'api'); }
          prev() { this._go(this._index - 1, 'api'); }
          reset() { this._go(0, 'api'); }
        }

        if (!customElements.get('deck-stage')) {
          customElements.define('deck-stage', DeckStage);
        }
      })();

        function StageArrow({ from, to, label, sublabel, color = COLORS.ink, curve = -60, style = {} }) {
          const [x1, y1] = from;

              )}

          );
        }

        // Hex-dot matrix — visual metaphor of "avalanche": 256 bits rendered as dots,
        // flipped bits lit in accent. Accepts two hex strings, compares bit by bit.
        function BitGrid({ hexA, hexB, cols = 16, dot = 22, gap = 6, style = {} }) {
          const bitsA = hexToBits(hexA);
          const bitsB = hexB ? hexToBits(hexB) : null;
          const count = Math.min(bitsA.length, 256);
          const rows = Math.ceil(count / cols);
          return (
            <svg width={cols * (dot + gap)} height={rows * (dot + gap)} style={style}>
              {Array.from({ length: count }).map((_, i) => {
                const r = Math.floor(i / cols);
                const c = i % cols;
                const bitA = bitsA[i];
                const bitB = bitsB ? bitsB[i] : bitA;
                const changed = bitA !== bitB;
                const on = bitB === 1;
                let fill = on ? COLORS.ink : 'transparent';
                let stroke = COLORS.rule;
                if (changed) { fill = COLORS.accent; stroke = COLORS.accent; }
                return <rect key={i} x={c * (dot + gap)} y={r * (dot + gap)} width={dot} height={dot} fill={fill} stroke={stroke} strokeWidth="1.5" />;
              })}
            </svg>
          );
        }

        function hexToBits(hex) {
          if (!hex) return [];
          const clean = hex.replace(/[^0-9a-f]/gi, '');
          const bits = [];
          for (const ch of clean) {
            const v = parseInt(ch, 16);
            for (let i = 3; i >= 0; i--) bits.push((v >> i) & 1);
          }
          return bits;
        }

        async function sha256(text) {

        function useHash(text) {

            return () => { active = false; };
          }, [text]);
          return hash;
        }

        // ──────────────────────────────────────────────────────────────────────────
        // Live SHA-256 playground — two text inputs, two hashes, live diff highlight,

    <!-- Presenter view: press P to pop open this same file with ?presenter=1
         in a small window (your laptop screen) while the deck stays full-screen
         on the projector. The two windows stay in sync via postMessage. -->
    <script>
      (() => {
        const PARAM = 'presenter';
        const STORAGE_KEY = 'deck-stage:slide:' + (location.pathname || '/');
        const inPresenter = new URLSearchParams(location.search).has(PARAM);

        const readNotes = () => {
          const tag = document.getElementById('speaker-notes');
          if (!tag) return [];
          try {
            const parsed = JSON.parse(tag.textContent || '[]');
            return Array.isArray(parsed) ? parsed : [];
          } catch (_) { return []; }
        };

        if (inPresenter) mountPresenter();
        else mountAudience();

        // ───────── Audience side (the deck) ─────────
        function mountAudience() {
          let presenterWin = null;

          const stage = () => document.querySelector('deck-stage');

          const currentIndex = () => {
            const s = stage();
            if (!s) return { index: 0, total: 1 };
            const slides = s.querySelectorAll(':scope > [data-deck-slide]');
            let idx = 0;
            slides.forEach((el, i) => { if (el.hasAttribute('data-deck-active')) idx = i; });
            return { index: idx, total: slides.length || 1 };
          };

          const pushSlide = (target) => {
            const win = target || presenterWin;
            if (!win) return;
            try {
              const cur = currentIndex();
              win.postMessage({ type: 'slide', index: cur.index, total: cur.total }, '*');
            } catch (_) {}
          };

          const openPresenter = () => {
            if (presenterWin && !presenterWin.closed) {
              try { presenterWin.focus(); } catch (_) {}
              return;
            }
            const url = location.pathname + '?' + PARAM + '=1' + location.hash;
            const w = window.open(
              url,
              'htcs-presenter',
              'popup=yes,width=1100,height=820,menubar=no,toolbar=no,location=no,status=no'
            );
            if (!w) { flashHint('Allow popups to use presenter mode (P)'); return; }
            presenterWin = w;
          };

          const wireStage = () => {
            const s = stage();
            if (!s) { setTimeout(wireStage, 100); return; }
            s.addEventListener('slidechange', (e) => {
              if (!presenterWin || presenterWin.closed) return;
              try {
                presenterWin.postMessage({
                  type: 'slide',
                  index: e.detail.index,
                  total: e.detail.total,
                }, '*');
              } catch (_) {}
            });
          };
          wireStage();

          window.addEventListener('message', (e) => {
            const m = e && e.data;
            if (!m || typeof m !== 'object') return;
            // Recapture the presenter window — handles deck reload while presenter is open.
            if (m.type === 'ready' || m.type === 'nav') {
              if (e.source && (!presenterWin || presenterWin.closed)) {
                presenterWin = e.source;
              }
            }
            if (m.type === 'ready') { pushSlide(e.source || presenterWin); return; }
            if (m.type === 'nav') {
              const map = { prev: 'ArrowLeft', next: 'ArrowRight', first: 'Home', last: 'End' };
              const key = map[m.dir];
              if (!key) return;
              window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
            }
          });

          window.addEventListener('keydown', (ev) => {
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const t = ev.target;
            if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
            if (ev.key === 'p' || ev.key === 'P') {
              ev.preventDefault();
              openPresenter();
            }
          });

          function flashHint(text) {
            let el = document.getElementById('presenter-hint');
            if (!el) {
              el = document.createElement('div');
              el.id = 'presenter-hint';
              Object.assign(el.style, {
                position: 'fixed', top: '16px', left: '50%',
                transform: 'translateX(-50%)',
                background: 'rgba(0,0,0,0.85)', color: '#fff',
                padding: '10px 16px', borderRadius: '999px',
                fontFamily: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif',
                fontSize: '13px', zIndex: 2147483647,
                opacity: '0', transition: 'opacity 200ms ease',
                pointerEvents: 'none',
              });
              document.body.appendChild(el);
            }
            el.textContent = text;
            requestAnimationFrame(() => { el.style.opacity = '1'; });
            clearTimeout(flashHint._t);
            flashHint._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
          }
        }

              border: 1px solid #2a2a31;
              padding: 10px 22px; border-radius: 10px;
              cursor: pointer; min-width: 130px;
            }
            .pv-nav button:hover { background: #25252c; }
            .pv-nav button:active { background: #303038; }

            .pv-status {
              text-align: center;
              font-family: "Inter Tight", -apple-system, sans-serif;
              font-size: 12px; opacity: 0.5; margin-top: -6px; min-height: 1em;
            }
          `;
          document.head.appendChild(style);

          const app = document.createElement('div');
          app.className = 'pv-app';
          app.innerHTML = `
            <header class="pv-head">
              <div class="pv-title"></div>
              <div class="pv-meta">
                <div class="pv-counter">Slide <b class="pv-cur">–</b> / <span class="pv-total">–</span></div>
                <div class="pv-timer" data-timer>00:00</div>
                <button class="pv-tbtn" data-timer-toggle>Start</button>
                <button class="pv-tbtn" data-timer-reset>Reset</button>
              </div>
            </header>
            <section class="pv-now">
              <div class="pv-now-label">Now speaking</div>
              <div class="pv-now-text"></div>
            </section>
            <section class="pv-next">
              <div class="pv-next-label">Up next</div>
              <div class="pv-next-text"></div>
            </section>
            <nav class="pv-nav">
              <button data-nav="first">⏮ First</button>
              <button data-nav="prev">◀ Prev</button>
              <button data-nav="next">Next ▶</button>
              <button data-nav="last">Last ⏭</button>
            </nav>
            <div class="pv-status"></div>
          `;
          document.body.appendChild(app);

          const $ = (sel) => app.querySelector(sel);
          $('.pv-title').textContent = title;
          const statusEl = $('.pv-status');
          const setStatus = (msg) => { statusEl.textContent = msg || ''; };

          let curIdx = 0;
          let total = Math.max(notes.length || 1, 1);

          const render = (idx) => {
            curIdx = Math.max(0, Math.min(total - 1, idx | 0));
            $('.pv-cur').textContent = String(curIdx + 1);
            $('.pv-total').textContent = String(total);
            const cur = notes[curIdx];
            const next = notes[curIdx + 1];
            const nowEl = $('.pv-now-text');
            const nextEl = $('.pv-next-text');
            if (cur && String(cur).trim()) {
              nowEl.classList.remove('pv-empty');
              nowEl.textContent = cur;
            } else {
              nowEl.classList.add('pv-empty');
              nowEl.textContent = '(no notes for this slide)';
            }
            if (next && String(next).trim()) {
              nextEl.classList.remove('pv-empty');
              nextEl.textContent = next;
            } else if (curIdx + 1 >= total) {
              nextEl.classList.add('pv-empty');
              nextEl.textContent = '(end of deck)';
            } else {
              nextEl.classList.add('pv-empty');
              nextEl.textContent = '(no notes for next slide)';
            }
          };

          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const n = raw == null ? 0 : parseInt(raw, 10);
            render(Number.isFinite(n) ? n : 0);
          } catch (_) { render(0); }

          // Timer
          const tEl = $('[data-timer]');
          const tToggle = $('[data-timer-toggle]');
          const tReset = $('[data-timer-reset]');
          let tStart = 0, tAccum = 0, tRunning = false, tTick = null;

          const fmt = (ms) => {
            const s = Math.floor(ms / 1000);
            const mm = Math.floor(s / 60), ss = s % 60;
            if (mm >= 60) {
              const hh = Math.floor(mm / 60), m2 = mm % 60;
              return hh + ':' + String(m2).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
            }
            return String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
          };
          const paint = () => {
            const elapsed = tAccum + (tRunning ? (Date.now() - tStart) : 0);
            tEl.textContent = fmt(elapsed);
          };
          const startStop = () => {
            if (tRunning) {
              tAccum += Date.now() - tStart;
              tRunning = false;
              tToggle.textContent = 'Resume';
              clearInterval(tTick); tTick = null;
            } else {
              tStart = Date.now();
              tRunning = true;
              tToggle.textContent = 'Pause';
              tTick = setInterval(paint, 250);
            }
            paint();
          };
          const resetTimer = () => {
            tAccum = 0; tStart = Date.now();
            if (!tRunning) tToggle.textContent = 'Start';
            paint();
          };
          tToggle.addEventListener('click', startStop);
          tReset.addEventListener('click', resetTimer);
          paint();

          // Nav
          const sendNav = (dir) => {
            if (window.opener && !window.opener.closed) {
              try { window.opener.postMessage({ type: 'nav', dir }, '*'); return; }
              catch (_) {}
            }
            setStatus('Deck window not reachable — open the deck and press P, then return here.');
          };
          app.querySelectorAll('[data-nav]').forEach((btn) => {
            btn.addEventListener('click', () => sendNav(btn.getAttribute('data-nav')));
          });

          window.addEventListener('keydown', (ev) => {
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const k = ev.key;
            if (k === 'ArrowRight' || k === 'PageDown') { ev.preventDefault(); sendNav('next'); }
            else if (k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); sendNav('prev'); }
            else if (k === 'Home') { ev.preventDefault(); sendNav('first'); }
            else if (k === 'End') { ev.preventDefault(); sendNav('last'); }
            else if (k === ' ' || k === 'Spacebar') { ev.preventDefault(); startStop(); }
            else if (k === 'r' || k === 'R') { ev.preventDefault(); resetTimer(); }
          });

          // Receive slide updates
          window.addEventListener('message', (e) => {
            const m = e && e.data;
            if (!m || typeof m !== 'object') return;
            if (m.type === 'slide') {
              if (typeof m.total === 'number' && m.total > 0) total = m.total;
              render(m.index | 0);
              setStatus('');
            }
          });

          // Storage fallback (deck always writes its index here)
          window.addEventListener('storage', (e) => {
            if (e.key !== STORAGE_KEY || e.newValue == null) return;
            const n = parseInt(e.newValue, 10);
            if (Number.isFinite(n)) render(n);
            // If we lost our opener (deck reloaded), try to re-handshake.
            sayReady();
          });

          // Handshake — ask deck to push current state.
          const sayReady = () => {
            if (window.opener && !window.opener.closed) {
              try { window.opener.postMessage({ type: 'ready' }, '*'); } catch (_) {}
            }
          };
          if (!window.opener || window.opener.closed) {
            setStatus('Standalone mode — open the deck in another window and press P to link them.');
          }
          sayReady();
          setTimeout(sayReady, 250);
        }
      })();
    </script>
  </body>

</html>
