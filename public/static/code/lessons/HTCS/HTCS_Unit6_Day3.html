            return { index: idx, total: slides.length || 1 };
          };

          const pushSlide = (target) => {
            const win = target || presenterWin;
            if (!win) return;
            try {
              const cur = currentIndex();
              win.postMessage({ type: 'slide', index: cur.index, total: cur.total }, '*');
            } catch (_) { }
          };

          const openPresenter = () => {
            if (presenterWin && !presenterWin.closed) {
              try { presenterWin.focus(); } catch (_) { }
              return;
            }
            const url = location.pathname + '?' + PARAM + '=1' + location.hash;
            const w = window.open(
              url,
              'htcs-presenter',
              'popup=yes,width=1100,height=820,menubar=no,toolbar=no,location=no,status=no'
            );
            if (!w) { flashHint('Allow popups to use presenter mode (P)'); return; }
            presenterWin = w;
          };

          const wireStage = () => {
            const s = stage();
            if (!s) { setTimeout(wireStage, 100); return; }
            s.addEventListener('slidechange', (e) => {
              if (!presenterWin || presenterWin.closed) return;
              try {
                presenterWin.postMessage({
                  type: 'slide',
                  index: e.detail.index,
                  total: e.detail.total,
                }, '*');
              } catch (_) { }
            });
          };
          wireStage();

          window.addEventListener('message', (e) => {
            const m = e && e.data;
            if (!m || typeof m !== 'object') return;
            if (m.type === 'ready' || m.type === 'nav') {
              if (e.source && (!presenterWin || presenterWin.closed)) {
                presenterWin = e.source;
              }
            }
            if (m.type === 'ready') { pushSlide(e.source || presenterWin); return; }
            if (m.type === 'nav') {
              const map = { prev: 'ArrowLeft', next: 'ArrowRight', first: 'Home', last: 'End' };
              const key = map[m.dir];
              if (!key) return;
              window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
            }
          });

          window.addEventListener('keydown', (ev) => {
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const t = ev.target;
            if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
            if (ev.key === 'p' || ev.key === 'P') {
              ev.preventDefault();
              openPresenter();
            }
          });

          function flashHint(text) {
            let el = document.getElementById('presenter-hint');
            if (!el) {
              el = document.createElement('div');
              el.id = 'presenter-hint';
              Object.assign(el.style, {
                position: 'fixed', top: '16px', left: '50%',
                transform: 'translateX(-50%)',
                background: 'rgba(0,0,0,0.85)', color: '#fff',
                padding: '10px 16px', borderRadius: '999px',
                fontFamily: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif',
                fontSize: '13px', zIndex: 2147483647,
                opacity: '0', transition: 'opacity 200ms ease',
                pointerEvents: 'none',
              });
              document.body.appendChild(el);
            }
            el.textContent = text;
            requestAnimationFrame(() => { el.style.opacity = '1'; });
            clearTimeout(flashHint._t);
            flashHint._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
          }
        }

        // ───────── Presenter side (the popup) ─────────
        function mountPresenter() {
          const stage = document.querySelector('deck-stage');
          if (stage) stage.remove();
          const root = document.getElementById('deck-root');
          if (root) root.remove();

          const notes = readNotes();
          const title = (document.title || 'Deck').replace(/\s+/g, ' ').trim();
          document.title = title + ' — Presenter';

          const style = document.createElement('style');
          style.textContent = `
            html, body {
              background: #0c0c0e !important;
              color: #f5f3ee !important;
              overflow: auto !important;
              height: auto !important;
              min-height: 100%;
              margin: 0; padding: 0;
            }
            .pv-app {
              box-sizing: border-box;
              display: grid;
              grid-template-rows: auto 1fr auto auto auto;
              gap: 16px;
              min-height: 100vh;
              padding: 24px clamp(20px, 4vw, 56px) 28px;
              font-family: "Source Serif 4", Georgia, serif;
            }
            .pv-head {
              display: flex; align-items: center; justify-content: space-between;
              gap: 24px; flex-wrap: wrap;
              font-family: "Inter Tight", -apple-system, sans-serif;
            }
            .pv-title { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; }
            .pv-meta { display: flex; align-items: center; gap: 14px; font-feature-settings: "tnum" 1; }
            .pv-counter { font-size: 15px; opacity: 0.85; }
            .pv-counter b { font-weight: 600; }
            .pv-timer {
              font-family: "JetBrains Mono", ui-monospace, monospace;
              font-size: 22px; background: #1a1a1f;
              padding: 6px 12px; border-radius: 8px;
              min-width: 92px; text-align: center;
            }
            .pv-tbtn {
              font: inherit; font-family: "Inter Tight", -apple-system, sans-serif;
              font-size: 12px; letter-spacing: 0.04em;
              background: #1a1a1f; color: #f5f3ee;
              border: 1px solid #2a2a31; padding: 6px 12px;
              border-radius: 8px; cursor: pointer;
            }
            .pv-tbtn:hover { background: #25252c; }

            .pv-now {
              background: #14141a; border-radius: 14px;
              padding: clamp(20px, 3vw, 36px);
              display: flex; flex-direction: column; gap: 12px;
              min-height: 0; overflow: hidden;
            }
            .pv-now-label, .pv-next-label {
              font-family: "Inter Tight", -apple-system, sans-serif;
              font-size: 11px; letter-spacing: 0.18em;
              text-transform: uppercase; opacity: 0.55;
            }
            .pv-now-text {
              font-size: clamp(22px, 2.4vw, 34px); line-height: 1.45;
              overflow-y: auto; padding-right: 8px;
            }
            .pv-next {
              background: #101015; border-radius: 12px;
              padding: 18px clamp(18px, 3vw, 30px);
              opacity: 0.62; max-height: 22vh; overflow: hidden;
            }
            .pv-next-text {
              font-size: clamp(14px, 1.2vw, 18px); line-height: 1.45;
              margin-top: 8px;
              display: -webkit-box; -webkit-line-clamp: 4;
              -webkit-box-orient: vertical; overflow: hidden;
            }
            .pv-empty { opacity: 0.45; font-style: italic; }

            .pv-nav {
              display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
              font-family: "Inter Tight", -apple-system, sans-serif;
            }
            .pv-nav button {
              font: inherit; font-size: 14px;
              background: #1a1a1f; color: #f5f3ee;
              border: 1px solid #2a2a31;
              padding: 10px 22px; border-radius: 10px;
              cursor: pointer; min-width: 130px;
            }
            .pv-nav button:hover { background: #25252c; }
            .pv-nav button:active { background: #303038; }

            .pv-status {
              text-align: center;
              font-family: "Inter Tight", -apple-system, sans-serif;
              font-size: 12px; opacity: 0.5; margin-top: -6px; min-height: 1em;
            }
          `;
          document.head.appendChild(style);

          const app = document.createElement('div');
          app.className = 'pv-app';
          app.innerHTML = `
            <header class="pv-head">
              <div class="pv-title"></div>
              <div class="pv-meta">
                <div class="pv-counter">Slide <b class="pv-cur">–</b> / <span class="pv-total">–</span></div>
                <div class="pv-timer" data-timer>00:00</div>
                <button class="pv-tbtn" data-timer-toggle>Start</button>
                <button class="pv-tbtn" data-timer-reset>Reset</button>
              </div>
            </header>
            <section class="pv-now">
              <div class="pv-now-label">Now speaking</div>
              <div class="pv-now-text"></div>
            </section>
            <section class="pv-next">
              <div class="pv-next-label">Up next</div>
              <div class="pv-next-text"></div>
            </section>
            <nav class="pv-nav">
              <button data-nav="first">⏮ First</button>
              <button data-nav="prev">◀ Prev</button>
              <button data-nav="next">Next ▶</button>
              <button data-nav="last">Last ⏭</button>
            </nav>
            <div class="pv-status"></div>
          `;
          document.body.appendChild(app);

          const $ = (sel) => app.querySelector(sel);
          $('.pv-title').textContent = title;
          const statusEl = $('.pv-status');
          const setStatus = (msg) => { statusEl.textContent = msg || ''; };

          let curIdx = 0;
          let total = Math.max(notes.length || 1, 1);

          const render = (idx) => {
            curIdx = Math.max(0, Math.min(total - 1, idx | 0));
            $('.pv-cur').textContent = String(curIdx + 1);
            $('.pv-total').textContent = String(total);
            const cur = notes[curIdx];
            const next = notes[curIdx + 1];
            const nowEl = $('.pv-now-text');
            const nextEl = $('.pv-next-text');
            if (cur && String(cur).trim()) {
              nowEl.classList.remove('pv-empty');
              nowEl.textContent = cur;
            } else {
              nowEl.classList.add('pv-empty');
              nowEl.textContent = '(no notes for this slide)';
            }
            if (next && String(next).trim()) {
              nextEl.classList.remove('pv-empty');
              nextEl.textContent = next;
            } else if (curIdx + 1 >= total) {
              nextEl.classList.add('pv-empty');
              nextEl.textContent = '(end of deck)';
            } else {
              nextEl.classList.add('pv-empty');
              nextEl.textContent = '(no notes for next slide)';
            }
          };

          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const n = raw == null ? 0 : parseInt(raw, 10);
            render(Number.isFinite(n) ? n : 0);
          } catch (_) { render(0); }

          // Timer
          const tEl = $('[data-timer]');
          const tToggle = $('[data-timer-toggle]');
          const tReset = $('[data-timer-reset]');
          let tStart = 0, tAccum = 0, tRunning = false, tTick = null;

          const fmt = (ms) => {
            const s = Math.floor(ms / 1000);
            const mm = Math.floor(s / 60), ss = s % 60;
            if (mm >= 60) {
              const hh = Math.floor(mm / 60), m2 = mm % 60;
              return hh + ':' + String(m2).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
            }
            return String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
          };
          const paint = () => {
            const elapsed = tAccum + (tRunning ? (Date.now() - tStart) : 0);
            tEl.textContent = fmt(elapsed);
          };
          const startStop = () => {
            if (tRunning) {
              tAccum += Date.now() - tStart;
              tRunning = false;
              tToggle.textContent = 'Resume';
              clearInterval(tTick); tTick = null;
            } else {
              tStart = Date.now();
              tRunning = true;
              tToggle.textContent = 'Pause';
              tTick = setInterval(paint, 250);
            }
            paint();
          };
          const resetTimer = () => {
            tAccum = 0; tStart = Date.now();
            if (!tRunning) tToggle.textContent = 'Start';
            paint();
          };
          tToggle.addEventListener('click', startStop);
          tReset.addEventListener('click', resetTimer);
          paint();

          const sendNav = (dir) => {
            if (window.opener && !window.opener.closed) {
              try { window.opener.postMessage({ type: 'nav', dir }, '*'); return; }
              catch (_) { }
            }
            setStatus('Deck window not reachable — open the deck and press P, then return here.');
          };
          app.querySelectorAll('[data-nav]').forEach((btn) => {
            btn.addEventListener('click', () => sendNav(btn.getAttribute('data-nav')));
          });

          window.addEventListener('keydown', (ev) => {
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const k = ev.key;
            if (k === 'ArrowRight' || k === 'PageDown') { ev.preventDefault(); sendNav('next'); }
            else if (k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); sendNav('prev'); }
            else if (k === 'Home') { ev.preventDefault(); sendNav('first'); }
            else if (k === 'End') { ev.preventDefault(); sendNav('last'); }
            else if (k === ' ' || k === 'Spacebar') { ev.preventDefault(); startStop(); }
            else if (k === 'r' || k === 'R') { ev.preventDefault(); resetTimer(); }
          });

          window.addEventListener('message', (e) => {
            const m = e && e.data;
            if (!m || typeof m !== 'object') return;
            if (m.type === 'slide') {
              if (typeof m.total === 'number' && m.total > 0) total = m.total;
              render(m.index | 0);
              setStatus('');
            }
          });

          window.addEventListener('storage', (e) => {
            if (e.key !== STORAGE_KEY || e.newValue == null) return;
            const n = parseInt(e.newValue, 10);
            if (Number.isFinite(n)) render(n);
            sayReady();
          });

          const sayReady = () => {
            if (window.opener && !window.opener.closed) {
              try { window.opener.postMessage({ type: 'ready' }, '*'); } catch (_) { }
            }
          };
          if (!window.opener || window.opener.closed) {
            setStatus('Standalone mode — open the deck in another window and press P to link them.');
          }
          sayReady();
          setTimeout(sayReady, 250);
        }
      })();
    </script>
  </body>

</html>
