<!DOCTYPE html>
<!--
  HTCS deck scaffold.

  How to use:
    1. cp _template.html "HTCS Day NN - <Topic>.html"
    2. Find/replace these top-of-file tokens (one occurrence each unless noted):
         Proof of Work         — full topic title (e.g. "Peer-to-Peer Networks")
         Unit 6               — course unit (e.g. "Unit 6")
         Day 03             — short label (e.g. "Day 03")
       The combined "HTCS · Unit 6 · Day 03" string appears in the
       SlideFooter; "Proof of Work" appears in <title> and the SlideFooter
       right-hand label. Day 03 also appears on the cover italic line.
    3. Fill in the per-slide content placeholders (search for `__` to find
       all of them — Cover / Agenda / Part dividers / Recap / Next class).
    4. Add real speaker notes to the JSON array in <head> — one entry per slide,
       in slide order (the deck-stage reads it positionally).
    5. Add new content slides as new functions in the per-deck React block,
       export them on window, and append them to SLIDES = [...] in the right
       order. Run RESTRUCTURE_AGENDA_AND_PARTS.md to confirm everything aligns.

  Placeholder convention: every fill-in slot uses __SCREAMING_SNAKE__ so it
  renders as plain text in both HTML and JSX contexts (`{{...}}` would be
  parsed as a JSX object literal and crash). Search for `__` to find every
  remaining placeholder before publishing.
-->
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <title>HTCS · Day 03 · Proof of Work</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        height: 100%;
      }

      body {
        font-family: "Source Serif 4", Georgia, serif;
      }

      textarea {
        font-family: "JetBrains Mono", monospace;

      * {
        -webkit-font-smoothing: antialiased;
      }
    </style>

    <script type="application/json" id="speaker-notes">
[
"Day 03. Today we build Bitcoin from scratch — not as code, but as a sequence of social problems and the cleverest known fix for each one. By the end you should be able to explain proof of work to a non-technical friend in under a minute.",

"Four parts. Part 01: why a group of friends needs a ledger and what it takes to trust a single line in it. Part 02: the leap from 'tally sheet plus cash' to 'the ledger IS the money'. Part 03: how to keep the ledger honest when nobody is in charge. Part 04: miners, the longest chain, and the 21 million coin cap that turn this into the Bitcoin you read about in the news.",

"Part 01. We start with the most pedestrian situation: friends who exchange cash all the time. The whole rest of the deck is the answer to one question — 'what's the minimum machinery that lets us replace the cash with a notebook everyone trusts?'",

"Imagine four friends — Alice, Bob, Charlie, You — exchanging cash all the time. Lunch, the movies, splitting the Uber. By the end of the week nobody can remember who owes whom, and every settlement requires physical money to change hands. There has to be a less exhausting way.",

"So you write everything down in a shared ledger. Every transaction goes on the page. At the end of the month you tally up the net for each person: if you owe, you put cash in a pot; if you're owed, you take cash out. One settlement instead of a hundred. That's the move that opens the rest of the lecture.",

"Protocol v1 has two rules: anyone can add a line, and at the end of the month you settle the net. Question for the class: where does this fall apart? Pause for an answer. The hole: if anyone can add a line, what stops Bob from writing 'Alice pays Bob $100' the moment Alice steps away?",

"Patch number one: every line must be SIGNED by the sender. We're cashing in everything we did on Day 01 — Alice has a private key, the world has her public key, only she can produce a signature on the message 'Alice pays Bob $100'. Anyone can verify it. Bob can't forge it. There are 2^256 possible signatures; you can't guess.",

"But signatures are deterministic. The same message always produces the same signature. So if Bob has ONE valid signed line from Alice, he can paste it again and again — same message, same signature, still 'valid'. Fix: every transaction needs a unique ID. Now 'tx-001 Alice pays Bob $100' and 'tx-002 Alice pays Bob $100' are different messages, requiring different signatures.",

"Part 02. Signatures got us to 'no forgery'. But the system still leans on a final cash settlement. The next move is to drop the cash entirely — and we have to plug one more hole first.",

"Even with signatures and unique IDs, what stops Charlie from racking up a thousand dollars of debt this month and just leaving town? A signature proves intent. It does not prove solvency. So if we ever want to get rid of the monthly cash settlement, we need a third rule.",

"Protocol v2 adds: NO OVERSPENDING. The ledger refuses any line that would push the sender's balance negative. Anyone reading the ledger top-to-bottom can verify this — start every account at zero, walk the lines, reject anything that would overdraw. Even a perfectly signed transaction is invalid if the money isn't there.",

"And here's the leap. Once we trust the ledger to enforce 'no overspending', we don't actually need to settle in cash anymore. Whatever the ledger says your balance is, that IS your money. We never touch dollar bills again. Money becomes a row in a list everyone agrees on.",

"We give the unit a new name — Ledger Dollars, or LD — and call it what it is: a cryptocurrency. This is what every cryptocurrency, Bitcoin included, fundamentally is: a signed, balanced, append-only ledger that everyone agrees on. Everything in the rest of the lecture is about that last clause.",

"Part 03. We've designed a currency. But we've quietly assumed a single canonical ledger. Whoever holds it is, in effect, a bank — they can censor your transactions, fake their own, rewrite history. That's the very thing we were trying to escape. So who keeps the ledger?",

"Ask the class: 'who controls this?' The honest answer for what we've built so far is: someone has to. And that someone is just a bank with extra steps. The whole point was nobody. So we have to decentralize.",

"Patch four: everyone keeps their OWN copy of the ledger. New transactions broadcast to all peers; everyone updates their own copy locally. No single party in charge. But now we have a new problem: what happens when two copies disagree? That's the rest of the part.",

"Quick refresher from Day 01: SHA-256. Easy forward — instantly hashes any input to a 256-bit fingerprint. Impossibly hard backward — given a target output, the only known way to find an input is to guess. There are 2^256 possible inputs. This asymmetry is the whole engine of what's coming next.",

"Proof of work. Define a valid block as one whose SHA-256 hash starts with, say, thirty zero bits. The probability that a random nonce works is 1 in 2^30, about a billion. You have to guess and check, billions of times. But once you find the nonce, anyone in the world can verify your work in a single hash. Hard to make. Trivial to check.",

"We bundle transactions into BLOCKS. Each block carries: (a) the previous block's hash, (b) a batch of transactions, (c) a nonce that makes the whole thing hash to enough zeros. The 'prev hash' field chains them — tamper with any old block, its hash changes, the next block's prev-hash field no longer matches, and every block after it is invalidated. That's the blockchain.",

"Part 04. We have blocks, we have proof of work. But what happens when two miners find a valid block at almost the same time? The network briefly disagrees. We need a tiebreaker that nobody has to vote on.",

"Two valid chains. The rule is simple: always trust the LONGEST chain — the one with the most cumulative proof of work behind it. Eventually one side gets ahead, and everyone reorganizes onto it. Forks happen all the time on real Bitcoin and resolve in a few blocks.",

"Why is this safe? To rewrite a transaction from five blocks back, an attacker has to redo that block's proof of work AND every block built on top of it AND keep up with the rest of the world extending the honest chain. They'd need more than half of all the hash power on Earth — the famous '51% attack'. Past blocks aren't locked, they're BURIED. Each new block deepens the burial.",

"But who is doing all this hashing? Miners. They run dedicated machines making millions of guesses per second. The miner who lands the next valid block writes one extra line at the top: 'Network pays miner X some new LD'. Brand-new coins, minted by the protocol. That's their incentive. Mining is a global lottery weighted by hash power.",

"And here's where the Bitcoin number comes from. Every 210,000 blocks — about four years — the per-block reward halves. Started at 50, then 25, then 12.5, then 6.25, on down. The geometric series 210,000 × (50 + 25 + 12.5 + ...) converges to exactly 21 million. There will only ever be 21 million Bitcoin, baked into the protocol, enforced by every honest node.",

"And — this is real. Open mempool.space or blockstream.info live for the class. Every claim from the last hour — signed transactions, broadcast to peers, batched into blocks, secured by proof of work, chosen by longest chain — is what a Bitcoin node is doing right now. Walk through the latest block: height, transactions, miner, reward.",

"Recap. A cryptocurrency is a signed, balanced, append-only ledger that everyone keeps a copy of. To pick which copy is real, the network races to find a hash with enough leading zeros — the longest chain wins, and forging a longer one would cost more electricity than the world has. Three rules + the proof-of-work twist. That's the whole show.",

"Now for the part the whitepaper doesn't cover. Six facts that make even Bitcoin believers uncomfortable. Ask students which one surprises them most before moving on.",

"Day 04 preview: smart contracts. What happens when the ledger isn't just storing 'who owns what' but actually running CODE that everyone agrees executed correctly? That's Ethereum, and it changes what a blockchain is for. Questions before we wrap?"
]
</script>
  </head>

  <body>
    <deck-stage width="1920" height="1080"></deck-stage>
    <div id="deck-root"></div>

    <script>
      /**
       * <deck-stage> — reusable web component for HTML decks.
       *
       * Handles:
       *  (a) speaker notes — reads <script type="application/json" id="speaker-notes">
       *      and posts {slideIndexChanged: N} to the parent window on nav.
       *  (b) keyboard navigation — ←/→, PgUp/PgDn, Space, Home/End, number keys.
       *  (c) press R to reset to slide 0 (with a tasteful keyboard hint).
       *  (d) bottom-center overlay showing slide count + hints, fades out on idle.
       *  (e) auto-scaling — inner canvas is a fixed design size (default 1920×1080)
       *      scaled with `transform: scale()` to fit the viewport, letterboxed.
       *      Set the `noscale` attribute to render at authored size (1:1) — the
       *      PPTX exporter sets this so its DOM capture sees unscaled geometry.
       *  (f) print — `@media print` lays every slide out as its own page at the
       *      design size, so the browser's Print → Save as PDF produces a clean
       *      one-page-per-slide PDF with no extra setup.
       *
       * Slides are HIDDEN, not unmounted. Non-active slides stay in the DOM with
       * `visibility: hidden` + `opacity: 0`, so their state (videos, iframes,
       * form inputs, React trees) is preserved across navigation.
       *
       * Lifecycle event — the component dispatches a `slidechange` CustomEvent on
       * itself whenever the active slide changes (including the initial mount).
       * The event bubbles and composes out of shadow DOM, so you can listen on
       * the <deck-stage> element or on document:
       *
       *   document.querySelector('deck-stage').addEventListener('slidechange', (e) => {
       *     e.detail.index         // new 0-based index
       *     e.detail.previousIndex // previous index, or -1 on init
       *     e.detail.total         // total slide count
       *     e.detail.slide         // the new active slide element
       *     e.detail.previousSlide // the prior slide element, or null on init
       *     e.detail.reason        // 'init' | 'keyboard' | 'click' | 'tap' | 'api'
       *   });
       *
       * Persistence: current slide index is saved to localStorage keyed by the
       * document path, so refresh returns you to the same place.
       *
       * Usage:
       *   <deck-stage width="1920" height="1080">
       *     <section data-label="Title">...</section>
       *     <section data-label="Agenda">...</section>
       *   </deck-stage>
       *
       * Slides are the direct element children of <deck-stage>. Each slide is
       * automatically tagged with:
       *   - data-screen-label="NN Label"   (1-indexed, for comment flow)
       *   - data-om-validate="no_overflowing_text,no_overlapping_text,slide_sized_text"
       */

      (() => {
        const DESIGN_W_DEFAULT = 1920;
        const DESIGN_H_DEFAULT = 1080;
        const STORAGE_PREFIX = 'deck-stage:slide:';
        const OVERLAY_HIDE_MS = 1800;
        const VALIDATE_ATTR = 'no_overflowing_text,no_overlapping_text,slide_sized_text';

        const pad2 = (n) => String(n).padStart(2, '0');

        const stylesheet = `
    :host {
      position: fixed;
      inset: 0;
      display: block;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas {
      position: relative;
      transform-origin: center center;
      flex-shrink: 0;
      background: #fff;
      will-change: transform;
    }

    /* Slides live in light DOM (via <slot>) so authored CSS still applies.
       We absolutely position each slotted child to stack them. */
    ::slotted(*) {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      box-sizing: border-box !important;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    ::slotted([data-deck-active]) {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    /* Tap zones for mobile — back/forward thirds like Stories.
       Transparent, no visible UI, don't block the overlay. */
    .tapzones {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 2147482000;
      pointer-events: none;
    }
    .tapzone {
      flex: 1;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    /* Only activate tap zones on coarse pointers (touch devices). */
    @media (hover: hover) and (pointer: fine) {
      .tapzones { display: none; }
    }

    .overlay {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 6px) scale(0.92);
      filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: #000;
      color: #fff;
      border-radius: 999px;
      font-size: 12px;
      font-feature-settings: "tnum" 1;
      letter-spacing: 0.01em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.8,.2,1), filter 260ms ease;
      transform-origin: center bottom;
      z-index: 2147483000;
      user-select: none;
    }
    .overlay[data-visible] {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
      filter: blur(0);
    }

    .btn {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: 0;
      margin: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      cursor: default;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      min-width: 28px;
      border-radius: 999px;
      color: rgba(255,255,255,0.72);
      transition: background 140ms ease, color 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .btn:active { background: rgba(255,255,255,0.18); }
    .btn:focus { outline: none; }
    .btn:focus-visible { outline: none; }
    .btn::-moz-focus-inner { border: 0; }
    .btn svg { width: 14px; height: 14px; display: block; }
    .btn.reset,
    .btn.presenter {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 0 10px 0 12px;
      gap: 6px;
      color: rgba(255,255,255,0.72);
    }
    .btn.reset .kbd,
    .btn.presenter .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1;
      color: rgba(255,255,255,0.88);
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
    }

    .count {
      font-variant-numeric: tabular-nums;
      color: #fff;
      font-weight: 500;
      padding: 0 8px;
      min-width: 42px;
      text-align: center;
      font-size: 12px;
    }
    .count .sep { color: rgba(255,255,255,0.45); margin: 0 3px; font-weight: 400; }
    .count .total { color: rgba(255,255,255,0.55); }

    .divider {
      width: 1px;
      height: 14px;
      background: rgba(255,255,255,0.18);
      margin: 0 2px;
    }

    /* ── Print: one page per slide, no chrome ────────────────────────────
       The screen layout stacks every slide at inset:0 inside a scaled
       canvas; for print we want them in document flow at the authored
       design size so the browser paginates one slide per sheet. The
       @page size is set from the width/height attributes via the inline
       <style id="deck-stage-print-page"> that connectedCallback injects
       into <head> (the @page at-rule has no effect inside shadow DOM). */
    @media print {
      :host {
        position: static;
        inset: auto;
        background: none;
        overflow: visible;
        color: inherit;
      }
      .stage { position: static; display: block; }
      .canvas {
        transform: none !important;
        width: auto !important;
        height: auto !important;
        background: none;
        will-change: auto;
      }
      ::slotted(*) {
        position: relative !important;
        inset: auto !important;
        width: var(--deck-design-w) !important;
        height: var(--deck-design-h) !important;
        box-sizing: border-box !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto;
        break-after: page;
        page-break-after: always;
        break-inside: avoid;
        overflow: hidden;
      }
      ::slotted(*:last-child) {
        break-after: auto;
        page-break-after: auto;
      }
      .overlay, .tapzones { display: none !important; }
    }
  `;

        class DeckStage extends HTMLElement {
          static get observedAttributes() { return ['width', 'height', 'noscale']; }

          constructor() {
            super();
            this._root = this.attachShadow({ mode: 'open' });
            this._index = 0;
            this._slides = [];
            this._notes = [];
            this._hideTimer = null;
            this._mouseIdleTimer = null;
            this._storageKey = STORAGE_PREFIX + (location.pathname || '/');

            this._onKey = this._onKey.bind(this);
            this._onResize = this._onResize.bind(this);
            this._onSlotChange = this._onSlotChange.bind(this);
            this._onMouseMove = this._onMouseMove.bind(this);
            this._onTapBack = this._onTapBack.bind(this);
            this._onTapForward = this._onTapForward.bind(this);
          }

          get designWidth() {
            return parseInt(this.getAttribute('width'), 10) || DESIGN_W_DEFAULT;
          }
          get designHeight() {
            return parseInt(this.getAttribute('height'), 10) || DESIGN_H_DEFAULT;
          }

          connectedCallback() {
            this._render();
            this._loadNotes();
            this._syncPrintPageRule();
            window.addEventListener('keydown', this._onKey);
            window.addEventListener('resize', this._onResize);
            window.addEventListener('mousemove', this._onMouseMove, { passive: true });
          }

          disconnectedCallback() {
            window.removeEventListener('keydown', this._onKey);
            window.removeEventListener('resize', this._onResize);
            window.removeEventListener('mousemove', this._onMouseMove);
            if (this._hideTimer) clearTimeout(this._hideTimer);
            if (this._mouseIdleTimer) clearTimeout(this._mouseIdleTimer);
          }

          attributeChangedCallback() {
            if (this._canvas) {
              this._canvas.style.width = this.designWidth + 'px';
              this._canvas.style.height = this.designHeight + 'px';
              this._canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
              this._canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');
              this._fit();
              this._syncPrintPageRule();
            }
          }

          _render() {
            const style = document.createElement('style');
            style.textContent = stylesheet;

            const stage = document.createElement('div');
            stage.className = 'stage';

            const canvas = document.createElement('div');
            canvas.className = 'canvas';
            canvas.style.width = this.designWidth + 'px';
            canvas.style.height = this.designHeight + 'px';
            canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
            canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');

            const slot = document.createElement('slot');
            slot.addEventListener('slotchange', this._onSlotChange);
            canvas.appendChild(slot);
            stage.appendChild(canvas);

            const tapzones = document.createElement('div');
            tapzones.className = 'tapzones export-hidden';
            tapzones.setAttribute('aria-hidden', 'true');
            const tzBack = document.createElement('div');
            tzBack.className = 'tapzone tapzone--back';
            const tzMid = document.createElement('div');
            tzMid.className = 'tapzone tapzone--mid';
            tzMid.style.pointerEvents = 'none';
            const tzFwd = document.createElement('div');
            tzFwd.className = 'tapzone tapzone--fwd';
            tzBack.addEventListener('click', this._onTapBack);
            tzFwd.addEventListener('click', this._onTapForward);
            tapzones.append(tzBack, tzMid, tzFwd);

            const overlay = document.createElement('div');
            overlay.className = 'overlay export-hidden';
            overlay.setAttribute('role', 'toolbar');
            overlay.setAttribute('aria-label', 'Deck controls');
            overlay.innerHTML = `
        <button class="btn prev" type="button" aria-label="Previous slide" title="Previous (←)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
        </button>
        <span class="count" aria-live="polite"><span class="current">1</span><span class="sep">/</span><span class="total">1</span></span>
        <button class="btn next" type="button" aria-label="Next slide" title="Next (→)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        </button>
        <span class="divider"></span>
        <button class="btn reset" type="button" aria-label="Reset to first slide" title="Reset (R)">Reset<span class="kbd">R</span></button>
        <button class="btn presenter" type="button" aria-label="Open presenter view" title="Presenter view (P)">Presenter<span class="kbd">P</span></button>
      `;

            overlay.querySelector('.prev').addEventListener('click', () => this._go(this._index - 1, 'click'));
            overlay.querySelector('.next').addEventListener('click', () => this._go(this._index + 1, 'click'));
            overlay.querySelector('.reset').addEventListener('click', () => this._go(0, 'click'));
            overlay.querySelector('.presenter').addEventListener('click', () => {
              window.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true }));
            });

            this._root.append(style, stage, tapzones, overlay);
            this._canvas = canvas;
            this._slot = slot;
            this._overlay = overlay;
            this._countEl = overlay.querySelector('.current');
            this._totalEl = overlay.querySelector('.total');
          }

          /** @page must live in the document stylesheet — it's a no-op inside
           *  shadow DOM. Inject/update a single <head> style tag so the print
           *  sheet matches the design size and Save-as-PDF yields one slide per
           *  page with no margins. */
          _syncPrintPageRule() {
            const id = 'deck-stage-print-page';
            let tag = document.getElementById(id);
            if (!tag) {
              tag = document.createElement('style');
              tag.id = id;
              document.head.appendChild(tag);
            }
            tag.textContent =
              '@page { size: ' + this.designWidth + 'px ' + this.designHeight + 'px; margin: 0; } ' +
              '@media print { html, body { margin: 0 !important; padding: 0 !important; background: none !important; overflow: visible !important; height: auto !important; } ' +
              '* { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }';
          }

          _onSlotChange() {
            this._collectSlides();
            this._restoreIndex();
            this._applyIndex({ showOverlay: false, broadcast: true, reason: 'init' });
            this._fit();
          }

          _collectSlides() {
            const assigned = this._slot.assignedElements({ flatten: true });
            this._slides = assigned.filter((el) => {
              const tag = el.tagName;
              return tag !== 'TEMPLATE' && tag !== 'SCRIPT' && tag !== 'STYLE';
            });

            this._slides.forEach((slide, i) => {
              const n = i + 1;
              let label = slide.getAttribute('data-label');
              if (!label) {
                const existing = slide.getAttribute('data-screen-label');
                if (existing) {
                  label = existing.replace(/^\s*\d+\s*/, '').trim() || existing;
                }
              }
              if (!label) {
                const h = slide.querySelector('h1, h2, h3, [data-title]');
                if (h) label = (h.textContent || '').trim().slice(0, 40);
              }
              if (!label) label = 'Slide';
              slide.setAttribute('data-screen-label', `${pad2(n)} ${label}`);

              if (!slide.hasAttribute('data-om-validate')) {
                slide.setAttribute('data-om-validate', VALIDATE_ATTR);
              }

              slide.setAttribute('data-deck-slide', String(i));
            });

            if (this._totalEl) this._totalEl.textContent = String(this._slides.length || 1);
            if (this._index >= this._slides.length) this._index = Math.max(0, this._slides.length - 1);
          }

          _loadNotes() {
            const tag = document.getElementById('speaker-notes');
            if (!tag) { this._notes = []; return; }
            try {
              const parsed = JSON.parse(tag.textContent || '[]');
              if (Array.isArray(parsed)) this._notes = parsed;
            } catch (e) {
              console.warn('[deck-stage] Failed to parse #speaker-notes JSON:', e);
              this._notes = [];
            }
          }

          _restoreIndex() {
            try {
              const raw = localStorage.getItem(this._storageKey);
              if (raw != null) {
                const n = parseInt(raw, 10);
                if (Number.isFinite(n) && n >= 0 && n < this._slides.length) {
                  this._index = n;
                }
              }
            } catch (e) { /* ignore */ }
          }

          _persistIndex() {
            try { localStorage.setItem(this._storageKey, String(this._index)); }
            catch (e) { /* ignore */ }
          }

          _applyIndex({ showOverlay = true, broadcast = true, reason = 'init' } = {}) {
            if (!this._slides.length) return;
            const prev = this._prevIndex == null ? -1 : this._prevIndex;
            const curr = this._index;
            this._slides.forEach((s, i) => {
              if (i === curr) s.setAttribute('data-deck-active', '');
              else s.removeAttribute('data-deck-active');
            });
            if (this._countEl) this._countEl.textContent = String(curr + 1);
            this._persistIndex();

            if (broadcast) {
              try { window.postMessage({ slideIndexChanged: curr }, '*'); } catch (e) { }

              const detail = {
                index: curr,
                previousIndex: prev,
                total: this._slides.length,
                slide: this._slides[curr] || null,
                previousSlide: prev >= 0 ? (this._slides[prev] || null) : null,
                reason: reason,
              };
              this.dispatchEvent(new CustomEvent('slidechange', {
                detail,
                bubbles: true,
                composed: true,
              }));
            }

            this._prevIndex = curr;
            if (showOverlay) this._flashOverlay();
          }

          _flashOverlay() {
            if (!this._overlay) return;
            this._overlay.setAttribute('data-visible', '');
            if (this._hideTimer) clearTimeout(this._hideTimer);
            this._hideTimer = setTimeout(() => {
              this._overlay.removeAttribute('data-visible');
            }, OVERLAY_HIDE_MS);
          }

          _fit() {
            if (!this._canvas) return;
            if (this.hasAttribute('noscale')) {
              this._canvas.style.transform = 'none';
              return;
            }
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const s = Math.min(vw / this.designWidth, vh / this.designHeight);
            this._canvas.style.transform = `scale(${s})`;
          }

          _onResize() { this._fit(); }

          _onMouseMove() {
            this._flashOverlay();
          }

          _onTapBack(e) {
            e.preventDefault();
            this._go(this._index - 1, 'tap');
          }

          _onTapForward(e) {
            e.preventDefault();
            this._go(this._index + 1, 'tap');
          }

          _onKey(e) {
            const t = e.target;
            if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
            if (e.metaKey || e.ctrlKey || e.altKey) return;

            const key = e.key;
            let handled = true;

            if (key === 'ArrowRight' || key === 'PageDown' || key === ' ' || key === 'Spacebar') {
              this._go(this._index + 1, 'keyboard');
            } else if (key === 'ArrowLeft' || key === 'PageUp') {
              this._go(this._index - 1, 'keyboard');
            } else if (key === 'Home') {
              this._go(0, 'keyboard');
            } else if (key === 'End') {
              this._go(this._slides.length - 1, 'keyboard');
            } else if (key === 'r' || key === 'R') {
              this._go(0, 'keyboard');
            } else if (/^[0-9]$/.test(key)) {
              const n = key === '0' ? 9 : parseInt(key, 10) - 1;
              if (n < this._slides.length) this._go(n, 'keyboard');
            } else {
              handled = false;
            }

            if (handled) {
              e.preventDefault();
              this._flashOverlay();
            }
          }

          _go(i, reason = 'api') {
            if (!this._slides.length) return;
            const clamped = Math.max(0, Math.min(this._slides.length - 1, i));
            if (clamped === this._index) {
              this._flashOverlay();
              return;
            }
            this._index = clamped;
            this._applyIndex({ showOverlay: true, broadcast: true, reason });
          }

          // Public API ------------------------------------------------------------

          get index() { return this._index; }
          get length() { return this._slides.length; }
          goTo(i) { this._go(i, 'api'); }
          next() { this._go(this._index + 1, 'api'); }
          prev() { this._go(this._index - 1, 'api'); }
          reset() { this._go(0, 'api'); }
        }

        if (!customElements.get('deck-stage')) {
          customElements.define('deck-stage', DeckStage);
        }
      })();

            { lines: ['Bob → Alice 70 LD', 'Alice → Bob 60 LD', '...'] },
            { lines: ['Bob → Charlie 90 LD', 'Alice → You 80 LD', '...'] },

          const transactionPool = [
            ['You → Bob 25 LD', 'Charlie → Alice 20 LD', '...'],
            ['Alice → Miner 10 LD', 'Bob → You 45 LD', '...'],
            ['Charlie → Bob 35 LD', 'You → Alice 15 LD', '...'],
            ['Bob → Charlie 12 LD', 'Alice → You 22 LD', '...'],
          ];

          const shortHash = (text) => {
            let h = 2166136261;
            for (let i = 0; i < text.length; i += 1) {
              h ^= text.charCodeAt(i);
              h = Math.imul(h, 16777619);
            }
            return `0000…${(h >>> 0).toString(16).padStart(8, '0').slice(-4)}`;
          };

          const badHash = (text) => {
            let h = 0x1a2b3c4d;
            for (let i = 0; i < text.length; i += 1) {
              h ^= text.charCodeAt(i);
              h = Math.imul(h, 16777619);
            }
            const hex = (h >>> 0).toString(16).padStart(8, '0');
            return `${hex.slice(0, 4)}…${hex.slice(-4)}`;
          };

          const makeBlock = (lines, prevHash, nonceSeed) => {
            const raw = `${prevHash}|${lines.join('|')}|${nonceSeed}`;
            return {
              id: nonceSeed,
              prevHash,
              lines,
              pow: 'Proof of work',
              hash: shortHash(raw),
              brokenHash: badHash(raw + '-tampered'),
              tampered: false,
            };
          };

          const buildInitial = () => {
            const built = [];
            let prev = 'genesis';
            seedBlocks.forEach((seed, idx) => {
              const block = makeBlock(seed.lines, prev, `seed-${idx}`);
              built.push(block);
              prev = block.hash;
            });
            return built;
          };

          const [blocks, setBlocks] = React.useState(buildInitial);

          const addBlock = () => {
            setBlocks((prevBlocks) => {
              const nextIndex = prevBlocks.length;
              const lines = transactionPool[nextIndex % transactionPool.length];
              const prevHash = prevBlocks.length ? prevBlocks[prevBlocks.length - 1].hash : 'genesis';
              return [...prevBlocks, makeBlock(lines, prevHash, `new-${nextIndex}`)];
            });
          };

          const toggleTamper = (id) => {

                <Subtitle color="rgba(245,239,227,0.75)" style={{ fontSize: 40, marginTop: 48, maxWidth: 1100 }}>
                  Miners do the work, the longest chain wins, and a fixed reward schedule turns a system of strangers into Bitcoin as we know it.
                </Subtitle>
              </div>
            </SlideFrame>
          );
        }

        // ──────────────────────────────────────────────────────────────────────────
        // PART 01 — The Ledger.
        // ──────────────────────────────────────────────────────────────────────────

        // 1.1 — The cash problem. Friends exchanging cash all the time → confusing.
        // CashShuffle: 1200×520 SVG of the four friends in a 2×2 grid with a small
        // population of "live" payments. Each payment is a gold coin that travels
        // along a curved bezier from sender to recipient and fades out on arrival;
        // a new payment is spawned every ~700–950 ms so the canvas always has 2–4
        // coins in flight. A small "this week so far" counter in the top-right
        // tracks the running totals, which makes the "endless small payments"
        // claim quantitative instead of just decorative. State: a `payments` list
        // (active beziers) and a `now` timestamp, both driven by a single rAF
        // loop. Pure presentational — no user controls; just runs.
        function CashShuffle({ paused: externalPaused = false }) {
          const W = 1200, H = 520;
          const cols = { L: 280, R: 920 };
          const rows = { T: 130, B: 410 };
          const BUST_SIZE = 130;
          const PEOPLE = [
            { name: 'Alice', x: cols.L, y: rows.T },
            { name: 'Bob', x: cols.R, y: rows.T },
            { name: 'Charlie', x: cols.L, y: rows.B },
            { name: 'You', x: cols.R, y: rows.B },
          ];
          const NAMES = PEOPLE.map((p) => p.name);
          const at = (n) => PEOPLE.find((p) => p.name === n);
          // Top-row names sit above the head; bottom-row names below. The bust
          // div is taller than the visual head, so we offset it so the head lands
          // exactly on (p.x, p.y) — same math as the static layout used to use.
          const captionAboveFor = (p) => p.y === rows.T;
          const BUST_H = BUST_SIZE * 152 / 120;
          const HEAD_FROM_BUST_TOP = BUST_SIZE * 0.4;
          const CAPTION_BLOCK = Math.round(BUST_SIZE * 0.16) * 1.15 + Math.max(4, Math.round(BUST_SIZE * 0.06));
          const COLUMN_H = BUST_H + CAPTION_BLOCK;
          const HEAD_OFFSET_BELOW = COLUMN_H / 2 - HEAD_FROM_BUST_TOP;
          const HEAD_OFFSET_ABOVE = COLUMN_H / 2 - (CAPTION_BLOCK + HEAD_FROM_BUST_TOP);

          const [payments, setPayments] = React.useState([]);
          const [totals, setTotals] = React.useState({ count: 0, dollars: 0 });
          const [now, setNow] = React.useState(0);
          const lastSpawnRef = React.useRef(0);
          const idRef = React.useRef(0);
          const activeRef = React.useRef(0);
          const pausedRef = React.useRef(false);
          React.useEffect(() => { pausedRef.current = externalPaused; }, [externalPaused]);

          React.useEffect(() => {
            // Bow the arc perpendicular to the segment, picking the side that
            // points away from the canvas center so coins arc around the busts
            // instead of through them. Diagonals (Alice↔You, Bob↔Charlie) have
            // their midpoint AT center, so the dot product is ~0 — pick a side
            // at random there.
            const pickCurve = (from, to) => {
              const a = PEOPLE.find((p) => p.name === from);
              const b = PEOPLE.find((p) => p.name === to);
              const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
              const dx = b.x - a.x, dy = b.y - a.y;
              const len = Math.sqrt(dx * dx + dy * dy) || 1;
              const nx = -dy / len, ny = dx / len;
              const dot = (mx - W / 2) * nx + (my - H / 2) * ny;
              const sign = Math.abs(dot) < 1 ? (Math.random() > 0.5 ? 1 : -1) : (dot > 0 ? 1 : -1);
              return sign * (50 + Math.random() * 32);
            };
            // Pick a fresh payment that doesn't perfectly retrace the last one.
            const lastPairRef = { from: null, to: null };
            const spawnPayment = (t) => {
              let from, to, tries = 0;
              do {
                from = NAMES[Math.floor(Math.random() * 4)];
                do { to = NAMES[Math.floor(Math.random() * 4)]; } while (to === from);
                tries++;
              } while (tries < 4 && from === lastPairRef.from && to === lastPairRef.to);
              lastPairRef.from = from; lastPairRef.to = to;
              const amount = Math.floor(Math.random() * 23) + 3; // $3–$25
              idRef.current += 1;
              const p = {
                id: idRef.current,
                from, to, amount,
                startT: t,
                duration: 2200 + Math.random() * 700,
                curve: pickCurve(from, to),
              };
              activeRef.current += 1;
              setPayments((curr) => [...curr, p]);
              setTotals((c) => ({ count: c.count + 1, dollars: c.dollars + amount }));
            };

            let raf = 0;
            const loop = (t) => {
              if (!pausedRef.current) {
                setNow(t);
                if (lastSpawnRef.current === 0) lastSpawnRef.current = t - 600;
                // Ramp up faster when the canvas is empty so it never feels dead;
                // back off when 4+ coins are already in flight.
                const interval = activeRef.current < 2 ? 420 : 760 + Math.random() * 220;
                if (t - lastSpawnRef.current > interval && activeRef.current < 5) {
                  lastSpawnRef.current = t;
                  spawnPayment(t);
                }
                setPayments((curr) => {
                  const next = curr.filter((p) => t - p.startT < p.duration);
                  if (next.length !== curr.length) {
                    activeRef.current = next.length;
                    return next;
                  }
                  return curr;
                });
              }
              raf = requestAnimationFrame(loop);
            };
            raf = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(raf);
          }, []);

          // Smooth start + decel so coins look "tossed" rather than dragged.
          const easeInOut = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);

          return (
            // The aspect-ratio box declares ONE definite dimension (width: 100%)
            // and lets max-height clamp the other — when the surrounding flex
            // column gets cramped, height hits max-height: 100% and the browser
            // recomputes width from the aspect ratio. (Setting both width AND
            // height explicitly would nuke aspect-ratio entirely.) Requires
            // `min-height: 0` on the parent flex wrapper so the wrapper itself
            // can actually shrink below its content's intrinsic size; without
            // that, the wrapper grows to fit and overflows into the SlideFooter.
            <div style={{ position: 'relative', width: '100%', maxWidth: '100%', maxHeight: '100%', aspectRatio: `${W} / ${H}`, margin: '0 auto' }}>
              <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet"
                style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>
                {payments.map((p) => {
                  const a = at(p.from), b = at(p.to);
                  const dx = b.x - a.x, dy = b.y - a.y;
                  const len = Math.sqrt(dx * dx + dy * dy) || 1;
                  const nx = -dy / len, ny = dx / len;
                  const mx = (a.x + b.x) / 2 + nx * p.curve;
                  const my = (a.y + b.y) / 2 + ny * p.curve;
                  const raw = Math.min(1, Math.max(0, (now - p.startT) / p.duration));
                  const tt = easeInOut(raw);
                  const omt = 1 - tt;
                  const cx = omt * omt * a.x + 2 * omt * tt * mx + tt * tt * b.x;
                  const cy = omt * omt * a.y + 2 * omt * tt * my + tt * tt * b.y;
                  // Brief fade in / out at the head and tail of each toss.
                  const alpha = raw < 0.08 ? raw / 0.08 : (raw > 0.9 ? Math.max(0, (1 - raw) / 0.1) : 1);
                  const color = friendColor(p.from);
                  return (
                    <g key={p.id} opacity={alpha}>
                      <path d={`M${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`}
                        fill="none" stroke={color} strokeWidth="1.5"
                        strokeDasharray="4 5" opacity="0.32" />
                      <g transform={`translate(${cx}, ${cy})`}>
                        <circle r="22" fill={COLORS.gold} stroke={color} strokeWidth="2.5" />
                        <text textAnchor="middle" y="6"
                          fontFamily={FONTS.mono} fontSize="16" fontWeight="600"
                          fill={COLORS.paper}>${p.amount}</text>
                      </g>
                    </g>
                  );
                })}
              </svg>
              <div style={{ position: 'absolute', inset: 0 }}>
                {PEOPLE.map((p) => {
                  const above = captionAboveFor(p);
                  const offset = above ? HEAD_OFFSET_ABOVE : HEAD_OFFSET_BELOW;
                  return (
                    <div key={p.name} style={{
                      position: 'absolute',
                      left: `${(p.x / W) * 100}%`,
                      top: `${(p.y / H) * 100}%`,
                      transform: `translate(-50%, calc(-50% + ${offset}px))`,
                    }}>
                      <FriendBust name={p.name} size={BUST_SIZE} captionAbove={above} />
                    </div>
                  );
                })}
              </div>
              {/* Running tallies. Anchored in viewBox-percentage space so the
                  card scales with the rest of the canvas. */}
              <div style={{
                position: 'absolute',
                top: `${(14 / H) * 100}%`,
                right: `${(18 / W) * 100}%`,
                background: COLORS.paper,
                border: `1px solid ${COLORS.rule}`,
                padding: '10px 18px',
                textAlign: 'right',
                lineHeight: 1.3,
              }}>
                <div style={{
                  fontFamily: FONTS.sans, fontSize: 13, letterSpacing: '0.2em',
                  textTransform: 'uppercase', color: COLORS.muted,
                }}>This week so far</div>
                <div style={{ fontFamily: FONTS.serif, fontSize: 24, color: COLORS.ink }}>
                  {totals.count} payments · <span style={{ color: COLORS.gold }}>${totals.dollars}</span>
                </div>
              </div>
            </div>
          );
        }

        function SlideCashProblem() {
          const { COLORS, FONTS } = window.HTCS_TOKENS;
          const [paused, setPaused] = React.useState(false);
          const togglePause = () => setPaused(p => !p);
          return (
            <SlideFrame>
              <Eyebrow>Setup</Eyebrow>
              <Title>Four friends, <em>endless</em> small payments.</Title>
              <Body size="bodyLg" style={{ marginTop: 28, maxWidth: 1300 }}>
                You and your new college friends Alice, Bob, Charlie, are constantly spotting each other for lunch, movies, and Ubers. At the end of the week, you must settle any debts. How do you keep track of who owes whom?
              </Body>
              <div style={{ flex: 1, minHeight: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', marginTop: 10 }}>

              <button onClick={togglePause} style={{

                color: paused ? COLORS.ink : COLORS.cream,
                border: `1.5px solid ${COLORS.rule}`,
                borderRadius: 4, padding: '7px 18px',
                fontFamily: FONTS.sans, fontSize: 16, cursor: 'pointer', letterSpacing: '0.08em',
                zIndex: 10,

                {paused ? '▶ RESUME' : '⏸ PAUSE'}

        // 1.2 — Enter the ledger: write transactions down, settle once a month.
        function SlideEnterTheLedger() {
          const W = 460, H = 400;
          const POS = {
            Alice: { x: 110, y: 100 },
            Bob: { x: 350, y: 100 },
            Charlie: { x: 110, y: 300 },
            You: { x: 350, y: 300 },
          };
          const NAMES = ['Alice', 'Bob', 'Charlie', 'You'];

          const [payments, setPayments] = React.useState([]);
          const [ledger, setLedger] = React.useState([]);
          const [now, setNow] = React.useState(0);
          const [paused, setPaused] = React.useState(false);
          const lastSpawnRef = React.useRef(0);
          const idRef = React.useRef(0);
          const activeRef = React.useRef(0);
          const pausedRef = React.useRef(false);
          const paymentsRef = React.useRef([]);
          const togglePause = () => { pausedRef.current = !pausedRef.current; setPaused(pausedRef.current); };

              const dx = b.x - a.x, dy = b.y - a.y;

              const nx = -dy / len, ny = dx / len;
              const dot = (mx - W / 2) * nx + (my - H / 2) * ny;
              const sign = Math.abs(dot) < 1 ? (Math.random() > 0.5 ? 1 : -1) : (dot > 0 ? 1 : -1);
              return sign * (40 + Math.random() * 25);
            };
            const lastPairRef = { from: null, to: null };
            const spawnPayment = (t) => {
              let from, to, tries = 0;
              do {
                from = NAMES[Math.floor(Math.random() * 4)];
                do { to = NAMES[Math.floor(Math.random() * 4)]; } while (to === from);
                tries++;
              } while (tries < 4 && from === lastPairRef.from && to === lastPairRef.to);
              lastPairRef.from = from; lastPairRef.to = to;
              const amount = Math.floor(Math.random() * 23) + 3;
              idRef.current += 1;
              const p = { id: idRef.current, from, to, amount, startT: t, duration: 2400 + Math.random() * 600, curve: pickCurve(from, to) };
              activeRef.current += 1;
              paymentsRef.current = [...paymentsRef.current, p];
              setPayments(prev => [...prev, p]);
            };
            let raf = 0;
            const loop = (t) => {
              if (!pausedRef.current) {
                setNow(t);
                if (lastSpawnRef.current === 0) lastSpawnRef.current = t - 600;
                const interval = activeRef.current < 2 ? 450 : 800 + Math.random() * 200;
                if (t - lastSpawnRef.current > interval && activeRef.current < 4) {

                  spawnPayment(t);
                }
                const current = paymentsRef.current;
                const done = current.filter(p => t - p.startT >= p.duration);
                const next = current.filter(p => t - p.startT < p.duration);
                if (done.length > 0) {
                  paymentsRef.current = next;
                  activeRef.current = next.length;
                  setPayments(next);
                  setLedger(prev => [...prev, ...done.map(p => ({
                    id: p.id, from: p.from, verb: p.from === 'You' ? 'pay' : 'pays', to: p.to, amount: p.amount,
                  }))].slice(-7));
                }
              }
              raf = requestAnimationFrame(loop);
            };
            raf = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(raf);
          }, []);

          const easeInOut = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);

          return (
            <SlideFrame>
              <style>{`@keyframes ledgerEntryIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }`}</style>

                <div style={{ border: `1.5px solid ${COLORS.rule}`, padding: '28px 36px', alignSelf: 'stretch', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
                  <div style={{ textAlign: 'center', fontFamily: FONTS.serif, fontSize: 38, marginBottom: 16, borderBottom: `1px solid ${COLORS.rule}`, paddingBottom: 14 }}>Ledger</div>
                  {ledger.length === 0 ? (
                    <div style={{ fontSize: 26, fontFamily: FONTS.serif, color: COLORS.muted, fontStyle: 'italic', textAlign: 'center', padding: '20px 0' }}>
                      waiting for transactions…
                    </div>
                  ) : (
                    ledger.map(({ id, from, verb, to, amount }) => (
                      <div key={id} style={{ fontSize: 28, padding: '9px 0', fontFamily: FONTS.serif, animation: 'ledgerEntryIn 0.35s ease forwards' }}>

                        const my = (a.y + b.y) / 2 + ny * p.curve;
                        const raw = Math.min(1, Math.max(0, (now - p.startT) / p.duration));
                        const tt = easeInOut(raw);
                        const omt = 1 - tt;
                        const cx = omt * omt * a.x + 2 * omt * tt * mx + tt * tt * b.x;
                        const cy = omt * omt * a.y + 2 * omt * tt * my + tt * tt * b.y;
                        const alpha = raw < 0.08 ? raw / 0.08 : (raw > 0.9 ? Math.max(0, (1 - raw) / 0.1) : 1);
                        const color = friendColor(p.from);
                        return (
                          <g key={p.id} opacity={alpha}>
                            <path d={`M${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`}

                              <circle r="20" fill={COLORS.gold} stroke={color} strokeWidth="2.5" />
                              <text textAnchor="middle" y="6"
                                fontFamily={FONTS.mono} fontSize="13" fontWeight="600"
                                fill={COLORS.paper}>${p.amount}</text>
                            </g>

                    </svg>
                    <div style={{ position: 'absolute', inset: 0 }}>
                      {Object.entries(POS).map(([name, p]) => (
                        <div key={name} style={{
                          position: 'absolute',
                          left: `${(p.x / W) * 100}%`,
                          top: `${(p.y / H) * 100}%`,
                          transform: 'translate(-50%, -50%)',
                        }}>
                          <FriendBust name={name} size={82} />
                        </div>
                      ))}
                    </div>
                  </div>
                  <Body size="body" style={{ textAlign: 'center' }}>
                    <strong>End of the month, you tally up all the debts.</strong>
                    <p>One settlement instead of a hundred.</p>

              </div>
              <button onClick={togglePause} style={{
                position: 'absolute', bottom: 90, right: 36,
                background: paused ? COLORS.gold : COLORS.ink,
                color: paused ? COLORS.ink : COLORS.cream,

                zIndex: 10,

              </button>
            </SlideFrame>
          );
        }

        // 1.3 — Protocol v1: anyone can add a line. Where does this go wrong?
        function SlideProtocolV1() {
          const rules = [

        // 1.4 — Sign every transaction. Live ECDSA P-256 demo via WebCrypto.
        // Alice generates a keypair on mount; "Sign" produces a real signature
        // over the message; the right-hand "Verify" pane auto-checks on every
        // keystroke so editing the received message flips the badge red in
        // real time — the visual proof that signatures bind to exact bytes.
        function bytesToHex(bytes) {
          return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
        }
        function truncHex(hex, head = 16, tail = 8) {
          if (!hex || hex.length <= head + tail + 1) return hex || '';
          return `${hex.slice(0, head)}…${hex.slice(-tail)}`;
        }

        function SigningDemo() {
          const [signMsg, setSignMsg] = React.useState('Alice pays Bob $100');
          const [verifyMsg, setVerifyMsg] = React.useState('');
          const [signedMsg, setSignedMsg] = React.useState('');
          const [sigHex, setSigHex] = React.useState('');
          const [pubHex, setPubHex] = React.useState('');
          const [verifyState, setVerifyState] = React.useState('idle'); // idle | ok | fail
          const [error, setError] = React.useState('');
          const keysRef = React.useRef(null);
          const sigBytesRef = React.useRef(null);

          // Generate Alice's ECDSA P-256 keypair once.
          React.useEffect(() => {
            let cancelled = false;
            (async () => {
              try {
                if (!window.crypto || !window.crypto.subtle) {
                  throw new Error('WebCrypto unavailable in this context.');
                }
                const kp = await crypto.subtle.generateKey(
                  { name: 'ECDSA', namedCurve: 'P-256' },
                  true,
                  ['sign', 'verify']
                );
                const rawPub = await crypto.subtle.exportKey('raw', kp.publicKey);
                if (cancelled) return;
                keysRef.current = kp;
                setPubHex(bytesToHex(new Uint8Array(rawPub)));
              } catch (e) {
                if (!cancelled) setError(String(e.message || e));
              }
            })();
            return () => { cancelled = true; };
          }, []);

          const handleSign = async () => {
            if (!keysRef.current) return;
            try {
              const data = new TextEncoder().encode(signMsg);
              const sig = await crypto.subtle.sign(
                { name: 'ECDSA', hash: 'SHA-256' },
                keysRef.current.privateKey,
                data
              );
              const sigBytes = new Uint8Array(sig);
              sigBytesRef.current = sigBytes;
              setSigHex(bytesToHex(sigBytes));
              setSignedMsg(signMsg);
              setVerifyMsg(signMsg);
              setVerifyState('ok'); // freshly signed → must verify
            } catch (e) {
              setError(String(e.message || e));
            }
          };

          // Auto-verify whenever the verify pane changes (or a new signature lands).
          React.useEffect(() => {
            if (!keysRef.current || !sigBytesRef.current) return;
            let cancelled = false;
            (async () => {
              try {
                const data = new TextEncoder().encode(verifyMsg);
                const ok = await crypto.subtle.verify(
                  { name: 'ECDSA', hash: 'SHA-256' },
                  keysRef.current.publicKey,
                  sigBytesRef.current,
                  data
                );
                if (!cancelled) setVerifyState(ok ? 'ok' : 'fail');
              } catch (e) {
                if (!cancelled) setError(String(e.message || e));
              }
            })();
            return () => { cancelled = true; };

        // 1.5 — But Bob can copy a signed transaction → unique IDs prevent replay.

            const baseX = startX + i * (PAIR_W + PAIR_GAP);

        // 3.3 — Cryptographic hash refresher. Live SHA-256 box: type anything, watch

        // "Guess #N" preset chips give a one-click way to demonstrate that two
        // nearly-identical inputs produce two completely unrelated digests — the
        // setup the next slide ("find a hash with thirty leading zeros") needs.
        function useSha256(text) {
          const [hash, setHash] = React.useState('');
          React.useEffect(() => {
            let active = true;
            const enc = new TextEncoder().encode(text);
            crypto.subtle.digest('SHA-256', enc).then((buf) => {
              if (!active) return;
              const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
              setHash(hex);
            });
            return () => { active = false; };
          }, [text]);
          return hash;
        }

        // 3.4 — Proof of work: find a value so that SHA256(block + value) starts with N zeros.

  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,

}
function leadingZeroBits(state) {
  let bits = 0;
  for (let i = 0; i < 8; i++) {
    const v = state[i] >>> 0;
    if (v === 0) { bits += 32; }
    else { return bits + Math.clz32(v); }
  }
  return bits;
}
function toHex(state) {
  let s = '';
  for (let i = 0; i < 8; i++) s += (state[i] >>> 0).toString(16).padStart(8, '0');
  return s;
}
let stopped = false;
onmessage = (e) => {
  if (e.data && e.data.cmd === 'stop') { stopped = true; return; }
  stopped = false;
  const { prefix, difficulty } = e.data;
  const enc = new TextEncoder();
  const prefixBytes = enc.encode(prefix);
  const buf = new Uint8Array(prefixBytes.length + 32);
  buf.set(prefixBytes, 0);
  let nonce = 0, tried = 0, bestZeros = 0, bestNonce = 0, bestHash = '';
  const startedAt = performance.now();
  let lastReport = startedAt;
  while (!stopped) {
    const nonceStr = nonce.toString();
    for (let i = 0; i < nonceStr.length; i++) buf[prefixBytes.length + i] = nonceStr.charCodeAt(i);
    const view = buf.subarray(0, prefixBytes.length + nonceStr.length);
    const state = sha256(view);
    const z = leadingZeroBits(state);
    tried++;
    if (z > bestZeros) {
      bestZeros = z; bestNonce = nonce; bestHash = toHex(state);
    }
    if (z >= difficulty) {
      const now = performance.now();
      const hps = Math.round(tried / Math.max(0.001, (now - startedAt) / 1000));
      postMessage({ type: 'found', nonce, hash: toHex(state), tried, hps, bestZeros: z, bestNonce: nonce, bestHash: toHex(state) });
      return;
    }
    if ((tried & 8191) === 0) {
      const now = performance.now();
      if (now - lastReport > 100) {
        const hps = Math.round(tried / ((now - startedAt) / 1000));
        postMessage({ type: 'progress', tried, hps, bestZeros, bestNonce, bestHash });
        lastReport = now;
      }
    }
    nonce++;
  }
};
`;

        function NonceMiner({ defaultDifficulty = 18, prefix = 'block #4242 — Alice paid Bob 50 LD nonce=' }) {
          const ZERO_HASH = '0'.repeat(64);
          const PRESETS = [{ label: 'Easy', bits: 12 }, { label: 'Medium', bits: 18 }, { label: 'Hard', bits: 24 }];
          const [difficulty, setDifficulty] = React.useState(defaultDifficulty);
          const [ledgerText, setLedgerText] = React.useState(prefix);
          const [running, setRunning] = React.useState(false);
          const [stats, setStats] = React.useState({ tried: 0, hps: 0, bestZeros: 0, bestHash: '', bestNonce: 0 });
          const [winner, setWinner] = React.useState(null);
          const [elapsed, setElapsed] = React.useState(0);
          const workerRef = React.useRef(null);
          const urlRef = React.useRef(null);
          const timerRef = React.useRef(null);
          const startTimeRef = React.useRef(null);

          const teardown = React.useCallback(() => {
            if (workerRef.current) { workerRef.current.terminate(); workerRef.current = null; }
            if (urlRef.current) { URL.revokeObjectURL(urlRef.current); urlRef.current = null; }
            if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
          }, []);

          const stop = React.useCallback(() => { teardown(); setRunning(false); }, [teardown]);

          React.useEffect(() => () => teardown(), [teardown]);

          const start = () => {
            teardown();
            setStats({ tried: 0, hps: 0, bestZeros: 0, bestHash: '', bestNonce: 0 });
            setWinner(null);
            setElapsed(0);
            setRunning(true);
            startTimeRef.current = performance.now();
            timerRef.current = setInterval(() => {
              setElapsed(Math.floor((performance.now() - startTimeRef.current) / 1000));
            }, 200);
            const blob = new Blob([NONCE_WORKER_SRC], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            const w = new Worker(url);
            urlRef.current = url;
            workerRef.current = w;
            w.onmessage = (ev) => {
              const m = ev.data;
              if (m.type === 'progress') {
                setStats({ tried: m.tried, hps: m.hps, bestZeros: m.bestZeros, bestHash: m.bestHash, bestNonce: m.bestNonce });
              } else if (m.type === 'found') {
                setStats({ tried: m.tried, hps: m.hps, bestZeros: m.bestZeros, bestHash: m.hash, bestNonce: m.nonce });
                setWinner({ nonce: m.nonce, hash: m.hash });
                setElapsed(Math.round((performance.now() - startTimeRef.current) / 1000));
                setRunning(false);
                teardown();
              }
            };
            w.postMessage({ prefix: ledgerText, difficulty });
          };

          const displayHash = stats.bestHash || ZERO_HASH;
          const goldHexCount = Math.min(displayHash.length, Math.floor(stats.bestZeros / 4));
          const goldPart = displayHash.slice(0, goldHexCount);
          const restPart = displayHash.slice(goldHexCount);
          const formatN = (n) => n.toLocaleString();
          const verifyInput = winner ? `${ledgerText}${winner.nonce}` : '';
          const verifyHash = useSha256(verifyInput);
          const verified = winner && verifyHash && verifyHash === winner.hash;
          const nibblesForBinary = Math.min(
            displayHash.length,
            Math.ceil(Math.max(40, stats.bestZeros + 16) / 4),

          const progress = difficulty > 0 ? Math.min(1, stats.bestZeros / difficulty) : 0;
          const eta = stats.hps > 0 && !winner
            ? Math.max(0, Math.round((Math.pow(2, difficulty) - stats.tried) / stats.hps))
            : null;
          const fmtTime = (s) => s >= 3600
            ? `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`
            : s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s`

          return (
            <div style={{ background: COLORS.ink, color: COLORS.paper, padding: '18px 24px', fontFamily: FONTS.mono, fontSize: 18, lineHeight: 1.35, border: `2px solid ${winner ? COLORS.gold : 'transparent'}`, transition: 'border-color 0.4s' }}>
              <div style={{ marginBottom: 12 }}>
                <div style={{ fontFamily: FONTS.sans, fontSize: 14, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'rgba(251,247,238,0.55)', marginBottom: 8 }}>
                  Ledger payload (students can edit and mine their own)
                </div>
                <textarea
                  value={ledgerText}
                  onChange={(e) => setLedgerText(e.target.value)}
                  disabled={running}
                  spellCheck={false}
                  style={{
                    width: '100%',
                    minHeight: 56,
                    resize: 'vertical',
                    background: 'rgba(127,179,255,0.10)',
                    color: '#7FB3FF',
                    border: '1px solid rgba(127,179,255,0.45)',
                    fontFamily: FONTS.mono,
                    fontSize: 16,
                    lineHeight: 1.35,
                    padding: '8px 10px',
                    outline: 'none',

                />
              </div>
              <div style={{ fontSize: 17, lineHeight: 1.3 }}>
                <span style={{ color: COLORS.gold }}>SHA256</span>( ledger +{' '}
                <span style={{ color: '#7FB3FF' }}>nonce={formatN(stats.bestNonce)}</span> ) =
              </div>
              <div style={{ marginTop: 10, display: 'grid', gridTemplateColumns: '1.35fr 1fr', gap: 18 }}>
                <div>
                  <div style={{ fontFamily: FONTS.sans, fontSize: 12, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'rgba(251,247,238,0.55)', marginBottom: 6 }}>
                    Binary <span style={{ textTransform: 'none', letterSpacing: 'normal', color: 'rgba(251,247,238,0.45)' }}>(MSB first)</span>
                  </div>
                  <div style={{ fontSize: 15, lineHeight: 1.5, wordBreak: 'break-all' }}>
                    {leadingBits.split('').map((bit, i) => (
                      <span
                        key={i}
                        style={{
                          color: i < stats.bestZeros ? COLORS.gold : 'rgba(251,247,238,0.42)',
                          fontWeight: i < stats.bestZeros ? 600 : 400,
                          marginRight: (i + 1) % 4 === 0 ? 6 : 1,
                        }}
                      >
                        {bit}
                      </span>
                    ))}
                    {showEllipsis && (
                      <span style={{ color: 'rgba(251,247,238,0.35)', marginLeft: 4 }}>⋯</span>

                  </div>
                </div>
                <div>
                  <div style={{ fontFamily: FONTS.sans, fontSize: 12, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'rgba(251,247,238,0.55)', marginBottom: 6 }}>Hex</div>
                  <div style={{ wordBreak: 'break-all', letterSpacing: '0.03em', minHeight: 32, fontSize: 15, lineHeight: 1.45 }}>
                    <span style={{ color: COLORS.gold, fontWeight: 600 }}>{goldPart}</span>
                    <span style={{ color: COLORS.paper, opacity: stats.bestHash ? 1 : 0.35 }}>{restPart}</span>
                  </div>
                </div>
              </div>
              {/* Progress bar */}
              <div style={{ marginTop: 12, height: 6, background: 'rgba(251,247,238,0.12)', borderRadius: 3, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${progress * 100}%`, background: winner ? COLORS.ok : COLORS.gold, transition: 'width 0.15s ease, background 0.4s', borderRadius: 3 }} />
              </div>
              <div style={{ marginTop: 4, fontFamily: FONTS.sans, fontSize: 12, color: 'rgba(251,247,238,0.45)', display: 'flex', justifyContent: 'space-between' }}>
                <span>Leading zeros: {stats.bestZeros} / {difficulty}</span>
                <span>{winner ? 'Found!' : eta !== null ? `ETA \u2248 ${fmtTime(eta)}` : ''}</span>
              </div>
              <div style={{ marginTop: 14, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap' }}>
                <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
                  <button
                    onClick={running ? stop : start}
                    style={{
                      fontFamily: FONTS.sans, fontSize: 16, fontWeight: 600,
                      letterSpacing: '0.10em', textTransform: 'uppercase',
                      background: running ? COLORS.danger : COLORS.gold,
                      color: running ? COLORS.paper : COLORS.ink,
                      border: 'none', padding: '9px 18px', cursor: 'pointer', minWidth: 138,
                    }}
                  >
                    {running ? 'Stop' : winner ? 'Mine again' : 'Start mining'}
                  </button>
                  {(running || winner) && (
                    <span style={{ fontFamily: FONTS.mono, fontSize: 16, color: winner ? COLORS.gold : 'rgba(251,247,238,0.65)' }}>
                      {fmtTime(elapsed)}
                    </span>
                  )}
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6, alignItems: 'flex-end' }}>
                  <div style={{ display: 'flex', gap: 6 }}>
                    {PRESETS.map(({ label, bits }) => (
                      <button
                        key={label}

                        style={{
                          fontFamily: FONTS.sans, fontSize: 12, fontWeight: 600,

        // 4.1 — Conflicting chains. Two miners find a block at the same time.
        function ForkRace() {
          const MAX_VIS = 5;
          const mkBlocks = (n) => Array.from({ length: n }, (_, i) => ({ id: i + 1, fresh: false }));
          const [blocksA, setBlocksA] = React.useState(() => mkBlocks(4));
          const [blocksB, setBlocksB] = React.useState(() => mkBlocks(4));
          const [running, setRunning] = React.useState(false);

          const addBlock = (setter) => {
            setter(prev => {
              const nextId = prev[prev.length - 1].id + 1;
              return [...prev.map(b => ({ ...b, fresh: false })), { id: nextId, fresh: true }];
            });
            setTimeout(() => setter(prev => prev.map(b => ({ ...b, fresh: false }))), 480);
          };

          React.useEffect(() => {
            if (!running) return;
            const id = setInterval(() => {
              if (Math.random() < 0.5) addBlock(setBlocksA);
              else addBlock(setBlocksB);
            }, 950);
            return () => clearInterval(id);
          }, [running]);

          const lenA = blocksA.length;
          const lenB = blocksB.length;

              background: COLORS.gold, padding: '2px 10px',

          return (
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 16, marginTop: 10 }}>

        function SlideConflictingChains() {
